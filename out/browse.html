<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>408 真题题库索引 · 按考纲知识点检索</title>
<style>
:root{
  --paper:#f6f2e9; --panel:#fcfaf5; --ink:#1a1613; --ink2:#4a423a; --ink3:#8a7f72;
  --rule:#e0d8c9; --rule2:#cfc4b0;
  --DS:#1f5fa8; --CO:#a83226; --OS:#1c6b3c; --NET:#96650a;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:14.5px; line-height:1.7;
  background-image:radial-gradient(rgba(160,140,110,.055) 1px,transparent 1px);
  background-size:3px 3px;
}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:306px minmax(0,1fr);min-height:100vh}
aside{
  position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);
  border-right:1px solid var(--rule);padding:22px 0 60px;
}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:4px}
.brand{padding:0 22px 16px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.brand h1{font-family:var(--serif);font-size:19px;margin:0 0 4px;letter-spacing:.5px;font-weight:600}
.brand p{margin:0;font-size:11.5px;color:var(--ink3);letter-spacing:.4px}
.brand .stat{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.brand .stat b{color:var(--ink);font-weight:600}

.sb-group{margin:0 0 2px}
.sb-row{
  display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;
  font:inherit;color:var(--ink2);text-align:left;cursor:pointer;
  padding:6px 22px 6px 18px;border-left:2px solid transparent;transition:.14s;
}
.sb-row:hover{background:rgba(0,0,0,.035);color:var(--ink)}
.sb-row.on{background:rgba(0,0,0,.05);color:var(--ink);border-left-color:var(--ac,var(--ink))}
.sb-row .cdot{width:7px;height:7px;border-radius:50%;background:var(--ac,var(--ink3));flex:none}
.sb-row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-row .num{font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex:none}
.sb-sub{padding-left:34px;font-size:13.2px}
.sb-kp{padding-left:48px;font-size:12.4px;color:var(--ink3)}
.sb-kp .lbl{white-space:normal;line-height:1.45}
.sb-ch{cursor:pointer;user-select:none}
.sb-ch .chev{font-size:9px;color:var(--ink3);transition:transform .18s;flex:none;width:9px}
.sb-ch.open .chev{transform:rotate(90deg)}
.sb-kids{display:none}
.sb-kids.open{display:block;animation:slidedown .18s ease-out}
@keyframes slidedown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sb-head{padding:14px 22px 6px;font-size:10.5px;letter-spacing:1.6px;color:var(--ink3);
  text-transform:uppercase;font-family:var(--mono)}

/* ---------- main ---------- */
main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(246,242,233,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
  padding:12px 30px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.search{position:relative;flex:1;min-width:220px;max-width:430px}
.search input{
  width:100%;padding:8px 34px 8px 32px;border:1px solid var(--rule2);border-radius:3px;
  background:#fff;font:inherit;font-size:13.5px;color:var(--ink);outline:none;transition:.14s;
}
.search input:focus{border-color:var(--ink2);box-shadow:0 0 0 3px rgba(26,22,19,.06)}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px}
.search .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:10px;color:var(--ink3);border:1px solid var(--rule2);
  border-radius:3px;padding:0 4px;background:var(--panel)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--rule2);background:#fff;border-radius:999px;
  font:inherit;font-size:12px;padding:4px 12px;cursor:pointer;color:var(--ink2);transition:.14s;
}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.ac.on{background:var(--ac);border-color:var(--ac);color:#fff}
.meta{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.meta b{color:var(--ink);font-size:13px}
.btnlink{border:0;background:none;font:inherit;font-size:12px;color:var(--ink3);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btnlink:hover{color:var(--ink)}

.doc{padding:30px 30px 120px;max-width:1040px}
.crumb{font-size:12px;color:var(--ink3);margin-bottom:6px;font-family:var(--mono);letter-spacing:.3px}
h2.view{font-family:var(--serif);font-size:27px;font-weight:600;margin:0 0 4px;letter-spacing:.6px}
.view-sub{margin:0 0 24px;color:var(--ink2);font-size:13px}

/* year block */
.yearblock{scroll-margin-top:80px;margin-bottom:30px}
.yearhead{
  display:flex;align-items:baseline;gap:12px;padding-bottom:6px;margin-bottom:2px;
  border-bottom:2px solid var(--ink);position:sticky;top:57px;background:var(--paper);z-index:5;
}
.yearhead .yy{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:1px}
.yearhead .yc{font-family:var(--mono);font-size:11px;color:var(--ink3)}

/* question row */
.q{
  display:grid;grid-template-columns:46px 1fr 44px;gap:14px;align-items:start;
  padding:11px 4px 11px 0;border-bottom:1px solid var(--rule);
  position:relative;scroll-margin-top:96px;transition:background .12s;
}
.q:before{
  content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:2px;
  background:var(--ac);transform:scaleY(0);transform-origin:top;transition:transform .16s;
}
.q:hover{background:rgba(255,255,255,.7)}
.q:hover:before{transform:scaleY(1)}
.q.flash{animation:flash 1.5s ease-out}
.qwrap.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:rgba(255,214,102,.55)}100%{background:transparent}}
.qno{
  font-family:var(--mono);font-size:13px;color:var(--ink);text-align:right;
  padding-top:1px;letter-spacing:-.5px;
}
.qno span{display:block;font-size:9.5px;color:var(--ink3);letter-spacing:0;margin-top:1px}
.qbody{min-width:0}
.qstem{color:var(--ink);font-size:13.8px;line-height:1.65}
.qtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.tag{
  font-size:10.5px;padding:1px 7px;border-radius:2px;letter-spacing:.2px;
  border:1px solid transparent;white-space:nowrap;
}
.tag.kp{background:rgba(0,0,0,.045);color:var(--ink2);cursor:pointer;border-color:var(--rule)}
.tag.kp:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.tag.ch{background:none;color:var(--ink3);border-color:var(--rule2)}
.tag.sec{background:none;color:var(--ink3);border-color:var(--rule2)}
.tag.type{font-family:var(--mono);background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.type.t1{background:var(--ac);border-color:var(--ac);color:#fff}
.qpts{
  font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right;padding-top:1px;
}
.qpts b{font-size:14px;color:var(--ink)}
/* 解析展开 */
.qwrap{scroll-margin-top:96px}
.qwrap .q{scroll-margin-top:96px}
.tag.ans{background:#e6f4ea;color:#1c6b3c;border-color:#b7dfc4;font-family:var(--mono)}
.tag.nox{background:none;color:#b3a99c;border-color:var(--rule)}
.xbtn{
  border:1px solid var(--rule2);background:#fff;border-radius:2px;font:inherit;
  font-size:10.5px;padding:1px 8px;color:var(--ink2);cursor:pointer;letter-spacing:.2px;
}
.xbtn:hover{border-color:var(--ac,var(--acc));color:var(--ac,var(--acc));background:#fff}
.qexp{
  margin:-2px 0 10px 60px;padding:12px 16px;background:#fffdf8;
  border:1px solid var(--rule);border-left:3px solid var(--ac,var(--acc));border-radius:0 4px 4px 0;
  font-size:13.2px;line-height:1.85;color:var(--ink2);animation:rise .18s ease-out;
}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.qexp .fs{font-family:var(--serif);font-size:13.8px;color:var(--ink);margin-bottom:10px;
  padding-bottom:9px;border-bottom:1px dashed var(--rule)}
.qexp .olist{margin:0 0 10px;padding:0;list-style:none}
.qexp .olist li{padding:3px 0 3px 4px;color:var(--ink)}
.qexp .olist li b{font-family:var(--mono);color:var(--ink3);margin-right:4px}
.qexp .olist li.ok{background:#e6f4ea;border-radius:3px}
.qexp .olist li.ok b{color:var(--ok)}
.qexp .aline{font-family:var(--mono);font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.qexp .aline b{color:var(--ok);font-size:14px}
.qexp .xbody{color:var(--ink2)}
.qexp .xbody b{color:var(--ink)}
.qexp .qimg{margin:0 0 12px;text-align:center;position:relative}
.qexp .qimg img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:3px;background:#fff}
.qexp .imtag{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:10px;
  color:var(--ink3);letter-spacing:.5px}
@media (max-width:700px){.qexp{margin-left:0}}
.copylink{
  position:absolute;right:0;top:-2px;border:0;background:none;cursor:pointer;
  font-size:11px;color:var(--ink3);opacity:0;transition:.14s;font-family:var(--mono);
}
.q:hover .copylink{opacity:1}
.copylink:hover{color:var(--ink)}

.empty{padding:60px 0;text-align:center;color:var(--ink3);font-size:13px}
.empty b{display:block;font-family:var(--serif);font-size:19px;color:var(--ink2);margin-bottom:6px}

footer.docfoot{margin-top:44px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:11.5px;color:var(--ink3);font-family:var(--mono)}

/* mobile */
.menubtn{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;z-index:60;width:290px;transform:translateX(-100%);
    transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.18)}
  aside.open{transform:none}
  .menubtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule2);
    background:#fff;border-radius:3px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
  .doc{padding:20px 16px 100px}
  .topbar{padding:10px 14px}
  .q{grid-template-columns:36px 1fr 40px;gap:10px}
  .yearhead{top:52px}
}
@media print{
  aside,.topbar,.copylink{display:none!important}
  .shell{grid-template-columns:1fr}
  .doc{max-width:none;padding:0}
  body{background:#fff}
}

.rt p.para{margin:0 0 8px}
.rt p.para:last-child{margin-bottom:0}
.rt pre.code{margin:8px 0 12px;padding:10px 12px;background:#f7f4ec;border:1px solid var(--rule);
  border-left:3px solid var(--ac,#8a7f72);border-radius:3px;overflow-x:auto;
  font-family:var(--mono);font-size:12.4px;line-height:1.62;white-space:pre;color:#2b2622;
  -webkit-text-size-adjust:100%}
.rt{word-break:break-word}
</style>
</head>

  </main>

码，分号后为尾数），Y 的浮点数格式为\n00,101;00,10100。然后根据浮点数的加法步骤进行运算。\n第一步：对阶。X、Y 阶码相减，即00, 111-00, 101 = 00, 111+11, 0111 = 00, 010, 可知X\n的阶码比Y 的价码大2 (这一步可直接目测）。根据小阶向大阶看齐的原则，将Y 的阶码加2,\n尾数右移2 位，将Y 变为00, 111; 00, 00101。\n第二步：尾数相加。即00, 11101 + 00, 00101 = 01, 00010, 尾数相加结果符号位为01, 故\n需右规。\n第三步：规格化。将尾数右移l位，阶码加1, 得X","im":"qimg/2009_13.png","imscan":1},{"y":2009,"q":14,"t":0,"s":"CO","ch":"存储器层次结构","sec":"高速缓冲存储器","kp":"CO.3.5","kn":"Cache 基本原理与映射方式（直接/全相联/组相联）","p":2,"st":"某计算机的Cache共有16块，采用2 路组相联映射方式（即每组2块)。每个主存块 大小为32B，按字节编址。主存129号单元所在主存块应装入到的Cache 组号是 A. 0 B. 1 C. 4 D. 6","o":["0","1","4","6"],"a":"C","x":"由于Cache共有16块，采用2路组相联，因此共分为8组，组号为0,1, 2, …，7。主存的\n某一字块按模8映射到Cache某组的任一字块中，即主存的第0, 8, 16, …字块可以映射到Cache\n第0组的任一字块中。每个主存块大小为32字节，故129号单元位于第4块主存块（注意是从\n0开始），因此将映射到Cache第4组的任一字块中。\n1 5. 解析：\n首先确定ROM的个数，ROM区为4KB,\n选用2Kx8位的ROM芯片，需要4Kx8\n—= \n2Kx8 \n2片，\n60Kx8 \n采用字扩展方式；RAM区为60KB,\n选用4Kx4位的RAM芯片，需要\n=30片，采用字\n4Kx4 \n和位同时扩展方式。","im":"qimg/2009_14.png","imscan":1},{"y":2009,"q":15,"t":0,"s":"CO","ch":"存储器层次结构","sec":"主存储器","kp":"CO.3.2","kn":"主存容量扩展与CPU连接（字扩展/位扩展）","p":2,"st":"某计算机主存容量为64KB，其中ROM区为4KB，其余为RAM区，按字节编址。现 要用2K×8位的ROM芯片和4K×4位的RAM芯片来设计该存储器，则需要上述规格的ROM 芯片数和RAM芯片数分别是 A. 1、15 B. 2、15 C. 1、30 D. 2、30","o":["1、15","2、15","1、30","2、30"],"a":"D","im":"qimg/2009_15.png","imscan":1},{"y":2009,"q":16,"t":0,"s":"CO","ch":"中央处理器","sec":"CPU的功能和基本结构","kp":"CO.5.1","kn":"CPU 结构与指令执行过程","p":2,"st":"某机器字长为16位，主存按字节编址，转移指令采用相对寻址，由两个字节组成，第一 个字节为操作码字段，第二个字节为相对位移量字段。假定取指令时，每取一个字节PC自动 加1。若某转移指令所在主存地址为2000H，相对位移量字段的内容为06H，则该转移指令成 功转移后的目标地址是 A. 2006H B. ","o":["2006H","2007H","2008H","2009H"],"a":"C","x":"相对寻址EA=(PC)+A, 首先要求的是取指令后PC的值。转移指令由两个字节组成，每取\n一个字节PC值自动加1, 因此取指令后PC值为2000H + 2H = 2002H , 故EA=(PC)+A=2002H + \n06H =2008H。\n【易错点】本题易误选A或B。选项A没有考虑PC值的自动更新，选项B虽然考虑了PC\n值要自动更新，但没有注意到该转移指令是一条两字节指令，PC值仅仅\"+I\"而不是\"+2\"。","im":"qimg/2009_16.png","imscan":1},{"y":2009,"q":17,"t":0,"s":"CO","ch":"指令系统","sec":"CISC和RISC","kp":"CO.4.3","kn":"CISC 与 RISC","p":2,"st":"下列关于RISC的叙述中，错误的是 A. RISC普遍采用微程序控制器 B. RISC大多数指令在一个时钟周期内完成 C. RISC的内部通用寄存器数量相对CISC多 D. RISC 的指令数、寻址方式和指令格式种类相对CISC少","o":["RISC普遍采用微程序控制器","RISC大多数指令在一个时钟周期内完成","RISC的内部通用寄存器数量相对CISC多","RISC 的指令数、寻址方式和指令格式种类相对CISC少"],"a":"A","x":"相对千CISC, RISC的特点是指令条数少；指令长度固定，指令格式和寻址种类少；只有\n取数I存数指令访问存储器，其余指令的操作均在寄存器之间进行；CPU中通用寄存器多；大部\n分指令在一个或者小于一个机器周期内完成；以硬布线逻辑为主，不用或者少用微程序控制。\n选项B、C、D都是RISC的特点，选项A是错误的，因为RISC的速度快，所以普遍采用硬布\n线控制器，而非微程序控制器。","im":"qimg/2009_17.png","imscan":1},{"y":2009,"q":18,"t":0,"s":"CO","ch":"中央处理器","sec":"指令流水线","kp":"CO.5.5","kn":"指令流水线性能与结构/数据/控制冒险","p":2,"st":"某计算机的指令流水线由四个功能段组成，指令流经各功能段的时间（忽略各功能段 之间的缓存时间）分别为90ns、80ns、70ns、和60ns，则该计算机的CPU时钟周期至少是 A. 90ns B. 80ns C. 70ns D. 60ns","o":["90ns","80ns","70ns","60ns"],"a":"A","x":"流水线的时钟周期应以最长的执行时间为准，否则用时长的流水段的功能将不能正确\n完成。","im":"qimg/2009_18.png","imscan":1},{"y":2009,"q":19,"t":0,"s":"CO","ch":"中央处理器","sec":"控制器的功能和工作原理","kp":"CO.5.3","kn":"硬布线控制器与微程序控制器","p":2,"st":"相对于微程序控制器，硬布线控制器的特点是 A. 指令执行速度慢，指令功能的修改和扩展容易 B. 指令执行速度慢，指令功能的修改和扩展难 C. 指令执行速度快，指令功能的修改和扩展容易 D. 指令执行速度快，指令功能的修改和扩展难","o":["指令执行速度慢，指令功能的修改和扩展容易","指令执行速度慢，指令功能的修改和扩展难","指令执行速度快，指令功能的修改和扩展容易","指令执行速度快，指令功能的修改和扩展难"],"a":"D","x":"微程序控制器采用了\n“存储程序\n” 的原理，每条机器指令对应一个微程序，因此修改\n和扩充容易，灵活性好，但每条指令的执行都要访问控制存储器，所以速度慢。硬布线控制\n器采用专门的逻辑电路实现，其速度主要取决于逻辑电路的延迟，因此速度快，但修改和扩\n展困难，灵活性差。","im":"qimg/2009_19.png","imscan":1},{"y":2009,"q":20,"t":0,"s":"CO","ch":"总线与输入输出","sec":"总线","kp":"CO.6.1","kn":"总线概念、组成与性能指标/事务与定时","p":2,"st":"假设某系统总线在一个总线周期中并行传输 4B信息，一个总线周期占用2个时钟周 期，总线时钟频率为10MHz，则总线带宽是 A. 10MB/s B. 20MB/s C. 40MB/s D. 80MB/s","o":["10MB/s","20MB/s","40MB/s","80MB/s"],"a":"B","x":"总线带宽是指单位时间内总线上传输数据的位数，通常用每秒钟传送信息的字节数来衡\n量，单位Bis。由题意可知，在1个总线周期(=2个时钟周期）内传输了4字节信息，时钟周\n期=11\n0MHz = O.lµs, 故总线带宽为4B/(2xO.Iµs) = 4B/(0.2x10-6s) = 20MB/s。","im":"qimg/2009_20.png","imscan":1},{"y":2009,"q":21,"t":0,"s":"CO","ch":"存储器层次结构","sec":"高速缓冲存储器","kp":"CO.3.5","kn":"Cache 基本原理与映射方式（直接/全相联/组相联）","p":2,"st":"假设某计算机的存储系统由Cache 和主存组成，某程序执行过程中访存 1000 次，其 中访问Cache 缺失（未命中）50次，则Cache 的命中率是 A. 5% B. 9.5% C. 50% D. 95%","o":["5%","9.5%","50%","95%"],"a":"D","x":"命中率=Cache命中次数I总访问次数。需要注意的是看清题，题中说明的是缺失50次，\n而不是命中50次，仔细审题是做对题的第一步。","im":"qimg/2009_21.png","imscan":1},{"y":2009,"q":22,"t":0,"s":"CO","ch":"中央处理器","sec":"异常和中断机制","kp":"CO.5.4","kn":"异常与中断的分类、检测与响应","p":2,"st":"下列选项中，能引起外部中断的事件是 A. 键盘输入 B. 除数为0 C. 浮点运算下溢 D. 访存缺页","o":["键盘输入","除数为0","浮点运算下溢","访存缺页"],"a":"A","x":"外部中断指的是CPU执行指令以外的事件产生的中断，通常是指来自CPU与内存以外的\n中断。A中键盘输入属于外部事件，每次键盘输入CPU都需要执行中断以读入输入数据，所以\n能引起外部中断。B 中除数为0属于异常，也就是内中断，发生在CPU内部。C中浮点运算下\n溢将按机器零处理，不会产生中断。而D访存缺页属于CPU执行指令时产生的中断，也不属\n于外部中断。\n所以能产生外部中断的只能是输入设备键盘。","im":"qimg/2009_22.png","imscan":1},{"y":2009,"q":23,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"单处理机系统中，可并行的是 I进程与进程 ⅡI处理机与设备 III处理机与通道IV设备与设备 A. I、II和III B. I、II和IV C. I、Ⅲ和IV D. ⅡI、II和IV","o":["I、II和III","I、II和IV","I、Ⅲ和IV","ⅡI、II和IV"],"a":"D","x":"在单处理机系统（不包含多核的情况）中，同一时刻只能有一个进程占用处理机，因此进\n程之间不能并行执行。通道是独立于CPU的控制输入／输出的设备，两者可以并行，显然，设\n备与设备之间也是可以并行的。","im":"qimg/2009_23.png","imscan":1},{"y":2009,"q":24,"t":0,"s":"OS","ch":"进程管理","sec":"CPU调度与上下文切换","kp":"OS.2.3","kn":"CPU 调度算法（FCFS/SJF/HRRN/RR/优先级/多级反馈）","p":2,"st":"下列进程调度算法中，综合考虑进程等待时间和执行时间的是 A. 时间片轮转调度算法 B. 短进程优先调度算法 D. 高响应比优先调度算法 C. 先来先服务调度算法 该系统可能会发生死锁的K的最小值是 A. 2 B. 3 C. 4 D. 5","o":["时间片轮转调度算法","短进程优先调度算法","先来先服务调度算法 该系统可能会发生死锁的K的最小值是","高响应比优先调度算法"],"a":"D","x":"在高响应比优先调度算法中，选出响应比最高的进程投入执行，响应比R定义如下：响应\n比R=(等待时间＋执行时间）／执行时间。它综合考虑了每个进程的等待时间和执行时间，对于\n同时到达的长进程和短进程，短进程会优先执行，以提高系统吞吐量；而长进程的响应比可以\n随等待时间的增加而提高，不会产生进程无法调度的情况。","im":"qimg/2009_24.png","imscan":1},{"y":2009,"q":26,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.1","kn":"连续分配管理方式与内存管理基本概念","p":2,"st":"分区分配内存管理方式的主要保护措施是 A. 界地址保护 B. 程序代码保护 C. 数据保护 D. 栈保护","o":["界地址保护","程序代码保护","数据保护","栈保护"],"a":"A","x":"每个进程都拥有自己独立的进程空间，若一个进程在运行时所产生的地址在其地址空间之\n外，则发生地址越界，因此需要进行界地址保护，即当程序要访问某个内存单元时，由硬件检\n查是否允许，如果允许则执行，否则产生地址越界中断。","im":"qimg/2009_26.png","imscan":1},{"y":2009,"q":27,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.2","kn":"页式/段式/段页式管理","p":2,"st":"一个分段存储管理系统中，地址长度为32位，其中段号占8位，则最大段长是 D. 232B A. 2B B. 216B C. 224B","o":["2B","216B","224B","232B"],"a":"C","x":"分段存储管理的逻辑地址分为段号和位移量两部分，段内位移的最大值就是最大段长。地\n址长度为32位，段号占8位，则位移量占32-8= 24位，故最大段长为224 B。","im":"qimg/2009_27.png","imscan":1},{"y":2009,"q":28,"t":0,"s":"OS","ch":"文件管理","sec":"文件","kp":"OS.4.3","kn":"文件物理结构（连续/链接/索引分配）与混合索引","p":2,"st":"下列文件物理结构中，适合随机访问且易于文件扩展的是 A. 连续结构 B. 索引结构 C. 链式结构且磁盘块定长 D. 链式结构且磁盘块变长","o":["连续结构","索引结构","链式结构且磁盘块定长","链式结构且磁盘块变长"],"a":"B","x":"文件的物理结构包括连续、链式、索引三种，其中链式结构不能实现随机访问，连续结构\n的文件不易于扩展。因此随机访问且易于扩展是索引结构的特性。","im":"qimg/2009_28.png","imscan":1},{"y":2009,"q":29,"t":0,"s":"OS","ch":"输入输出管理","sec":"外存管理","kp":"OS.5.3","kn":"磁盘结构与磁盘调度算法（FCFS/SSTF/SCAN/CSCAN）","p":2,"st":"假设磁头当前位于第105道，正在向磁道序号增加的方向移动。现有一个磁道访问请 求序列为 35,45,12,68,110,180,170,195，采用 SCAN 调度（电梯调度）算法得到的磁道访问 序列是 A. 110,170,180,195,68,45,35,12 B. 110,68,45,35,1","o":["110,170,180,195,68,45,35,12","110,68,45,35,12,170,180,195","110,170,180,195,12,35,45,68","12,35,45,68,110,170,180,195"],"a":"A","x":"SCAN算法类似电梯的工作原理。首先，当磁头从105道向序号增加的方向移动时，便会\n按照从小到大的顺序服务所有大于105的磁道号(110,170,180,195); 往回移动时又会按照从\n大到小的顺序进行服务(68, 45, 35, 12)。","im":"qimg/2009_29.png","imscan":1},{"y":2009,"q":30,"t":0,"s":"OS","ch":"文件管理","sec":"文件","kp":"OS.4.1","kn":"文件概念/元数据/inode/文件操作","p":2,"st":"文件系统中，文件访问控制信息存储的合理位置是 A. 文件控制块 B. 文件分配表．C. 用户口令表 D. 系统注册表","o":["文件控制块","文件分配表．","用户口令表","系统注册表"],"a":"A","x":"为了实现\n“按名存取\n”，在文件系统中为每个文件设置用于描述和控制文件的数据结构，\n称之为文件控制块(FCB )。在文件控制块中，通常包含以下三类信息，即基本信息、存取控制\n信息及使用信息。","im":"qimg/2009_30.png","imscan":1},{"y":2009,"q":31,"t":0,"s":"OS","ch":"文件管理","sec":"目录","kp":"OS.4.4","kn":"目录/树形目录/硬链接与软链接","p":2,"st":"设文件F1的当前引I用计数值为1，先建立F1的符号链接（软链接）文件F2，再建立 F1的硬链接文件F3，然后删除F1。此时，F2和F3的引I用计数值分别是 A. 0、1 B. 1、1 C. 1、2 D. 2、1","o":["0、1","1、1","1、2","2、1"],"a":"B","x":"建立符号链 接时， 引用计数值直接复制；建立硬链接时， 引用计数值加1。删除文件时，删除\n操作 对于符号链接是不可见的， 这并不影响文件系统， 当以后再通过符号链接访问时， 发现文\n件 不存在， 直接删除符号链接；但对于硬链接则不可以直接删除， 引用计数值减1, 若值\n不为O, 则不能删除此文件，因为还有其他硬链接指向此文件。\n当建立F2时，Fl和F2的引用计数值都为1。当再建立F3时，Fl和F3的引用计数值就\n都变成了2。当后来删除Fl时，F3的引用计数值为2-1 = 1, F2的引用计数值一直不变。","im":"qimg/2009_31.png","imscan":1},{"y":2009,"q":32,"t":0,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.2","kn":"内核态/用户态与特权指令、系统调用","p":2,"st":"程序员利用系统调用打开I/O设备时，通常使用的设备标识是 A. 逻辑设备名 B. 物理设备名 C. 主设备号 D. 从设备号","o":["逻辑设备名","物理设备名","主设备号","从设备号"],"a":"A","x":"设备管理具有设备独立性的特点，操作系统以系统调用方式来请求某类设备时，使用的是\n逻辑设备名。而在程序实际执行时，将逻辑设备名转换为对应的物理设备名。","im":"qimg/2009_32.png","imscan":1},{"y":2009,"q":33,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络体系结构","kp":"NET.1.2","kn":"分层结构/OSI 与 TCP/IP 模型/协议服务接口","p":2,"st":"在OSI参考模型中，自下而上第一个提供端到端服务的层次是 A. 数据链路层 B. 传输层 C. 会话层 D. 应用层","o":["数据链路层","传输层","会话层","应用层"],"a":"B","x":"传输层提供应用进程间的逻辑通信（通过端口号），即端到端的通信。而数据链路层负责\n相邻结点之间的通信，这个结点包括了交换机和路由器等数据通信设备，这些设备不能称为端\n系统。网络层负责主机到主机的逻辑通信。因此选B。","im":"qimg/2009_33.png","imscan":1},{"y":2009,"q":34,"t":0,"s":"NET","ch":"物理层","sec":"通信基础","kp":"NET.2.1","kn":"信道/码元/波特/速率等基本概念与编码调制","p":2,"st":"在无噪声情况下，若某通信链路的带宽为3kHz，采用4个相位，每个相位具有4种振 幅的QAM调制技术，则该通信链路的最大数据传输速率是 A. 12kbps B. 24kbps C. 48kbps D. 96kbps","o":["12kbps","24kbps","48kbps","96kbps"],"a":"B","x":"采用4个相位，每个相位有4种幅度的QAM调制方法，每个信号可以有16种变化，传输\n4bit的数据。根据奈奎斯特定理，信息的最大传输速率为2x3kx4= 24kbps。","im":"qimg/2009_34.png","imscan":1},{"y":2009,"q":35,"t":0,"s":"NET","ch":"数据链路层","sec":"流量控制与可靠传输机制","kp":"NET.3.2","kn":"停止等待/GBN/SR 与滑动窗口","p":2,"st":"数据链路层采用后退N帧（GBN）协议，发送方已经发送了编号为0～7的帧。当计 时器超时时，若发送方只收到0、2、3号帧的确认，则发送方需要重发的帧数是 A. 2 B. 3 C. 4 D. 5","o":["2","3","4","5"],"a":"C","x":"在后退N帧协议中，当接收方检测到某个帧出错后，则简单地丢弃该帧及其后所有的后续\n帧，发送方超时后需重传该数据帧及其后续的所有帧。这里应注意，连续ARQ协议中，接收\n方一般采用累积确认的方式，即接收方对按序到达的最后一个分组发送确认，因此本题中收到\n3的确认帧就表示编号为0, 1 , 2, 3的帧已接收，而此时发送方未收到1号帧的确认只能代表确\n认帧在返回的过程中丢失了，而不代表1号帧未到达接收方。因此需要重传的帧为编号是4, 5, 6, \n7的帧。","im":"qimg/2009_35.png","imscan":1},{"y":2009,"q":36,"t":0,"s":"NET","ch":"数据链路层","sec":"局域网与广域网","kp":"NET.3.5","kn":"以太网/IEEE 802.3/802.11/VLAN/PPP","p":2,"st":"以太网交换机进行转发决策时使用的PDU地址是 A. 目的物理地址 B. 目的IP地址·C. 源物理地址 D. 源IP地址","o":["目的物理地址","目的IP地址·","源物理地址","源IP地址"],"a":"A","x":"交换机实质上是一个多端口网桥，工作在数据链路层，数据链路层使用物理地址进行转发，\n而转发到目的地通常是使用目的地址。因此POU地址是目的物理地址。","im":"qimg/2009_36.png","imscan":1},{"y":2009,"q":37,"t":0,"s":"NET","ch":"数据链路层","sec":"介质访问控制","kp":"NET.3.4","kn":"随机访问（ALOHA/CSMA/CSMA-CD/CSMA-CA）","p":2,"st":"在一个采用CSMA/CD协议的网络中，传输介质是一根完整的电缆，传输速率为1Gbps， 电缆中的信号传播速度为200000km/s。若最小数据帧长度减少800bit，则最远的两个站点之间 的距离至少需要 A. 增加160m ·B. 增加80m C. 减少160m D. 减少80m","o":["增加160m ·","增加80m","减少160m","减少80m"],"a":"D","x":"若最短帧长减少，而数据传输速率不变，则需要使冲突域的最大距离变短来实现碰撞窗口\n的减少。碰撞窗口是指网络中收发结点间的往返时延，因此假设需要减少的最小距离为S, 则\n可以得到如下公式（注意单位的转换）：\n减少的往返时延＝减少的发送时延，即2x[s/(2xl08)] = 800/(lxl09)。即，由千帧长减少而\n缩短的发送时延，应等于由于距离减少而缩短的传播时延的2倍。\n可得s= 80, 即最远的两个站点之间的距离最少需要减少80m。\n【注意】CSM幻CD的碰撞窗口\n= 2倍传播时延，报文发送时间＞＞碰撞窗口。","im":"qimg/2009_37.png","imscan":1},{"y":2009,"q":38,"t":0,"s":"NET","ch":"传输层","sec":"TCP协议","kp":"NET.5.3","kn":"TCP 段格式/连接管理（三次握手四次挥手）","p":2,"st":"主机甲与主机乙之间已建立一个TCP连接，主机甲向主机乙发送了两个连续的TCP 段，分别包含300B和500B的有效载荷，第一个段的序列号为200，主机乙正确接收到两个段 后，发送给主机甲的确认序列号是 A. 500 B. 700 C. 800 D. 1000","o":["500","700","800","1000"],"a":"D","x":"返回的确认序列号是接收端期待收到对方下一个报文段数据部分的第一个字节的序号，因\n此乙在正确接收到两个段后，返回给甲的确认序列号是200+ 300 + 500 = 1 000。","im":"qimg/2009_38.png","imscan":1},{"y":2009,"q":39,"t":0,"s":"NET","ch":"传输层","sec":"TCP协议","kp":"NET.5.3","kn":"TCP 段格式/连接管理（三次握手四次挥手）","p":2,"st":"一个TCP连接总是以1KB 的最大段长发送TCP段，发送方有足够多的数据要发送。 当拥塞窗口为16KB时发生了超时，如果接下来的4个RTT（往返时间）时间内的TCP段的传 输都是成功的，那么当第.4个 RTT时间内发送的所有 TCP段都得到肯定应答时，拥塞窗口大 小是 A. 7KB C. 9KB B","o":["7KB","8KB","9KB","16KB"],"a":"C","x":"在发生超时后，慢开始门限ssthresh变为16KB /2= 8KB, 拥塞窗口变为1 KB。在接下来的\n3个RTT内，执行慢开始算法，拥塞窗口大小依次为2KB、4KB、8KB, 由千慢开始门限ssthresh\n\n为8KB , 因此之后转而执行拥塞避免算法，即拥塞窗口开始\n“加法增大\n”。因此第4个RTT结\n束后，拥塞窗口的大小为9KB。","im":"qimg/2009_39.png","imscan":1},{"y":2009,"q":40,"t":0,"s":"NET","ch":"应用层","sec":"FTP与电子邮件","kp":"NET.6.2","kn":"FTP/SMTP/POP3/IMAP/MIME","p":2,"st":"FTP客户和服务器间传递FTP命令时，使用的连接是 A. 建立在 TCP 之上的控制连接 B. 建立在 TCP 之上的数据连接 D. 建立在 UDP 之上的数据连接 C. 建立在 UDP 之上的控制连接 二、综合应用题（第41～47题，共70分）","o":["建立在 TCP 之上的控制连接","建立在 TCP 之上的数据连接","建立在 UDP 之上的控制连接 二、综合应用题（第41～47题，共70分）","建立在 UDP 之上的数据连接"],"a":"A","x":"对于FTP文件传输，为了保证可靠性，选择TCP协议，排除C、D。FTP的控制信息是带\n外传送的，也即FTP使用了一 kp":"DS.7.3","kn":"折半（二分）查找与判定树","p":2,"st":"已知一个长度为16的顺序表L，其元素按关键字有序排列。若采用折半查找法查找一个 L中不存在的元素，则关键字的比较次数最多的是 A. 4 B. 5 C. 6 D. 7","o":["4","5","6","7"],"a":"B","x":"折半查找法在查找成功时进行的关键字比较次数最多为Llog2刓+1, 即判定树的高度；折半\n查找法在查找不成功时进行的关键字比较次数最多为l1og2n」+ 1。题中n = 16, 因此最多比较\nL1og2t6」+1=5次。也可以画出草图求解。\n思考：若本题题干改为求最少的比较次数呢？","im":"qimg/2010_9.png","imscan":1},{"y":2010,"q":10,"t":0,"s":"DS","ch":"栈、队列和数组","sec":"栈、队列和数组的应用","kp":"DS.3.4","kn":"栈的应用（表达式/lower/递归/括号匹配）","p":2,"st":"采用递归方式对顺序表进行快速排序。下列关于递归次数的叙述中，正确的是 A. 递归次数与初始数据的排列次序无关 B. 每次划分后，先处理较长的分区可以减少递归次数 C. 每次划分后，先处理较短的分区可以减少递归次数 D. 递归次数与每次划分后得到的分区的处理顺序无关","o":["递归次数与初始数据的排列次序无关","每次划分后，先处理较长的分区可以减少递归次数","每次划分后，先处理较短的分区可以减少递归次数","递归次数与每次划分后得到的分区的处理顺序无关"],"a":"D","x":"快递排序的递归次数与元素的初始排列有关。若每次划分后分区比较平衡，则递归次数少；\n若划分后分区不平衡，则递归次数多。但快速排序的递归次数与分区处理顺序无关，即先处理\n较长的分区或先处理较短的分区都不影响递归次数。\n此外，可以形象地把快速排序的递归调用过程用一个二叉树描述，先处理较长或较短分区，\n\n可以想象为交换某一递归结点处的左右子树，这并不会影响树中的分支数。","im":"qimg/2010_10.png","imscan":1},{"y":2010,"q":11,"t":0,"s":"DS","ch":"排序","sec":"排序的基本概念","kp":"DS.8.1","kn":"排序稳定性/内外排序/比较次数与移动次数","p":2,"st":"对一组数据（2,12,16,88,5,10）进行排序，若前三趟排序结果如下： 第一趟排序结果：2,12，16,5,10,88 第二趟排序结果：2,12,5,10,16,88 第三趟排序结果：2,5,10,12,16,88 则采用的排序方法可能是 ·A. 冒泡排序 B. 希尔排序 C. 归并排序 ·D","o":["冒泡排序","希尔排序","归并排序 ·","基数排序"],"a":"A","x":"题中所给的三趟排序过程中，每一趟排序是从前往后依次比较，使最大值\n“沉底\n”，符合\n冒泡排序的特点。\n看第一趟可知仅有88被移到最后。\n•\n如果是希尔排序，则12,88, 10应变为10,12, 88 。因此排除希尔排序。\n•\n如果是归并排序，则长度为2 的子序列是有序的。因此可排除归并排序。\n•\n如果是基数排序，则16,5, 10应变为10,5, 16 。因此排除基数排序。\n提示：对于此类题，先看备选项的排序算法有什么特征，再看题目中的排序过程是否符合\n这一特征，从而得出答案。\n一般先从选项中的简单排序方法（插入排序、起泡排序、选择排序）\n开始判断，若简单排序方法不符合，再判断排序方法（希尔排序、快速排序、堆排序、归并排\n序）。","im":"qimg/2010_11.png","imscan":1},{"y":2010,"q":12,"t":0,"s":"CO","ch":"计算机系统概述","sec":"计算机性能指标","kp":"CO.1.2","kn":"性能指标（CPI/主频/MIPS/MFLOPS/加速比）","p":2,"st":"下列选项中，能缩短程序执行时间的措施是 I．提高 CPU时钟频率 II.优化数据通路结构 III．对程序进行编译优化 A. 仅I和ⅡI B. 仅I和IⅢI C. 仅II和III D. I、ⅡI和IⅢI","o":["仅I和ⅡI","仅I和IⅢI","仅II和III","I、ⅡI和IⅢI"],"a":"D","x":"CPU时钟频率（主频）越高，完成指令的一个执行步骤所用的时间就越短，执行指令的速\n度越快，I正确。数据通路的功能是实现CPU内部的运算器和寄存器以及寄存器之间的数据交\n换，优化数据通路结构，可以有效提高计算机系统的吞吐量，从而加快程序的执行，II 正确。\n计算机程序需要先转化成机器指令序列才能最终得到执行，通过对程序进行编译优化可以得到\n更优的指令序列，从而使得程序的执行时间也越短，III正确。\n【另解】定量分析：CPU 执行时间＝（程序指令条数x每条指令时钟周期数）／时钟频率。提\n高时钟频率显然可以缩短CPU执行时间；编译优化可能减少程序的指令数或优化指令结构；优\n化数据通路结构可能减少时钟周期，即提高时钟频率，故选D。","im":"qimg/2010_12.png","imscan":1},{"y":2010,"q":13,"t":0,"s":"CO","ch":"中央处理器","sec":"CPU的功能和基本结构","kp":"CO.5.1","kn":"CPU 结构与指令执行过程","p":2,"st":"假定有4个整数用8位补码分别表示r1=FEH，r2=F2H，r3=90H，r4=F8H，若将运 算结果存放在一个8位寄存器中，则下列运算中会发生溢出的是 A. rlxr2 B. r2xr3 C. rlxr4 D. r2xr4","o":["rlxr2","r2xr3","rlxr4","r2xr4"],"a":"B","x":"本题的真正意图是考查补码的表示范围，而不是补码的乘法运算。若采用补码乘法规则计\n算出4个选项，是费力不讨好的做法，而且极容易出错。\n8位补码所能表示的整数范围为-128 +12兀将4个数全部转换为十进制：\nrl =-2,r2=-14, \nr3 = -112, r4 = -8, 得r2xr3 = 1568, 远超出了表示范围，发生溢出。\n【提示】解题时，尤其是对于这种看似很复杂的题，不要轻易动笔，要弄清题目考查的真\n正意图，而尽可能地\n“走捷径\n” ，以免绕进命题者设计的\n“死胡同\n” 。","im":"qimg/2010_13.png","imscan":1},{"y":2010,"q":14,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"浮点数的表示和运算","kp":"CO.2.4","kn":"IEEE 754 浮点数表示与规格化","p":2,"st":"假定变量i、f和d的数据类型分别为int、float 和 double（int用补码表示，float 和 double 分别用IEEE754单精度和双精度浮点数格式表示），已知i=785,f=1.5678e3,d=1.5e100。若在 32位机器中执行下列关系表达式，则结果为“真”的是 1. i=(","o":["仅I和ⅡI","仅I和IⅡI","仅ⅡI和III","仅II和IV"],"a":"B","x":"题中三种数据类型的精度从低到高为int-float-double, 从低到高的转换通常可以保持其\n值不变，I 和III正确，而从高到低的转换可能会有数据的舍入，从而损失精度。对于II, 先将\nfloat型的f转换为int型，小数点后的数位丢失，故其结果不为真。对于IV, 初看似乎没有问\n题，但浮点运算d+f时需要对阶，对阶后f的尾数有效位被舍去而变为o, 故d+f仍然为d,\n再减去d后结果为o, 故IV结果不为真。\n此外，根据不同类型数据混合运算的\n” 类型提升\n” 原则，在IV中，等号左端的类型为double\n型，结果不为真。","im":"qimg/2010_14.png","imscan":1},{"y":2010,"q":15,"t":0,"s":"CO","ch":"存储器层次结构","sec":"主存储器","kp":"CO.3.2","kn":"主存容量扩展与CPU连接（字扩展/位扩展）","p":2,"st":"假定用若干·2Kx4位的芯片组成一个8Kx8位的存储器，则地址0B1FH所在芯片的最小 地址是 A. 0000H B. 0600H C. 0700H D. 0800H","o":["0000H","0600H","0700H","0800H"],"a":"D","x":"用2Kx4位的芯片组成一个8Kx8位存储器，共需8片2Kx4位的芯片，分为4 组，每组由\n2片2Kx4位的芯片并联组成2Kx8位的芯片，各组芯片的地址分配如下：\n第一组(2个芯片并联）：OOOOH07FFH。\n第二组(2个芯片并联）：0800HOFFFH。\n\n第三组(2个芯片并联）：1 OOO H-17FFH。\n第四组(2个芯片并联）：1800H-IFFFH。\n地址OBIFH 所在的芯片属于第二组，故其所在芯片的最小地址为0800H。","im":"qimg/2010_15.png","imscan":1},{"y":2010,"q":16,"t":0,"s":"CO","ch":"存储器层次结构","sec":"存储器的分类与层次结构","kp":"CO.3.1","kn":"存储器分类与层次化存储结构","p":2,"st":"下列有关RAM 和 ROM 的叙述中，正确的是 I.RAM是易失性存储器，ROM是非易失性存储器 II.RAM和ROM都采用随机存取方式进行信息访问 III.RAM和ROM都可用作Cache IV.RAM和ROM都需要进行刷新 A. 仅I和ⅡI B. 仅ⅡI和IⅢI C. 仅I、II和IV D. 仅","o":["仅I和ⅡI","仅ⅡI和IⅢI","仅I、II和IV","仅II、I和IV"],"a":"A","x":"RAM (分为DRAM和SRAM)断电后会失去信息，而ROM断电后不会丢失信息，它们\n都采用随机存取方式（注意，采用随机存取方式的存储器并不一定就是随机存储器）。Cache 一\n般采用高速的SRAM制成，而ROM只可读，不能用作Cache, III错误。DRAM需要定期刷新，\n而ROM不需要刷新，故IV错误。","im":"qimg/2010_16.png","imscan":1},{"y":2010,"q":17,"t":0,"s":"CO","ch":"存储器层次结构","sec":"高速缓冲存储器","kp":"CO.3.5","kn":"Cache 基本原理与映射方式（直接/全相联/组相联）","p":2,"st":"下列命中组合情况中，一次访存过程中不可能发生的是 A. TLB 未命中，Cache 未命中，Page 未命中 B. TLB 未命中，Cache 命中，Page 命中 C. TLB 命中，Cache 未命中，Page 命中 D. TLB 命中，Cache 命中，Page 未命中","o":["TLB 未命中，Cache 未命中，Page 未命中","TLB 未命中，Cache 命中，Page 命中","TLB 命中，Cache 未命中，Page 命中","TLB 命中，Cache 命中，Page 未命中"],"a":"D","x":"Cache中存放的是主存的一部分副本，TLB(快表）中存放的是Page(页表）的一部分副本。在\n同时具有虚拟页式存储器（有TLB )和Cache的系统中，CPU发出访存命令，先查找对应的\nCache块。\n1)若Cache命中，则说明所需内容在Cache 内，其所在页面必然已调入主存，因此Page\n必然命中，但TLB 不一定命中。\n2)若Cache不命中，并不能说明所需内容未调入主存，和TLB、Page命中与否没有联系。\n但若TLB命中，Page也必然命中；而当Page命中，TLB则未必命中，故D不可能发生。\n主存、Cache、TLB和Page的关系如下图所示。\n芦＿尸\n三］\n【提示】本题看似既涉及虚拟存储器又涉及Cache, 实际上","im":"qimg/2010_17.png","imscan":1},{"y":2010,"q":18,"t":0,"s":"CO","ch":"中央处理器","sec":"CPU的功能和基本结构","kp":"CO.5.1","kn":"CPU 结构与指令执行过程","p":2,"st":"下列寄存器中，汇编语言程序员可见的是 A. 存储器地址寄存器（MAR） B. 程序计数器(PC) C. 存储器数据寄存器（MDR) D. 指令寄存器（IR)","o":["存储器地址寄存器（MAR）","程序计数器(PC)","存储器数据寄存器（MDR)","指令寄存器（IR)"],"a":"B","x":"读者首先必须明白\n“ 汇编语言程序员可见\n” 的含义，即汇编语言程序员通过汇编程序可以\n对某个寄存器进行访问。汇编程序员可以通过指定待执行指令的地址来设置PC 的值，如转移\n指令、子程序调用指令等。而IR、MA R、MDR\n是CPU的内部工作寄存器，程序员无法直接获\n取和设置它们的值，也无法直接对它们进行其他操作，所以对程序员不可见。\n【提示】＠指令寄存器IR中的内容总是根据PC所取出的指令代码。＠在CPU的专用寄存\n器中，只有PC和PSWR是汇编程序员可见的。","im":"qimg/2010_18.png","imscan":1},{"y":2010,"q":19,"t":0,"s":"CO","ch":"中央处理器","sec":"指令流水线","kp":"CO.5.5","kn":"指令流水线性能与结构/数据/控制冒险","p":2,"st":"下列选项中，不会引起指令流水线阻塞的是 A. 数据旁路(转发) B. 数据相关 C. 条件转移 D. 资源冲突","o":["数据旁路(转发)","数据相关","条件转移","资源冲突"],"a":"A","x":"采用流水线方式，相邻或相近的两条指令可能会因为存在某种关联，后一条指令不能按照\n原指定的时钟周期运行，从而使流水线断流。有三种相关可能引起指令流水线阻塞：＠结构相\n关，又称资源相关；＠数据相关；＠控制相关，主要由转移指令引起。\n数据旁路技术，其主要思想是不必待某条指令的执行结果送回到寄存器，再从寄存器中取\n出该结果，作为下一条指令的源操作数，而是直接将执行结果送到其他指令所需要的地方，这\n样可以使流水线不发生停顿。","im":"qimg/2010_19.png","imscan":1},{"y":2010,"q":20,"t":0,"s":"CO","ch":"计算机系统概述","sec":"计算机系统层次结构","kp":"CO.1.1","kn":"计算机系统组成与存储程序工作方式","p":2,"st":"下列选项中的英文缩写均为总线标准的是 A. PCI、CRT、USB. EISA B. ISA. CPI、VESA. EISA D. ISA. EISA. PCI、PCI-Express C. ISA. SCSI、RAM、MIPS","o":["PCI、CRT、USB、EISA","ISA、CPI、VESA、EISA","ISA、SCSI、RAM、MIPS","ISA、EISA、PCI、PCI-Express"],"a":"D","x":"典型的总线标准有：ISA、EISA、VESA、PCI、PCI-Expres s、AGP、USB、R S-232C等。\nA 中的CR T是纯平显示器；B 中的CPI 是每条指令的时钟周期数；C中的RAM 是半导体随机\n存储器、MIPS是每秒执行多少百万条指令数。","im":"qimg/2010_20.png","imscan":1},{"y":2010,"q":21,"t":0,"s":"CO","ch":"中央处理器","sec":"异常和中断机制","kp":"CO.5.4","kn":"异常与中断的分类、检测与响应","p":2,"st":"单级中断系统中，中断服务程序内的执行顺序是 III.．关中断 I．保护现场 ⅡI．开中断 IV．保存断点 V．中断事件处理 VI．恢复现场 VII.中断返回 A. I→V→VI→II→VII B. III→I→V→VII C. 1II-→IV-→V-→VI-→VII D. IV→I→V→VI→VII","o":["I→V→VI→II→VII","III→I→V→VII","1II-→IV-→V-→VI-→VII","IV→I→V→VI→VII"],"a":"A","x":"在单级（或单重）中断系统中，不允许中断嵌套。中断处理过程为：＠关中断；＠保存断\n点；＠识别中断源；＠保存现场；＠中断事件处理；＠恢复现场；＠开中断；＠中断返回。其\n中，＠～＠由硬件完成，＠～＠由中断服务程序完成，故选A。\n【排除法】选项B、C、D的第一个任务（保存断点或关中断）都是由中断隐指令完成的，\n即由硬件直接执行，与中断服务程序无关。","im":"qimg/2010_21.png","imscan":1},{"y":2010,"q":22,"t":0,"s":"CO","ch":"存储器层次结构","sec":"存储器的分类与层次结构","kp":"CO.3.1","kn":"存储器分类与层次化存储结构","p":2,"st":"假定一台计算机的显示存储器用DRAM芯片实现，若要求显示分辨率为1600×1200，颜 色深度为24 位，帧频为85Hz，显存总带宽的50%用来刷新屏幕，则需要的显存总带宽至少约 为 A. 245Mbps B. 979Mbps C. 1958Mbps D. 7 834Mbps","o":["245Mbps","979Mbps","1958Mbps","7 834Mbps"],"a":"D","x":"刷新所需带宽＝分辨率x色深X帧频= 1600x 1200x24bitx85Hz = 3916.SMbps, 显存总带宽\n的50%用来刷屏，于是需要的显存总带宽为3916.SMbps/0.5= 7833.6Mbps:=:::: 飞34Mbps。","im":"qimg/2010_22.png","imscan":1},{"y":2010,"q":23,"t":0,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.2","kn":"内核态/用户态与特权指令、系统调用","p":2,"st":"下列选项中，操作系统提供给应用程序的接口是 A. 系统调用 B. 中断 C. 库函数 D. 原语","o":["系统调用","中断","库函数","原语"],"a":"A","x":"操作系统提供的接口主要有两类：命令接口和系统调用。系统调用是能完成特定功能的子\n程序，当应用程序请求操作系统提供某种服务时，便调用具有相应功能的系统调用。库函数\n则是高级语言中提供的与系统调用对应的函数（也有些库函数与系统调用无关），目的是隐\n藏访管指令的细节，使系统调用更为方便、抽象。但要注意，库函数属千用户程序而非系统\n调用，是系统调用的上层。下图是Linux中的分层关系。","im":"qimg/2010_23.png","imscan":1},{"y":2010,"q":24,"t":0,"s":"OS","ch":"输入输出管理","sec":"设备独立软件","kp":"OS.5.2","kn":"缓冲区管理与设备分配/SPOOLing","p":2,"st":"下列选项中，导致创建新进程的操作是 I．用户登录成功 ⅡI．设备分配 III.启动程序执行 A. 仅I和ⅡI B. 仅I和II C. 仅I和II D. II和IⅢI","o":["仅I和ⅡI","仅I和II","仅I和II","II和IⅢI"],"a":"C","x":"引起进程创建的事件有：用户登录、作业调度、提供服务、应用请求等。I. 用户登录成功\n后，系统要为此创建一个用户管理的进程，包括用户桌面、环境等。所有的用户进程会在该进\n程下创建和管理。II. 设备分配是通过在系统中设置相应的数据结构实现的，不需要创建进程。\nIII. 启动程序执行是典型的引起创建进程的事件。","im":"qimg/2010_24.png","imscan":1},{"y":2010,"q":25,"t":0,"s":"OS","ch":"进程管理","sec":"同步与互斥","kp":"OS.2.6","kn":"信号量机制与 PV 操作","p":2,"st":"设与某资源关联的信号量初值为 3，当前值为1。若 M表示该资源的可用个数，N表示 等待该资源的进程数，则M、N分别是 A. 0、1 B. 1、0 C. 1、2 D. 2、0","o":["0、1","1、0","1、2","2、0"],"a":"B","x":"信号量表示相关资源的当前可用数量。当信号量K\u003eO时，表示还有K个相关资源可用，\n所以该资源的可用个数是1。而当信号量K\u003cO时，表示有[K]个进程在等待该资源。由于资源有\n剩余，可见没有其他进程等待使用该资源，故进程数为0。","im":"qimg/2010_25.png","imscan":1},{"y":2010,"q":26,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"下列选项中，降低进程优先级的合理时机是 A. 进程的时间片用完 B. 进程刚完成IO，进入就绪列队 C. 进程长期处于就绪列队中 D. 进程从就绪状态转为运行状态","o":["进程的时间片用完","进程刚完成IO，进入就绪列队","进程长期处于就绪列队中","进程从就绪状态转为运行状态"],"a":"A","x":"进程时间片用完，可降低其优先级以让别的进程被调度进入执行状态。B 选项中进程刚完\n成1/0, 进入就绪队列等待被处理机调度，为了让其尽快处理1/0结果，故应提高优先权。C选\n项中进程长期处于就绪队列，为不至于产生饥饿现象，也应适当提高优先级。D选项中进程的\n优先级不应该在此时降低，而应在时间片用完后再降低。","im":"qimg/2010_26.png","imscan":1},{"y":2010,"q":27,"t":0,"s":"OS","ch":"进程管理","sec":"同步与互斥","kp":"OS.2.5","kn":"同步互斥基本概念与临界区管理（软件/硬件方法）","p":2,"st":"进程P。和P,的共享变量定义及其初值为: boolean flag[2]; int turn=0; flag[O]=FALSE; flag[1]=FALSE; 若进程Po和P访问临界资源的类C伪代码实现如下： //进程P1 void PO() //进程PO void Pl() [ while(TRU","im":"qimg/2010_27.png","imscan":1},{"y":2010,"q":28,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.1","kn":"连续分配管理方式与内存管理基本概念","p":2,"st":"某基于动态分区存储管理的计算机，其主存容量为55MB（初始为空闲），采用最佳适配 （BestFit）算法，分配和释放的顺序为：分配15MB，分配30MB，释放15MB，分配8MB，分配 6MB，此时主存中最大空闲分区的大小是 A. 7MB B. 9MB C. 10MB D. 15MB","o":["7MB","9MB","10MB","15MB"],"a":"B","x":"最佳适配算法是指每次为作业分配内存空间时，总是找到能满足空间大小需要的最小的空\n闲分区给作业，可以产生最小的内存空闲分区，如下图所示。\n初始","im":"qimg/2010_28.png","imscan":1},{"y":2010,"q":29,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.2","kn":"页式/段式/段页式管理","p":2,"st":"某计算机采用二级页表的分页存储管理方式，按字节编址，页大小为2\"B，页表项大小 为2B，逻辑地址结构为 页号 页目录号 页内偏移量 逻辑地址空间大小为2\"6页，则表示整个逻辑地址空间的页目录表中包含表项的个数至少 是 A. 64 B. 128 C. 256 D. 512 ：","o":["64","128","256","512 ："],"a":"B","x":"分配\n分配\n释放\n15MB \n30MB \n15MB \n分配\n8MB \n分配\n6MB \n页大小为i\n0B, 页表项大小为2B, 故一页可以存放29个页表项，逻辑地址空间大小为i\n6\n页，即共需i\n6个页表项，则需要i6l29 =2\n7 = 128个页面保存页表项，即页目录表中包含表项的\n个数至少是128。","im":"qimg/2010_29.png","imscan":1},{"y":2010,"q":30,"t":0,"s":"OS","ch":"文件管理","sec":"文件","kp":"OS.4.3","kn":"文件物理结构（连续/链接/索引分配）与混合索引","p":2,"st":"设文件索引结点中有7个地址项，其中4个地址项是直接地址索引，2个地址项是一级 间接地址索引，1个地址项是二级间接地址索引，每个地址项大小为 4B。若磁盘索引块和磁盘数 据块大小均为256B，则可表示的单个文件最大长度是 A. 33KB B. 519KB C. 1057KB D. 16513KB","o":["33KB","519KB","1057KB","16513KB"],"a":"C","x":"每个磁盘索引块和磁盘数据块大小均为256B, 每个磁盘索引块有256/4=64个地址项。因\n此，4个直接地址索引指向的数据块大小为4x256B; 2个一级间接索引包含的直接地址索引数\n为2x(256/4),\n即其指向的数据块大小为2x(256/4)x256B。1个二级间接索引所包含的直接地址\n索引数为(256/4)x(256/4),\n即其所指向的数据块大小为(256/4)x(256/4)x256B。即7个地址项所\n指向的数据块总大小为4x256 + 2x(256/4)x256 + (256/4)x(256/4)x256 = 1082368B = 1057KB。"},{"y":2010,"q":31,"t":0,"s":"OS","ch":"文件管理","sec":"目录","kp":"OS.4.4","kn":"目录/树形目录/硬链接与软链接","p":2,"st":"设置当前工作目录的主要目的是 A. 节省外存空间 B. 节省内存空间 C. 加快文件的检索速度 D. 加快文件的读/写速度","o":["节省外存空间","节省内存空间","加快文件的检索速度","加快文件的读/写速度"],"a":"C","x":"当一个文件系统含有多级目录时，每访问一个文件，都要使用从树根开始到树叶为止、包\n括各中间结点名的全路径名。当前目录又称工作目录，进程对各个文件的访问都相对于当前目\n录进行，而不需要从根目录一层一层的检索，加快了文件的检索速度。选项A 和B都与相对目\n录无关；选项D, 文件的读／写速度取决于磁盘的性能。","im":"qimg/2010_31.png","imscan":1},{"y":2010,"q":32,"t":0,"s":"OS","ch":"输入输出管理","sec":"I/O管理基础","kp":"OS.5.1","kn":"I/O 控制方式与 I/O 软件层次结构","p":2,"st":"本地用户通过键盘登录系统时，首先获得键盘输入信息的程序是 B. 中断处理程序 A. 命令解释程序 C. 系统调用服务程序 D. 用户登录程序","o": .4.5","kn":"ARP/DHCP/ICMP 协议","p":2,"st":"若路由器R因为拥塞丢弃IP 分组，则此时R可向发出该IP分组的源主机发送的ICMP 报文类型是 B. 目的不可达 C. 源点抑制 D. 超时 A. 路由重定向","o":["路由重定向","目的不可达","源点抑制","超时"],"a":"C","im":"qimg/2010_36.png","imscan":1},{"y":2010,"q":37,"t":0,"s":"NET","ch":"网络层","sec":"IPv4","kp":"NET.4.4","kn":"IPv4 地址/NAT/子网划分/子网掩码/CIDR/路由聚集","p":2,"st":"某网络的IP地址空间为192.168.5.0/24，采用定长子网划分，子网掩码为255.255.255.248， 则该网络中的最大子网个数、每个子网内的最大可分配地址个数分别是 A. 32,8 B. 32,6 C. 8,32 D. 8,30","o":["32,8","32,6","8,32","8,30"],"a":"B","x":"由于该网络的IP地址为192.168.5.0/24, 网络号为前24位，后8位为子网号＋主机号。子\n网掩码为255 .25 5 .25 5 .248, 第4个字节248转换成二进制为11111000,\n因此后8位中，前5位\n用于子网号，在CIDR中可以表示25= 32个子网；后3位用于主机号，除去全0和全l的情况，\n可以表示i-2=6个主机地址。","im":"qimg/2010_37.png","imscan":1},{"y":2010,"q":38,"t":0,"s":"NET","ch":"物理层","sec":"传输介质与物理层设备","kp":"NET.2.4","kn":"传输介质/中继器/集线器","p":2,"st":"下列网络设备中，能够抑制广播风暴的是 I．中继器 II．集线器 III.网桥 IV.路由器 A. 仅I和ⅡI B. 仅III C. 仅IⅢ和IV D. 仅IV","o":["仅I和ⅡI","仅III","仅IⅢ和IV","仅IV"],"a":"D","x":"中继器和集线器工作在物理层，既不隔离冲突域也不隔离广播域。为了解决冲突域的问题，\n人们利用网桥和交换机来分隔互联网的各个网段中的通信量，建立多个分离的冲突域，但当网\n桥和交换机接收到一个未知转发信息的数据帧时，为了保证该帧能被目的结点正确接收，将该\n帧从所有的端口广播出去，可以看出网桥和交换机的冲突域等于端口个数，广播域为1。路由\n器工作在网络层，既隔离冲突域，也隔离广播域。\n【提示】广播风暴产生于网络层，因此只有网络层设备才能抑制。链路层设备和物理层设\n备对网络层的数据包是透明传输，对是否为广播报文是不可知的。","im":"qimg/2010_38.png","imscan":1},{"y":2010,"q":39,"t":0,"s":"NET","ch":"传输层","sec":"TCP协议","kp":"NET.5.3","kn":"TCP 段格式/连接管理（三次握手四次挥手）","p":2,"st":"主机甲和主机乙之间已建立了一个TCP连接，TCP最大段长度为1000B。若主机甲的当 前拥塞窗口为4000B，在主机甲向主机乙连续发送两个最大段后，成功收到主机乙发送的第一个 段的确认段，确认段中通告的接收窗口大小为2000B，则此时主机甲还可以向主机乙发送的最 大字节数是 A. 1000 B. 2","o":["1000","2000","3000","4000"],"a":"A","x":"发送方的发送窗口的上限值取接收方窗口和拥塞窗口这两个值中较小的一个，于是此时发\n送方的发送窗口为min{4000, 2000} = 2000B。由于发送方还没有收到第二个最大段的确认，所\n以此时甲还可以向乙发送的最大字节数为2000-1000= IOOOB。","im":"qimg/2010_39.png","imscan":1},{"y":2010,"q":40,"t":0,"s":"NET","ch":"应用层","sec":"网络应用模型与DNS","kp":"NET.6.1","kn":"C/S 与 P2P 模型、DNS 域名解析","p":2,"st":"如果本地域名服务器无缓存，当采用递归方法解析另一网络某主机域名时，用户主机、 本地域名服务器发送的域名请求消息数分别为 A. 一条、一条 B. 一条、多条 C. 多条、一条 D. 多条、多条 二、综合应用题（第41～47题，共70分）","o":["一条、一条","一条、多条","多条、一条 "kn":"性能指标（CPI/主频/MIPS/MFLOPS/加速比）","p":2,"st":"下列选项中，描述浮点数操作速度指标的是 A. MIPS B. CPI C. IPC D. MFLOPS","o":["MIPS","CPI","IPC","MFLOPS"],"a":"D","x":"筛选结点10r-------------飞筛选结点25\n\u000e! \n(is) \n!\u000f(25\nl、--------------\nMIPS 是每秒执行多少百万条指令，适用千衡量标量机的性能。CPI 是平均每条指令的时钟\n周期数。IPC 是CPI 的倒数，即每个时钟周期执行的指令数。MFLOPS 是每秒执行多少百万条浮\n点数运算，用来描述浮点数运算速度，适用于衡量向量机的性能。"},{"y":2011,"q":13,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"浮点数的表示和运算","kp":"CO.2.4","kn":"IEEE 754 浮点数表示与规格化","p":2,"st":"float型数据通常用IEEE 754单精度浮点数格式表示。若编译器将float型变量x分配到 一个32位浮点寄存器FRI中，且X = -8.25, 则FRI的内容是 。 A. C104 OOOOH B. C242 OOOOH C. C184 OOOOH D. C1C2 OOOOH","o":["C104 OOOOH","C242 OOOOH","C184 OOOOH","C1C2 OOOOH"],"a":"A","x":"本题题意即考查IEEE 754 单精度浮点数的表示。先将x 转换成二进制为-1000.01=-1.000 Olx23,\n其次计算阶码E, 根据IEEE 754 单精度浮点数格式，有E-127=3, 故E=130, 转换成二进制\n为1000 0010。最后，根据IEEE 754 标准，最高位的\"1\" 是被隐藏的。\nIEEE 754 单精度浮点数格式：数符(1位）＋阶码(8 位）＋尾数(23 位）。\n故，FRI 内容为1; 1000 0010; 0000 10000 0000 0000 0000 000。\n即，1100 0001 0000 0100 0000 0000 0000 0000 = C104000H。\n本题易误选D, 未考虑I"},{"y":2011,"q":14,"t":0,"s":"CO","ch":"存储器层次结构","sec":"存储器的分类与层次结构","kp":"CO.3.1","kn":"存储器分类与层次化存储结构","p":2,"st":"下列各类存储器中，不采用随机存取方式的是 。 A. EPROM B. CDROM C. DRAM D. SRAM","o":["EPROM","CDROM","DRAM","SRAM"],"a":"B","x":"随机存取方式是指CPU 可以对存储器的任一存储单元中的内容随机存取，而且存取时间与\n存储单元的物理位置无关。选项A 、C、D 均采用随机存取方式，CD-ROM 即光盘，采用串行存\n取方式。\n注意：CD-ROM 是只读型光盘存储器，而不属于只读存储器(ROM)。"},{"y":2011,"q":15,"t":0,"s":"CO","ch":"存储器层次结构","sec":"主存储器","kp":"CO.3.2","kn":"主存容量扩展与CPU连接（字扩展/位扩展）","p":2,"st":"某计算机存储器按字节编址，主存地址空间大小为64MB, 现用4MBx8位的RAM芯片 组成32MB的主存储器，则存储器地址寄存器MAR的位数至少是 A. 22位 B. 23位 C. 25位 D. 26位","o":["22位","23位","25位","26位"],"a":"D","x":"主存按字节编址，地址空间大小为64MB, M凡＼的寻址范围为64M=226, 故为26 位。实际\n的主存容量32MB 不能代表M凡过勺位数，考虑到存储器扩展的需要八丛R 应保证访问到整个主\n存地址空间，反过来，M凡辽彴位数决定了主存地址空间的大小。"},{"y":2011,"q":16,"t":0,"s":"CO","ch":"指令系统","sec":"寻址方式","kp":"CO.4.2","kn":"寻址方式与有效地址计算","p":2,"st":"偏移寻址通过将某个寄存器内容与一个形式地址相加而生成有效地址。下列寻址方式中， 不属于偏移寻址方式的是 。 A. 间接寻址 B. 基址寻址 C. 相对寻址 D. 变址寻址","o":["间接寻址","基址寻址","相对寻址","变址寻址"],"a":"A","x":"间接寻址不需要寄存器，EA=(A)。基址寻址EA=A+ 基址寄存器BR 内容；相对寻址EA=\nA+ 程序计数器PC内容；变址寻址EA=A+ 变址寄存器IX 内容。后三者都是将某个寄存器内容\n与一个形式地址相加而形成有效地址，故选A。"},{"y":2011,"q":17,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"运算方法和运算电路","kp":"CO.2.2","kn":"加减运算/溢出判断/标志位（ZF/SF/OF/CF）","p":2,"st":"某机器有一个标志寄存器，其中有进位／借位标志CF、零标志ZF、符号标志SF 和溢出 标志OF, 条件转移指令hgt (无符号整数比较大于时转移）的转移条件是 。 . \" A. CF+ OF=l B. SF+ZF=l C. CF+ZF=l D. CF+SF=l","o":["CF+ OF=l","SF+ZF=l","CF+ZF=l","CF+SF=l"],"a":"C","x":"假设两个无符号整数A 和B,bgt 指令会将A 和B 进行比较，也就是将A 和B 相减。如果A\u003eB,\n\n则A-B 肯定无进位／借位， 也不为 0 (为 0 时表示两数相同），故而 CF 和 ZF 均为 o, 选 C。其\n余选项中用到了符号标志 SF 和溢出标志 OF, 显然应当排除。","im":"qimg/2011_17.png"},{"y":2011,"q":18,"t":0,"s":"CO","ch":"指令系统","sec":"CISC和RISC","kp":"CO.4.3","kn":"CISC 与 RISC","p":2,"st":"下列给出的指令系统特点中，有利于实现指令流水线的是＿＿＿。 I. 指令格式规整且长度一致 II. 指令和数据按边界对齐存放 III. 只有Load/Store指令才能对操作数进行存储访问 A. 仅I、II B. 仅II、III C. 仅I、III D. I、II、III","o":["仅I、II","仅II、III","仅I、III","I、II、III"],"a":"D","x":"指令定长、对齐和仅Load/Store 指令访存，这3 个都是RISC 的特征，指令格式规整且长度\n一致能大大简化指令译码的复杂度，有利于实现流水线。指令和数据按边界对齐存放能保证在一\n个存取周期内取到需要的数据和指令，不用多余的延迟等待，也有利于实现流水线。只有\nLoad/Store 指令才能对操作数进行存储访问使取指令、取操作数操作简化且时间长度固定，能够\n有效地简化流水线的复杂度。","im":"qimg/2011_18.png"},{"y":2011,"q":19,"t":0,"s":"CO","ch":"中央处理器","sec":"CPU的功能和基本结构","kp":"CO.5.1","kn":"CPU 结构与指令执行过程","p":2,"st":"假定不采用Cache和指令预取技术，且机器处于 “ 开中断 ” 状态。在下列有关指令执行 的叙述中，错误的是 。 A. 每个指令周期中CPU都至少访问内存一次 B. 每个指令周期一定大于等于一个CPU时钟周期 C. 空操作指令的指令周期中任何寄存器的内容都不会被改变 D. 当前程序在每条指令执行结束","o":["每个指令周期中CPU都至少访问内存一次","每个指令周期一定大于等于一个CPU时钟周期","空操作指令的指令周期中任何寄存器的内容都不会被改变","当前程序在每条指令执行结束时都可能被外部中断打断"],"a":"C","x":"由于不采用指令预取技术，每个指令周期都需要取指令，而不采用Cache 技术，则每次取指\n令都至少要访问内存一次（当指令字长与存储字长相等且按边界对齐时），A正确。时钟周期是\nCPU 的最小时间单位，每个指令周期一定大于或等于一个CPU 时钟周期，B正确。即使是空操\n作指令，在取指操作后，PC 也会自动加1, C 错误。由于机器处于\n“开中断\n” 状态，在每条指令\n执行结束时都可能被外部中断而打断。"},{"y":2011,"q":20,"t":0,"s":"CO","ch":"存储器层次结构","sec":"主存储器","kp":"CO.3.2","kn":"主存容量扩展与CPU连接（字扩展/位扩展）","p":2,"st":"在系统总线的数据线上，不可能传输的是 。 A. 指令 B. 操作数 C. 握手（应答）信号 D. 中断类型号","o":["指令","操作数","握手（应答）信号","中断类型号"],"a":"C","x":"在取指令时，指令便是在数据线上传输的。操作数显然在数据线上传输。中断类型号用以指\n出中断向量的地址，CPU 响应中断请求后，将中断应答信号-(ǨTR)发回到数据总线上，CPU\n从数据总线上读取中断类型号后，查找中断向量表，找到相应的中断处理程序入口。而握手（应\n答）信号属于通信联络控制信号，应在通信总线上传输。"},{"y":2011,"q":21,"t":0,"s":"CO","ch":"中央处理器","sec":"异常和中断机制","kp":"CO.5.4","kn":"异常与中断的分类、检测与响应","p":2,"st":"某计算机有五级中断L 4-L 。， 中断屏蔽字为M 4M 3汕M 1M。, M; = 1 COƳ 尽4)表示对 L; 级中断进行屏蔽。若中断响应优先级从高到低的顺序是L 4---L 。---L2--+L尸L 3, 则L 1 的中断处理 程序中设置的中断屏蔽字是 。 2011年全国硕士研究生入学统一考","o":["11110","01101","00011 .","01010"],"a":"D","x":"高优先级置0 表示可被中断，比该中断优先级低（或相等）的置l 表示不可被中断，L1只能\n屏蔽L3和其自身，故M3和M置1, 中断屏蔽字汕M3凡M品=01010。"},{"y":2011,"q":22,"t":0,"s":"CO","ch":"计算机系统概述","sec":"计算机性能指标","kp":"CO.1.2","kn":"性能指标（CPI/主频/MIPS/MFLOPS/加速比）","p":2,"st":"某计算机处理器主频为50MHz, 采用定时查询方式控制设备A的I/0, 查询程序运行一 次所用的时钟周期数至少为500。在设备A工作期间，为保证数据不丢失，每秒需对其查询至少 200次，则CPU用于设备A的I/0的时间占整个CPU时间的百分比至少是 。 A. 0.02% B. 0.05% C. 0.","o":["0.02%","0.05%","0.20%","0.50%"],"a":"C","x":"每秒至少查询200 次，每次查询至少500 个时钟周期，总的时钟周期数为200x500 = 100000,\n因此CPU 用于设备A的I/0的时间占CPU 时间比为100000/SOM = 0.20%。"},{"y":2011,"q":23,"t":0,"s":"OS","ch":"进程管理","sec":"CPU调度与上下文切换","kp":"OS.2.3","kn":"CPU 调度算法（FCFS/SJF/HRRN/RR/优先级/多级反馈）","p":2,"st":"下列选项中，满足短任务优先且不会发生饥饿现象的调度算法是 。 A. 先来先服务 B. 高响应比优先 C. 时间片轮转 D. 非抢占式短任务优先","o":["先来先服务","高响应比优先","时间片轮转","非抢占式短任务优先"],"a":"B","x":"高响应比优先算法是一种综合考虑任务长度和等待时间的调度算法，响应比＝（等待时间＋\n执行时间）／执行时间。高响应比优先算法在等待时间相同的情况下，作业执行时间越短则响应比\n越高，满足短任务优先。随着长任务的等待时间增加，响应比也会变大，执行机会也就增大，\n所以不会发生饥饿现象。先来先服务和时间片轮转不符合短任务优先，非抢占式短任务优先会\n产生饥饿现象。","im":"qimg/2011_23.png"},{"y":2011,"q":24,"t":0,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.2","kn":"内核态/用户态与特权指令、系统调用","p":2,"st":"下列选项中，在用户态执行的是 。 A. 命令解释程序 B. 缺页处理程序 C. 进程调度程序 D. 时钟中断处理程序","o":["命令解释程序","缺页处理程序","进程调度程序","时钟中断处理程序"],"a":"A","x":"缺页处理和时钟中断都属千中断，在核心态执行；进程调度是操作系统内核进程，无须用户\n干预，在核心态执行；命令解释程序属于命令接口，是四个选项中唯一能面对用户的，它在用户\n态执行。"},{"y":2011,"q":25,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"在支持多线程的系统中，进程P创建的若干线程不能共享的是 。 A. 进程P的代码段 B. 进程P 中打开的文件 c. 进程P的全局变量 D. 进程P中某线程的栈指针","o":["进程P的代码段","进程P 中打开的文件","进程P的全局变量","进程P中某线程的栈指针"],"a":"D","x":"进程是资源分配的基本单位，线程是处理机调度的基本单位。因此，进程的代码段、进程打\n开的文件、进程的全局变量等都是进程的资源，唯有进程中某线程的栈指针是属千线程的，属于\n进程的资源可以共享，属于线程的栈是独享的，对其他线程透明。"},{"y":2011,"q":26,"t":0,"s":"OS","ch":"输入输出管理","sec":"I/O管理基础","kp":"OS.5.1","kn":"I/O 控制方式与 I/O 软件层次结构","p":2,"st":"用户程序发出磁盘I/0请求后， 系统的正确处理流程是 A. 用户程序一系统调用处理程序--中断处理程序一设备驱动程序 B. 用户程序一系统调用处理程序一设备驱动程序-中断处理程序 C. 用户程序一设备驱动程序一系统调用处理程序--中断处理程序 D. 用户程序-设备驱动程序一中断处理程序一系统调用处理","o":["用户程序一系统调用处理程序--中断处理程序一设备驱动程序","用户程序一系统调用处理程序一设备驱动程序-中断处理程序","用户程序一设备驱动程序一系统调用处理程序--中断处理程序","用户程序-设备驱动程序一中断处理程序一系统调用处理程序"],"a":"B","x":"输入／输出软件一般从上到下分为四个层次：用户层、与设备无关的软件层、设备驱动程序以\n\n及中断处理程序。与设备无关的软件层也就是系统调用的处理程序。\n当用户使用设备时，首先在用户程序中发起一次系统调用，操作系统的内核接到该调用请求\n后请求调用处理程序进行处理，再转到相应的设备驱动程序，当设备准备好或所需数据到达后设\n备硬件发出中断，将数据按上述调用顺序逆向回传到用户程序中。"},{"y":2011,"q":27,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"某时刻进程的资源使用情况如下表所示。 进程 已分配资源 尚需分配 可用资源 R1 R2 R3 R1 R2 R3 R1 R2 Ra P1 2 。 P2 1 2 P3 。 I P4 。 。 此时的安全序列是 。 。 。 。 1 。 I 3 2 I I 3 I l 2 。 。 A. P1, P2, P3,","o":["P1, P2, P3, 凡","P1, P3, P2, P4","Pi, P4, P3, P2","不存在的"],"a":"D","x":"本题应采用排除法，逐个代入分析。当剩余资源分配给Pi, 待P 1 执行完后，可用资源数为(2\n,2, 1), \n此时仅能满足凡的需求，排除AB; 接着分配给P4 , 待凡执行完后，可用资源数为(2, 2, 2), \n此时已\n无法满足任何进程的需求，排除C。\n此外，本题还可以使用银行家算法求解（对于选择题来说，显得\n过于复杂）。","im":"qimg/2011_27.png"},{"y":2011,"q":28,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.2","kn":"页式/段式/段页式管理","p":2,"st":"在缺页处理过程中，操作系统执行的操作可能是———° I. 修改页表 II. 磁盘1/0 III. 分配页框 。 2 A. 仅I、II B. 仅II C. 仅III D. I、II和III","o":["仅I、II","仅II","仅III","I、II和III"],"a":"D","x":"缺页中断产生后，需要在内存中找到空闲页框并分配给需要访问的页（可能涉及页面置换），\n之后缺页中断处理程序调用设备驱动程序做磁盘I/0, 将位于外存上的页面调入内存，调入后需\n要修改页表，将页表中代表该页是否在内存的标志位（或有效位）置为1, 并将物理页框号填入\n相应位置，若必要还需修改其他相关表项等。"},{"y":2011,"q":29,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"当系统发生抖动(thrashing)时，可以采取的有效措施是 。 I. 撤销部分进程 II. 增加磁盘交换区的容量 III. 提高用户进程的优先级 A. 仅I B. 仅II C. 仅III D. 仅I、II I","o":["仅I","仅II","仅III","仅I、II I"],"a":"A","x":"在具有对换功能的操作系统中，通常把外存分为文件区和对换区。前者用于存放文件，后者\n用于存放从内存换出的进程。抖动现象是指刚刚被换出的页很快又要被访问，为此又要换出其他\n页，而该页又很快被访问，如此频繁地置换页面，以致大部分时间都花在页面置换上，引起系统\n性能下降。撤销部分进程可以减少所要用到的页面数，防止抖动。对换区大小和进程优先级都与\n抖动无关。"},{"y":2011,"q":30,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.2","kn":"页式/段式/段页式管理","p":2,"st":"在虚拟内存管理中，地址变换机构将逻辑地址变换为物理地址，形成该逻辑地址的阶段 是 A. 编辑 B. 编译 C. 链接 D. 装载","o":["编辑","编译","链接","装载"],"a":"C","x":"编译后的模块需要经过链接才能装载，而链接后形成的地址才是整个程序的完整逻辑地址空\n间。以C语言为例：C语言经过预处理(cpp)-编译(eel)-汇编(as) -链接Cld)产生可执\n行文件。其中链接的前一步，产生了可重定位的二进制的目标文件。C语言采用源文件独立编译\n的方法，如程序main.e, filel.e, file2.e, filel.h, file2.h, 在链接的前一步生成了main.o,filel.o, file2.o, \n这些目标模块采用的逻辑地址都从0开始，但只是相对于该模块的逻辑地址。链接器将这三个文件，\nlibe和其他的库文件链接成一个可执行文件。链接阶段主要完成了重定位，形成整个程序的完整逻\n辑地址空间。\n例"},{"y":2011,"q":31,"t":0,"s":"OS","ch":"输入输出管理","sec":"设备独立软件","kp":"OS.5.2","kn":"缓冲区管理与设备分配/SPOOLing","p":2,"st":"某文件占10个磁盘块， 现要把该文件磁盘块逐个读入主存缓冲区 ，并送用户区进行分 析，假设一个缓冲区与一个磁盘块大小相同，把一个磁盘块读入缓冲区的时间 为 lOOµs, 将缓冲 区的数据传送到用户区的时间是SOµs, CPU对一块数据进行分析的时间 为SOµs。在单缓冲区和 双缓冲区结构下， 读入并","o":["l_SOOµs、lOOOµs","1550µs、llOOµs","1550µs、1550µs","2000µs、2000µs"],"a":"B","x":"在单缓冲区中，当上一个磁盘块从缓冲区读入用户区完成时，下一磁盘块才能开始读入，也\n就是当最后一块磁盘块读入用户区完毕时所用时间为150 x10 = 1500µs, 加上处理最后一个磁盘块\n的时间50µs, 得1550µs。双缓冲区中，不存在等待磁盘块从缓冲区读入用户区的问题，10个磁\n盘块可以连续从外存读入主存缓冲区，加上将最后一个磁盘块从缓冲区送到用户区的传输时间\n50µs以及处理时间50µs, 也就是lOOxlO + 50 + 50 = llOOµs。"},{"y":2011,"q":32,"t":0,"s":"OS","ch":"操作系统概述","sec":"操作系统的基本概念","kp":"OS.1.1","kn":"OS 基本概念/功能/发展历程/结构","p":2,"st":"有两个并发执行的进程P1和P2, 共享初值为1的变量x。P1 对x 加1, P2对x减l。加1 和减l操作的指令序列分别如下所示。 ／／加1操作 _ II减1操作 load R1,. x / /取x到寄存器Rl 中 load R2, x dei::: \u00042 inc Rl. 玩ore x, Rl //","o":["可能为-1或3","只能为1","可能为0、1或2","可能为-1、0、1或2"],"a":"C","x":"将P1中3条语句依次编号为1,2,3: P2 中3条语句依次编号为4,5, 6 。依次执行1,2, 3, 4, 5,\n6得结果1 , 依次执行1,2, 4, 5, 6, 3得结果2 , 执行4,5, 1, 2, 3, 6得结果0 。因此结果-1 不可能得出。","im":"qimg/2011_32.png"},{"y":2011,"q":33,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络体系结构","kp":"NET.1.2","kn":"分层结构/OSI 与 TCP/IP 模型/协议服务接口","p":2,"st":"TCP/IP参考模型的网络层提供的是 。 A. 无连接不可靠的数据报服务 B. 无连接可靠的数据报服务 C. 有连接不可靠的虚电路服务 D. 有连接可靠的虚电路服务","o":["无连接不可靠的数据报服务","无连接可靠的数据报服务","有连接不可靠的虚电路服务","有连接可靠的虚电路服务"],"a":"A","x":"TCP/IP的网络层向上只提供简单灵活的、无连接的、尽最大努力交付的数据报服务。考查IP\n首部，如果是面向连接的，那么应有用于建立连接的字段，但是没有；如果提供可靠的服务，那\n么至少应有序号和校验和两个字段，但是IP分组头中也没有(IP首部中只是首部校验和）。通常\n有连接、可靠的应用是由运输层的TCP实现的。"},{"y":2011,"q":34,"t":0,"s":"NET","ch":"物理层","sec":"通信基础","kp":"NET.2.1","kn":"信道/码元/波特/速率等基本概念与编码调制","p":2,"st":"若某通信链路的数据传输速率为2400bps, 采用四相位调制，则该链路的波特率是 。 A. 600波特 B. 1200波特 C. 4800波特 D. 9600波特","o":["600波特","1200波特","4800波特","9600波特"],"a":"B","x":"波特率B与数据传输率C的关系：C=Blog沁N为一个码元所取的离散值个数。采用4种\n相位，也即可以表示4种变化，故一个码元可携带log24 = 2bit信息，则该链路的波特率＝比特\n率/2 = 1200 波特。"},{"y":2011,"q":35,"t":0,"s":"NET","ch":"数据链路层","sec":"流量控制与可靠传输机制","kp":"NET.3.2","kn":"停止等待/GBN/SR 与滑动窗口","p":2,"st":"数据链路层采用选择重传协议(SR) 传输数据，发送方已发送了0-3号数据帧，现已 收到1号帧的确认，而O、2号帧依次超时，则此时需要重传的帧数是 。 A. 1 B. 2 C. 3 D. 4","o":["1","2","3","4"],"a":"B","x":"在选择重传协议中，接收方逐个确认正确接收的分组，不管接收到的分组是否有序，只要正\n确接收就发送选择ACK分组进行确认。因此选择重传协议中的ACK分组不再具有累积确认的作\n用，要特别注意其与GBN协议的区别。本题中只收到1号帧的确认，O、2号帧超时，由于对于\n1号帧的确认不具累积确认的作用，因此发送方认为接收方没有收到0 、2号帧，于是重传这两帧。\n因为3号帧计时器并无超时，所以暂时不用重传3号帧。"},{"y":2011,"q":36,"t":0,"s":"NET","ch":"数据链路层","sec":"介质访问控制","kp":"NET.3.4","kn":"随机访问（ALOHA/CSMA/CSMA-CD/CSMA-CA）","p":2,"st":"下列选项中，对正确接收到的数据帧进行确认的MAC协议是 。 A. CSMA B. CDMA C. CSMA/CD D. CSMA/CA","o":["CSMA","CDMA","CSMA/CD","CSMA/CA"],"a":"D","x":"CSMA/CA是无线局域网标准802.11中的协议，它在CSMA的基础上增加了冲突避免的功能。\nACK帧是CSMA/CA避免冲突的机制之一，也就是说，只有当发送方收到接收方发回的ACK帧\n后才确认发出的数据帧已正确到达目的地。\n【排除法】首先CDMA即码分多址，是物理层的内容；CSMA/CD 即带冲突检测的载波监听\n多路访问，接收方并不需要确认；对于CSMA, 既然CSMA/CD 是其超集，是CSMA/CD没有的\n内容，CSMA自然也没有。于是使用排除法选D。"},{"y":2011,"q":37,"t":0,"s":"NET","ch":"网络层","sec":"IPv4","kp":"NET.4.4","kn":"IPv4 地址/NAT/子网划分/子网掩码/CIDR/路由聚集","p":2,"st":"某网络拓扑如下图所示，路由器Rl只有到达子网192.168.1.0/24的路由。为使Rl可以 将1P分组正确地路由到图中所有的子网，则在Rl中需要增加的一条路由（目的网络，子网掩码， 下一跳）是 。 A. 192.168.2.0 B. 192.168.2.0 255.255.255.128 192.","o":["192.168.2.0","192.168.2.0 255.255.255.128 192.168.1.1 255.255.255.0 192.168.1.1","192.168.2.0 255.255.255.128 192.168.1.2","192.168.2.0 255.255.255.0 192.1Ʀ8.l.2"],"a":"D","x":"要使Rl能够正确将分组路由到所有子网，则Rl中需要有到192.168.2.0/25和192.168.2.128/25\n的路由，分别转换成二进制如下：\n19 e为a的孩子结点，排除D。各种遍历算法中左右子树\n的遍历次序是固定的，若b也为a的孩子结点，则在前序序列和后序序列中e、b的相对次序应\n是不变的，故排除B, 同理排除C。\n【特殊法】前序序列和后序序列对应着多棵不同的二叉树树"},{"y":2012,"q":4,"t":0,"s":"DS","ch":"树与二叉树","sec":"树与二叉树的应用","kp":"DS.5.10","kn":"平衡二叉树（AVL）与调整","p":2,"st":"若平衡二叉树的高度为6，且所有非叶结点的平衡因子均为1，则该平衡二叉树的结点 总数为 A. 10 B. 20 C. 32 D. 33","o":["10","20","32","33"],"a":"B","x":"所有非叶结点的平衡因子均为1, 即平衡二叉树满足平衡的最少结点情况，如下图所示。\n对于高度为N、左右子树的高度分别为N-1和N-2、所有非叶结点的平衡因子均为1的平衡二\n叉树，总结点数的公式为：CN=C凡I + C'. 凡2+1, C1 = 1, C2=2, C3=2+ 1 + 1 = 4, 可推出C6 =20。\n勹／三三\n\n【画图法】先画出m和Tz; 然后新建一个根结点，连接T公飞构成T3; 新建一个根结点，\n连接T3、飞构成T4; 以此类推，直到画出T6,\n可知飞的结点数为20。\n【排除法】对千选项A,\n高度为6、结点数为10 的树怎么也无法达到平衡。对于选项c,\n结点较多时，考虑较极端情形，即第6层只有最左叶子的完全二叉树刚好"},{"y":2012,"q":5,"t":0,"s":"DS","ch":"图","sec":"图的遍历","kp":"DS.6.3","kn":"DFS 与 BFS 遍历（含生成树/复杂度）","p":2,"st":"对有n个结点、e条边且使用邻接表存储的有向图进行广度优先遍历，其算法时间复杂 度是 A. O(n) B. O(e) C. O(n+e) D. O(ne)","o":["O(n)","O(e)","O(n+e)","O(ne)"],"a":"C","x":"广度优先遍历需要借助队列实现。邻接表的结构包括：顶点表；边表（有向图为出边表）。\n当采用邻接表存储方式时，在对图进行广度优先遍历时每个顶点均需入队一次（顶点表遍历），\n故时间复杂度为O(n), 在搜索所有顶点的邻接点的过程中，每条边至少访问一次（出边表遍历），\n故时间复杂度为O(e), 算法总的时间复杂度为O(n + e)。"},{"y":2012,"q":6,"t":0,"s":"DS","ch":"图","sec":"图的存储及基本操作","kp":"DS.6.2","kn":"邻接矩阵/邻接表/十字链表/邻接多重表","p":2,"st":"若用邻接矩阵存储有向图，矩阵中主对角线以下的元素均为零，则关于该图拓扑序列 的结论是 A. 存在，且唯一 B. 存在，且不唯一 C. 存在，可能不唯一 D. 无法确定是否存在","o":["存在，且唯一","存在，且不唯一","存在，可能不唯一","无法确定是否存在"],"a":"C","x":"对角线以下元素均为零，表明只有顶点l到顶点j (i \u003cj)可能有边，而顶点j到顶点i 一定\n没有边，即有向图是一个无环图，因此一定存在拓扑序列。对于拓扑序列是否唯一，试举一例：\n0 1 \n1 \n设有向图的邻接矩阵[o o ol 则存在两个拓扑序列，因此该图存在可能不唯一的拓扑序列。\n0 0 0 \n结论：对于任一有向图，如果它的邻接矩阵中对角线以下（或以上）的元素均为零，则存\n在拓扑序列（可能不唯一）。反正，若图存在拓扑序列，却不一定能满足邻接矩阵中主对角线以\n下的元素均为零，但是可以通过适当地调整结点编号，使其邻接矩阵满足前述性质。","im":"qimg/2012_6.png"},{"y":2012,"q":7,"t":0,"s":"DS","ch":"图","sec":"图的基本应用","kp":"DS.6.5","kn":"最短路径（Dijkstra/Floyd/BFS）","p":2,"st":"如右图所示的有向带权图，若采用迪杰斯 特拉（Dijkstra）算法求从源点a到其他各顶点的 最短路径，则得到的第一条最短路径的目标顶点是 b，第二条最短路径的目标顶点是c，后续得到的 其余各最短路径的目标顶点依次是 C A. d,e,f B. e,d,f C. f,d,e D. f,e, d","o":["d,e,f","e,d,f","f,d,e","f,e, d"],"a":"C","x":"从a到各顶点的最短路径的求解过程：\n顶点\n第1趟\n第2趟\n第3趟\n第4趟\n第5趟\nb \n(a, b) 2 \nC \n(a, c) 5 \n(a, q; c) 3 \nd \n= \n(a, b, d) 5 \n(a, b, d) 5 \n(a, b, d) 5 \ne \nex, \n= \n(a, b, c, t) 4 \nf \n= \n= \n(a, b, c, e) 7 \n(a, b, c, e) 7 \n(a, b, d, e) 6 \n集合S\n{a, b} \n{a,b,c} \n{a, b, c, f} \n{a, b, c, f, d} \n{a, b, c, f, d, e} \n后续目标顶点依次为f, d, e。\n【排除法】对于A, 若下一个顶点为d, 路"},{"y":2012,"q":8,"t":0,"s":"DS","ch":"图","sec":"图的基本应用","kp":"DS.6.4","kn":"最小生成树（Prim/Kruskal）","p":2,"st":"下列关于最小生成树的叙述中，正确的是 I．最小生成树的代价唯一 IⅡI．所有权值最小的边一定会出现在所有的最小生成树中 III．使用普里姆（Prim）算法从不同顶点开始得到的最小生成树一定相同 IV．使用普里姆算法和克鲁斯卡尔（Kruskal）算法得到的最小生成树总不相同 A. 仅I B. 仅ⅡI ","o":["仅I","仅ⅡI","仅I、II","仅I、IV"],"a":"A","x":"对于I, 最小生成树的树形可能不唯一（这是因为可能存在权值相同的边），但是代价一定\n是唯一的，I正确。对于II, 如果权值最小的边有多条并且构成环状，则总有权值最小的边将不\n出现在某棵最小生成树中，II错误。对于III, 设N个结点构成环，N - 1条边权值相等，则从\n不同的顶点开始普里姆算法会得到N- 1中不同的最小生成树，III错误。对于IV, 当最小生成\n树唯一时（各边的权值不同），Prim算法和Kruskal算法得到的最小生成树相同，IV错误。"},{"y":2012,"q":9,"t":0,"s":"DS","ch":"查找","sec":"树型查找","kp":"DS.7.4","kn":"B树与B+树","p":2,"st":"已知一棵3阶B-树，如下图所示。删除关键字78 得到一棵新B-树，其最右叶结点中 的关键字是 45 1735 5565 10 21 37 47 6062 78 A. 60 B. 60,62 C. 62,65 D. 65","o":["60","60,62","62,65","65"],"a":"D","x":"对于上图所示的3阶B-树，被删关键字78所在结点在删除前的关键字个数=1=「3127-1'\n\n/\n且其左兄弟结点的关键字个数=2Ǆ「321, 属于\n“兄弟够借\n” 的情况，则需把该结点的左兄弟 \n结点中最大的关键字上移到双亲结点中，同时把双亲结点中大于上移关键字的关键字下移到要\n删除关键字的结点中，这样就达到了新的平衡，如下图所示。\n10 \n/\n10 \n65","im":"qimg/2012_9.png"},{"y":2012,"q":10,"t":0,"s":"DS","ch":"排序","sec":"排序的基本概念","kp":"DS.8.1","kn":"排序稳定性/内外排序/比较次数与移动次数","p":2,"st":"在内部排序过程中，对尚未确定最终位置的所有元素进行一遍处理称为一趟排序。下 列排序方法中，每一趟排序结束都至少能够确定一个元素最终位置的方法是 I．简单选择排序 ⅡI．希尔排序 III．快速排序 IV．堆排序 V．二路归并排序 A. 仅I、ⅢI、IV B. 仅I、ⅢI、V C. 仅I、I、IV D.","o":["仅I、ⅢI、IV","仅I、ⅢI、V","仅I、I、IV","仅II、IV、V"],"a":"A","x":"对于I, 简单选择排序每次选择未排序列中的最小元素放入其最终位置。对于II, 希尔排\n序每次是对划分的子表进行排序，得到局部有序的结果，所以不能保证每一趟排序结束都能确\n定一个元素的最终位置。对于III, 快速排序每一趟排序结束后都将枢轴元素放到最终位置。对\n于IV, 堆排序属于选择排序，每次都将大根堆的根结点与表尾结点交换，确定其最终位置。对\n于v, 二路归并排序每趟对子表进行两两归并从而得到若干个局部有序的结果，但无法确定最\n终位置。"},{"y":2012,"q":11,"t":0,"s":"DS","ch":"排序","sec":"插入排序","kp":"DS.8.2","kn":"直接插入排序与折半插入排序","p":2,"st":"对一待排序序列分别进行折半插入排序和直接插入排序，两者之间可能的不同之处 是 A. 排序的总趟数 B. 元素的移动次数 C. 使用辅助空间的数量 D. 元素之间的比较次数","o":["排序的总趟数","元素的移动次数","使用辅助空间的数量","元素之间的比较次数"],"a":"D","x":"折半插入排序与直接插入排序都是将待插入元素插入前面的有序子表，区别是：确定当前\n记录在前面有序子表中的位置时，直接插入排序是采用顺序查找法，而折半插入排序是采用折\n半查找法。排序的总趟数取决于元素个数n,\n两者都是n-l 趟。元素的移动次数都取决于初试\n序列，两者相同。使用辅助空间的数量也都是0(1)。折半插入排序的比较次数与序列初态无关，\n为O(nlog2n); 直接插入排序的比较次数与序列初态有关，为O(n)-O(n\n2)。"},{"y":2012,"q":12,"t":0,"s":"CO","ch":"中央处理器","sec":"CPU的功能和基本结构","kp":"CO.5.1","kn":"CPU 结构与指令执行过程","p":2,"st":"假定基准程序A在某计算机上的运行时间为100 秒，其中 90 秒为CPU时间，其余为 IVO时间。若CPU速度提高50%，I/O速度不变，则运行基准程序A所耗费的时间是 A. 55s B. 60s C. 65s D. 70s.","o":["55s","60s","65s","70s."],"a":"D","x":"程序A的运行时间为100s, 除去CPU时间90s, 剩余10s 为1/0时间。CPU提速后运行基\n准程序A所耗费的时间是T=90/1.5 + 10 = 70s。\n【误区】CPU速度提高50%, 则CPU时间减少一半，而误选A。\n1 3. 解析：\n将一个16位unsigned short 转换成32位形式的unsigned int, 因为都是无符号数，新表示\n形式的高位用0填充。16位无符号整数所能表示的最大值为65 5 35, 其十六进制表示为FFFFH,\n故x的十六进制表示为FFFFH -5H = FFFAH, 所以y的十六进制表示为0000 FFFAH。\n【排除法】先直接排除C、D, 然后分析余下选项的特征。由于A、B的值相差"},{"y":2012,"q":13,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"数制与编码","kp":"CO.2.1","kn":"进制转换与定点数编码（原/反/补/移码）","p":2,"st":"假定编译器规定int和 short 型长度分别为 32位和16位，执行下列C语言语句： unsigned shortx=65530; unsigned int y=x; 得到y的机器数为 A. 0000 7FFAH B. 0000 FFFAH C. FFFF 7FFAH D. FFFF FFFAH","o":["0000 7FFAH","0000 FFFAH","FFFF 7FFAH","FFFF FFFAH"],"a":"B","im":"qimg/2012_13.png"},{"y":2012,"q":14,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"浮点数的表示和运算","kp":"CO.2.4","kn":"IEEE 754 浮点数表示与规格化","p":2,"st":"float类型（即IEEE754单精度浮点数格式）能表示的最大正整数是 A. 2126-2103 B. 2127 2104 C. 2127-2103 D. 2128 2104","o":["2126-2103","2127 2104","2127-2103","2128 2104"],"a":"D","x":"IEEE 754单精度浮点数是尾数用采取隐藏位策略的原码表示，且阶码用移码（偏置值为127)\n表示的浮点数。规格化的短浮点数的真值为：(-1)8 xl.mx2丘127, S为符号位，阶码E的取值为1-\n254 (8位表示），尾数m为23位，共32位；故float 类型能表示的最大整数是1.111... 1 xl254-127 =\ni21x (2-T23) = 212s_io4, 故选D。\n【另解】IEEE 754单精度浮点数的格式如下图所示。\nI 数符(I) I 阶码(8)\nI 尾数(23)\n当表示最大正整数时：数符取0; 阶码取最大值为127; 尾数部分隐含了整数部分的\"1 \"' \n23 位尾数全取1 时尾数最大，为2-T23 ,"},{"y":2012,"q":15,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"整数的表示和运算","kp":"CO.2.6","kn":"数据对齐/大端小端/边界对齐存储","p":2,"st":"某计算机存储器按字节编址，采用小端方式存放数据。假定编译器规定 int 型和 short 型长度分别为32位和16位，并且数据按边界对齐存储。某C语言程序段如下： struct{ int a; char b; short c; }record; record.a=273; 若record变量的首地址","o":["0x00、0xC00D","0x00、0xC00E","0x11、0xC00D","0x11、0xC00E"],"a":"D","x":"尽管record大小为7个字节（成员a有4个字节，成员b有1个字节，成员c有2个字节），\n由于数据按边界对齐方式存储（见考点笔记），故record共占用8个字节。record.a的十六进制\n表示为0ǻ00000111, 由于采用小端方式存放数据，故地址OxC008 中内容应为低字节Oxll;\nrecord.b只占1个字节，后面的一个字节留空；record. c占2个字节，故其地址为OxCOOE。各字\n节的存储分配如下图所示。\n;、.\n·\" \n,,. 地.址\n' \nOxC008 \n-oxC009产\n内容\nrecord.a (Ox! I) \nrecord.a (OxOI) \n地址\nOxCOOC \nOxCOOD \n内容\nrecord.b"},{"y":2012,"q":16,"t":0,"s":"CO","ch":"存储器层次结构","sec":"存储器的分类与层次结构","kp":"CO.3.1","kn":"存储器分类与层次化存储结构","p":2,"st":"下列关于闪存（FlashMemory）的叙述中，错误的是 A. 信息可读可写，并且读、写速度一样快 B. 存储元由MOS管组成，是一种半导体存储器 C. 掉电后信息不丢失，是一种非易失性存储器 D. 采用随机访问方式，可替代计算机外部存储器","o":["信息可读可写，并且读、写速度一样快","存储元由MOS管组成，是一种半导体存储器","掉电后信息不丢失，是一种非易失性存储器","采用随机访问方式，可替代计算机外部存储器"],"a":"A","x":"OxCOOA \n.e \nrecord.a (OxOO) \nOxCOOE \nrecord.c \n\u003c.· ,, ,., • \n. \nOxCO\n.·\nO\n.',\nU \n. ' 六\n,'\nm m m \nrecord.a (OxOO) \nOxCOOF \nrecord.c \n闪存是EEPROM的进一步发展，可读可写，用MOS管的浮栅上有无电荷来存储信息。闪\n存依然是ROM 的一种，写入时必须先擦除原有数据，故写的速度比读的速度要慢不少（硬件\n常识）。闪存是一种非易失性存储器，它采用随机访问方式。现在常见的SSD固态硬盘，即由\nFlash芯片组成。"},{"y":2012,"q":17,"t":0,"s":"CO","ch":"存储器层次结构","sec":"高速缓冲存储器","kp":"CO.3.5","kn":"Cache 基本原理与映射方式（直接/全相联/组相联）","p":2,"st":"假设某计算机按字编址，Cache有4个行，Cache和主存之间交换的块大小为1个字。 若Cache的内容初始为空，采用2路组相联映射方式和LRU替换策略。访问的主存地址依次为 0,4,8,2,0,6,8,6,4,8时，命中Cache 的次数是 C. 3 D. 4 A. 1 B. 2","o":["1","2","3","4"],"a":"C","x":"地址映射采用2路组相联，则主存地址为0\u003c1、4\u003c5、g\u003c9可映射到第0组Cache中，\n主存地址为2\u003c3、6\u003c7 可映射到第1组Cache中。Cache置换过程如下表所示。\n走向\n。\n4 \n8 \n2 \n。\n6 \n8 \n6 \n4 \n8 \n第0组\n块O\n。\n4 \n4 \n8 \n8 \n。\n。\n8 \n4 \n块l\nQ \n1 \nǼ \n8 \nQ \n。"},{"y":2012,"q":18,"t":0,"s":"CO","ch":"中央处理器","sec":"控制器的功能和工作原理","kp":"CO.5.3","kn":"硬布线控制器与微程序控制器","p":2,"st":".某计算机的控制器采用微程序控制方式，微指令中的操作控制字段采用字段直接编码 法，共有33个微命令，构成5个互斥类，分别包含7、3、12、5和6个微命令，则操作控制字 段至少有 A. 5位 B. 6位 C. 15位 D. 33位","o":["5位","6位","15位","33位"],"a":"C","x":"字段直接编码法将微命令字段分成若干个小字段，互斥性微命令组合在同一字段中，相容\n性微命令分在不同字段中，每个字段还要留出一个状态，表示本字段不发出任何微命令。5 个\n互斥类分别包含7、3、12、5和6个微命令，需要3、2、4、3和3 位，共15位。"},{"y":2012,"q":19,"t":0,"s":"CO","ch":"总线与输入输出","sec":"总线","kp":"CO.6.1","kn":"总线概念、组成与性能指标/事务与定时","p":2,"st":"某同步总线的时钟频率为100MHz，宽度为32位，地址/数据线复用，每传输一个地 址或数据占用一个时钟周期。若该总线支持突发（猝发）传输方式，则一次“主存写”总线事 务传输128位数据所需要的时间至少是 A. 20ns B. 40ns C. 50ns D. 80ns","o":["20ns","40ns","50ns","80ns"],"a":"C","x":"总线频率为100MHz, 则时钟周期为lOns。总线位宽与存储字长都是32 位，故每一个时钟\n周期可传送一个32位存储字。猝发式发送可以连续传送地址连续的数据，故总的传送时间为：\n传送地址lOns, 传送128位数据40ns, 共需50ns。"},{"y":2012,"q":20,"t":0,"s":"CO","ch":"中央处理器","sec":"数据通路","kp":"CO.5.2","kn":"数据通路的功能和基本结构","p":2,"st":"下列关于USB 总线特性的描述中，错误的是 A. 可实现外设的即插即用和热拔插 B. 可通过级联方式连接多台外设 C. 是一种通信总线，连接不同外设 D. 同时可传输2位数据，数据传输率高","o":["可实现外设的即插即用和热拔插","可通过级联方式连接多台外设","是一种通信总线，连接不同外设","同时可传输2位数据，数据传输率高"],"a":"D","x":"USB (通用串行总线）的特点有：O即插即用；＠热插拔；＠有很强的连接能力，采用菊\n花链形式将众多外设连接起来；＠有很好的可扩充性，一个USB控制器可扩充高达127个外部\nUSB设备；＠高速传输，速度可达480Mbps。所以A、B、C选项都符合USB总线的特点。对\n于D, USB是串行总线，不能同时传输2位数据。"},{"y":2012,"q":21,"t":0,"s":"CO","ch":"存储器层次结构","sec":"主存储器","kp":"CO.3.2","kn":"主存容量扩展与CPU连接（字扩展/位扩展）","p":2,"st":"下列选项中，在I/O总线的数据线上传输的信息包括 I．IVO接口中的命令字 ⅡI.IO接口中的状态字 III．中断类型号 A. 仅I、ⅡI B. 仅I、IⅢI C. 仅I、III D. I、II、III","o":["仅I、ⅡI","仅I、IⅢI","仅I、III","I、II、III"],"a":"D","x":"1/0接口与CPU之间的1/0总线有数据线、控制线和地址线。控制线和地址线都是单向传\n输的，从CPU传送给1/0接口，而1/0接口中的命令字、状态字以及中断类型号均是由1/0接\n口发往CPU的，故只能通过1/0总线的数据线传输。"},{"y":2012,"q":22,"t":0,"s":"CO","ch":"中央处理器","sec":"异常和中断机制","kp":"CO.5.4","kn":"异常与中断的分类、检测与响应","p":2,"st":"响应外部中断的过程中，中断隐指令完成的操作，除保护断点外，还包括 I．关中断 IⅢI.形成中断服务程序入口地址并送PC ⅡI.保存通用寄存器的内容 A. 仅I、ⅡI B. 仅I、III C. 仅I、III ·D. I、II、III","o":["仅I、ⅡI","仅I、III","仅I、III ·","I、II、III"],"a":"B","x":"在响应外部中断的过程中，中断隐指令完成的操作包括：＠关中断；＠保护断点；＠引出\n中断服务程序（形成中断服务程序入口地址并送PC), 所以只有I、III正确。II中的保存通用\n寄存器的内容是在进入中断服务程序后首先进行的操作。"},{"y":2012,"q":23,"t":0,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.2","kn":"内核态/用户态与特权指令、系统调用","p":2,"st":"下列选项中，不可能在用户态发生的事件是 A. 系统调用 B. 外部中断 C. 进程切换 D. 缺页","o":["系统调用","外部中断","进程切换","缺页"],"a":"C","x":"本题关键是对\n“在用户态发生\n“ （与上题的\n“执行\n” 区分）的理解。对于A, 系统调用是操\n作系统提供给用户程序的接口，系统调用发生在用户态，被调用程序在核心态下执行。对于B,\n外部中断是用户态到核心态的\n“ 门\n”，也发生在用户态，在核心态完成中断过程。对于C, 进程\n切换属于系统调用执行过程中的事件，只能发生在核心态。对于D, 缺页产生后，在用户态发\n生缺页中断，然后进入核心态执行缺页中断服务程序。"},{"y":2012,"q":24,"t":0,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.3","kn":"中断异常处理/链接装入/内存映像","p":2,"st":"中断处理和子程序调用都需要压栈以保护现场，中断处理一定会保存而子程序调用不 需要保存其内容的是 A. 程序计数器 B. 程序状态字寄存器 C. 通用数据寄存器 D. 通用地址寄存器","o":["程序计数器","程序状态字寄存器","通用数据寄存器","通用地址寄存器"],"a":"B","x":"子程序调用只需保存程序断点，即该指令的下一条指令的地址；中断调用子程序不仅要保\n护断点(PC 的内容），而且要保护程序状态字寄存器的内容PSW。在中断处理中，最重要的两\n个寄存器是PC 和PSWR。"},{"y":2012,"q":25,"t":0,"s":"OS","ch":"内存管理","sec":"虚拟内存管理","kp":"OS.3.3","kn":"虚拟内存基本概念与请求页式管理","p":2,"st":"下列关于虚拟存储器的叙述中，正确的是 A. 虚拟存储只能基于连续分配技术 B. 虚拟存储只能基于非连续分配技术 C. 虚拟存储容量只受外存容量的限制 D. 虚拟存储容量只受内存容量的限制","o":["虚拟存储只能基于连续分配技术","虚拟存储只能基于非连续分配技术","虚拟存储容量只受外存容量的限制","虚拟存储容量只受内存容量的限制"],"a":"B","x":"在程序装入时，可以只将程序的一部分装入内存，而将其余部分留在外存，就可以启动程\n序执行。采用连续分配方式时，会使相当一部分内存空间都处于暂时或\n“ 永久” 的空闲状态，\n造成内存资源的严重浪费，也无法从逻辑上扩大内存容量，因此虚拟内存的实现只能建立在离\n散分配的内存管理的基础上。有以下三种实现方式：CD请求分页存储管理；＠请求分段存储管\n理；＠请求段页式存储管理。虚拟存储器容量既不受外存容量限制，也不受内存容量限制，而\n是由CPU的寻址范围决定的。"},{"y":2012,"q":26,"t":0,"s":"OS","ch":"输入输出管理","sec":"I/O管理基础","kp":"OS.5.1","kn":"I/O 控制方式与 I/O 软件层次结构","p":2,"st":"操作系统的I/O子系统通常由四个层次组成，每一层明确定义了与邻近层次的接口。 其合理的层次组织排列顺序是 A. 用户级IO 软件、设备无关软件、设备驱动程序、中断处理程序 B. 用户级I/O 软件、设备无关软件、中断处理程序、设备驱动程序 C. 用户级I/O软件、设备驱动程序、设备无关软件、中断处理","o":["用户级IO 软件、设备无关软件、设备驱动程序、中断处理程序","用户级I/O 软件、设备无关软件、中断处理程序、设备驱动程序","用户级I/O软件、设备驱动程序、设备无关软件、中断处理程序","用户级I/O软件、中断处理程序、设备无关软件、设备驱动程序"],"a":"A","x":"设备管理软件一般分为四个层次：用户层、与设备无关的系统调用处理层、设备驱动程序\n以及中断处理程序。"},{"y":2012,"q":27,"t":0,"s":"OS","ch":"进程管理","sec":"死锁","kp":"OS.2.9","kn":"死锁的必要条件/预防/避免（银行家算法）/检测解除","p":2,"st":"假设5个进程Po、P1、P2、P3、P4共享三类资源R、R2、R3，这些资源总数分别为18、 6、22。T0时刻的资源分配情况如下表所示，此时存在的一个安全序列是 已分配资源 资源最大需求 进程 R R2 R3 R R2 R3 Po 3 2 3 5 5 10 P1 4 0 3 5 3 6 P2 4 ","o":["Po, P2, P4, P1, P3","P1, Po, P3, P4, P2","P2, P1, Po, P3, P4","P3, P4, P2, P1, Po"],"a":"D","x":"首先求得各进程的需求矩阵Need与可利用资源矢量Available:\nNeed \n进程\nR, \nR2 \nRi \np。\n2 \n3 \n7 \nP1 \nI \n3 \n3 \nP2 \n。\n。\n6 \nP3 \n2 \n2 \nI \nP4 \nI \n1 \n。\nA,ailible 尸\n二\n比较Need和Available可以发现，初始时进程P1 与P3 可满足需求，排除A、C 。尝试给P1\n分配资源，则P1 完成后Available将变为(6, 3, 6), 无法满足凡的需求，排除B 。尝试给P3 分配\n资源，则P3 完成后Available将变为(4, 3, 7), 该向量能满足其他所有进程的需求。所以，以P3\n\n开头的所有序列都是安全序列。"},{"y":2012,"q":28,"t":0,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.2","kn":"内核态/用户态与特权指令、系统调用","p":2,"st":"若一个用户进程通过read系统调用读取一个磁盘文件中的数据，则下列关于此过程的 叙述中，正确的是 I．若该文件的数据不在内存中，则该进程进入睡眠等待状态 ⅡI.请求read系统调用会导致CPU从用户态切换到核心态 III.read系统调用的参数应包含文件的名称 A. 仅I、ⅡI B. 仅I、III ","o":["仅I、ⅡI","仅I、III","仅I、II","I、I和IⅢI"],"a":"A","x":"对于I, 当所读文件的数据不在内存时，产生中断（缺页中断），原进程进入阻塞状态，直\n到所需数据从外存调入内存后，才将该进程唤醒。对千II, read系统调用通过陷入将CPU 从用\n户态切换到核心态，从而获取操作系统提供的服务。对于III, 要读一个文件首先要用open 系\n统调用打开该文件。open中的参数包含文件的路径名与文件名，而read只需要使用open返回\n的文件描述符，并不使用文件名作为参数。read要求用户提供三个输入参数：＠文件描述符fd;\n@buf缓冲区首址；＠传送的字节数n。read的功能是试图从fd所指示的文件中读入n个字节\n的数据，并将它们送至由指针buf所指示的缓冲区中。"},{"y":2012,"q":29,"t":0,"s":"OS","ch":"操作系统概述","sec":"操作系统的基本概念","kp":"OS.1.1","kn":"OS 基本概念/功能/发展历程/结构","p":2,"st":"一个多道批处理系统中仅有P,和P2两个作业，P2比P,晚5ms 到达，它们的计算和I/O 操作顺序如下： P1：计算60ms，I/O80ms，计算20ms P2：计算120ms，I/O40ms，计算40ms 若不考虑调度和切换时间，则完成两个作业需要的时间最少是 A. 240ms B. 260ms ","o":["240ms","260ms","340ms","360ms ."],"a":"B","x":"由于P2比P 1 晚5ms到达，P 1 先占用CPU, 作业运行的甘特图如下所示。\np l \nCPU \ntlms \nI \nI/Q \nI \nI \nI \nI \nCPU \n干----叩--宁一一一—\n: \n： \n: \n, CPU \nI \nI \nI \nI \n匕—\nI\nI \nI \nI \nI \nI \nI \nI \nI \nI \nI \nI \nI \nI \nI \nI \nI \n80 \n220 \n260 \n: \nCPU \n: \nI \nI \nI \nI \n, \nYO \n, \nI \n1-------------.J \nI \nI \nI \nI \nI \nI \nI \nI \nI \nI \n..... --\n' \n... \n60 \n140"},{"y":2012,"q":30,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"若某单处理器多进程系统中有多个就绪态进程，则下列关于处理机调度的叙述中，错 误的是 A. 在进程结束时能进行处理机调度 B. 创建新进程后能进行处理机调度 C. 在进程处于临界区时不能进行处理机调度 D. 在系统调用完成并返回用户态时能进行处理机调度","o":["在进程结束时能进行处理机调度","创建新进程后能进行处理机调度","在进程处于临界区时不能进行处理机调度","在系统调用完成并返回用户态时能进行处理机调度"],"a":"C","x":"选项A、B、D显然是可以进行处理机调度的情况。对于c, 当进程处于临界区时，说明\n进程正在占用处理机，只要不破坏临界资源的使用规则，是不会影响处理机调度的。比如，通\n常访问的临界资源可能是慢速的外设（如打印机），如果在进程访问打印机时，不能进行处理机\n调度，那么系统的性能将是非常差的。"},{"y":2012,"q":31,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"下列关于进程和线程的叙述中，正确的是 A. 不管系统是否支持线程，进程都是资源分配的基本单位 B. 线程是资源分配的基本单位，进程是调度的基本单位 C. 系统级线程和用户级线程的切换都需要内核的支持 D. 同一进程中的各个线程拥有各自不同的地址空间","o":["不管系统是否支持线程，进程都是资源分配的基本单位","线程是资源分配的基本单位，进程是调度的基本单位","系统级线程和用户级线程的切换都需要内核的支持","同一进程中的各个线程拥有各自不同的地址空间"],"a":"A","x":"在引入线程后，进程依然还是资源分配的基本单位，线程是调度的基本单位，同一进程中\n的各个线程共享进程的地址空间。在用户级线程中，有关线程管理的所有工作都由应用程序完\n成，无须内核的干预，内核意识不到线程的存在。"},{"y":2012,"q":32,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.1","kn":"连续分配管理方式与内存管理基本概念","p":2,"st":"下列选项中，不能改善磁盘设备IO 性能的是 A. 重排I/O请求次序 B. 在一个磁盘上设置多个分区 C. 预读和滞后写 D. 优化文件物理块的分布","o":["重排I/O请求次序","在一个磁盘上设置多个分区","预读和滞后写","优化文件物理块的分布"],"a":"B","x":"对于A, 重排1/0请求次序也就是进行1/0调度，从而使进程之间公平地共享磁盘访问，\n减少1/0完成所需要的平均等待时间。对于c, 缓冲区结合预读和滞后写技术对于具有重复性\n及阵发性的1/0进程改善磁盘1/0性能很有帮助。对于D, 优化文件物理块的分布可以减少寻\n找时间与延迟时间，从而提高磁盘性能。在一个磁盘上设置多个分区与改善设备1/0性能并无\n多大联系，相反还会带来处理的复杂和降低利用率。"},{"y":2012,"q":33,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络体系结构","kp":"NET.1.2","kn":"分层结构/OSI 与 TCP/IP 模型/协议服务接口","p":2,"st":"在TCP/IP体系结构中，直接为ICMP提供服务的协议是 A. PPP B. IP C. UDP D. TCP","o":["PPP","IP","UDP","TCP"],"a":"B","x":"ICMP报文作为数据字段封装在IP\n分组中，因此，IP协议直接为ICMP 提供服务。UDP\n和TCP 都是传输层协议，为应用层提供服务。PPP 协议是链路层协议，为网络层提供服务。"},{"y":2012,"q":34,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络体系结构","kp":"NET.1.2","kn":"分层结构/OSI 与 TCP/IP 模型/协议服务接口","p":2,"st":"在物理层接口特性中，用于描述完成每种功能的事件发生顺序的是 A. 机械特性 B. 功能特性 C. 过程特性 D. 电气特性","o":["机械特性","功能特性","过程特性","电气特性"],"a":"C","x":"此题为概念题，过程特性定义各条物理线路的工作过程和时序关系。"},{"y":2012,"q":35,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络体系结构","kp":"NET.1.2","kn":"分层结构/OSI 与 TCP/IP 模型/协议服务接口","p":2,"st":"以太网的 MAC 协议提供的是 A. 无连接不可靠服务 B. 无连接可靠服务 C. 有连接不可靠服务 D. 有连接可靠服务","o":["无连接不可靠服务","无连接可靠服务","有连接不可靠服务","有连接可靠服务"],"a":"A","x":"考虑到局域网信道质量好，以太网采取了两项重要的措施以使通信更简便：＠采用无连接\n的工作方式；＠不对发送的数据帧进行编号，也不要求对方发回确认。因此，以太网提供的服\n务是不可靠的服务，即尽最大努力的交付。差错的纠正由高层完成。"},{"y":2012,"q":36,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络基本概念","kp":"NET.1.1","kn":"网络定义/组成/分类与性能指标","p":2,"st":"两台主机之间的数据链路层采用后退N帧协议（GBN）传输数据，数据传输速率为 16kbps，单向传播时延为270ms，数据帧长度范围是128～512字节，接收方总是以与数据帧等 长的帧进行确认。为使信道利用率达到最高，帧序号的比特数至少为 A. 5 B. 4 C. 3 D. 2","o":["5","4","3","2"],"a":"B","x":"本题即求从发送一个帧到接收到这个帧的确认为止的时间内最多可以发送多少数据帧。要\n尽可能多发帧，应以短的数据帧计算，首先计算出发送一帧的时间：128x8/(16x103) = 64ms; 发\n送一帧到收到确认为止的总时间：64 + 270x2 + 64 = 668ms; 这段时间总共可以发送668/64 ="},{"y":2012,"q":37,"t":0,"s":"NET","ch":"网络层","sec":"网络层设备","kp":"NET.4.8","kn":"路由器的组成/路由表与分组转发","p":2,"st":"下列关于IP路由器功能的描述中，正确的是 I．运行路由协议，设置路由表 ⅡI．监测到拥塞时，合理丢弃IP分组 III．对收到的IP分组头进行差错校验，确保传输的IP 分组不丢失 IV.根据收到的IP分组的目的IP地址，将其转发到合适的输出线路上 A. 仅IⅢI、.IV· B. 仅I、I、II C. ","o":["仅IⅢI、.IV·","仅I、I、II","仅I、II、IV","I、II、II、IV"],"a":"C","x":"I 和IV显然是IP路由器的功能。\n对千II, 当路由器监测到拥塞时，可合理丢弃IP分组，\n并向发出该IP分组的源主机发送一个源点抑制的ICMP报文。\n对于III, 路由器对收到的IP分\n组首部进行差错检验，\n丢弃有差错首部的报文，但不保证IP分组不丢失。"},{"y":2012,"q":38,"t":0,"s":"NET","ch":"网络层","sec":"IPv4","kp":"NET.4.4","kn":"IPv4 地址/NAT/子网划分/子网掩码/CIDR/路由聚集","p":2,"st":"ARP协议的功能是 A. 根据IP地址查询MAC地址 B. 根据MAC地址查询IP地址 C. 根据域名查询IP地址 D. 根据IP地址查询域名","o":["根据IP地址查询MAC地址","根据MAC地址查询IP地址","根据域名查询IP地址","根据IP地址查询域名"],"a":"A","x":"在实际网络的数据链路层上传送数据时，最终必须使用硬件地址，ARP协议是将网络层的\nIP地址解析为数据链路层的MAC地址。"},{"y":2012,"q":39,"t":0,"s":"NET","ch":"网络层","sec":"IPv4","kp":"NET.4.4","kn":"IPv4 地址/NAT/子网划分/子网掩码/CIDR/路由聚集","p":2,"st":"某主机的IP地址为180.80.77.55，子网掩码为255.255.252.0。若该主机向其所在子网 发送广播分组，则目的地址可以是 A. 180.80.76.0 B. 180.80.76.255 C. 180.80.77.255 D. 180.80.79.255","o":["180.80.76.0","180.80.76.255","180.80.77.255","180.80.79.255"],"a":"D","x":"子网掩码的第3个字节为11111100, 可知前22位为子网号、后10位为主机号。IP地址的\n第3个字节为QlQQ且01 (下画线为子网号的一部分），将主机号（即后10位）全置为1, 可以\n得到广播地址为180.80.79.255。"},{"y":2012,"q":40,"t":0,"s":"NET","ch":"应用层","sec":"FTP与电子邮件","kp":"NET.6.2","kn":"FTP/SMTP/POP3/IMAP/MIME","p":2,"st":"若用户1与用户2之间发送和接收电子邮件的过程如下图所示，则图中①、②、③阶 段分别使用的应用层协议可以是 用户1的 用户2的 用户1 邮件服务器 邮件服务器 用户2 A. SMTP、SMTP、SMTP B. POP3、SMTP、POP3 C. POP3、SMTP、SMTP D. SMTP、SMTP、","o":["SMTP、SMTP、SMTP","POP3、SMTP、POP3","POP3、SMTP、SMTP","SMTP、SMTP、POP3 二、综合应用题（第41～47题，共70分）"],"a":"D","x":"SMTP采用\n“ 推\n” 的通信方式，在用户代理向邮件服务器及邮件服务器之间发送邮件时，\nSMTP客户主动将邮件\n“推\n”\n送到SMTP服务器。而POP3采用\n“拉\n” 的通信方式，当用户读\n取邮件时，用户代理向邮件服务器发出请求，\n“ 拉\n” 取用户邮箱中的邮件。\n二、综合应用题","im":"qimg/2012_40.png"},{"y":2012,"q":41,"t":1,"s":"DS","ch":"排序","sec":"归并排序","kp":"DS.8.6","kn":"二路归并排序","p":13,"st":"设有6个有序表A. B. C. D. E、F，分别含有10、35、40、50、60和200个数据 元素，各表中元素按升序排列。要求通过5次两两合并，将6个表最终合并成1个升序表，并 在最坏情况下比较的总次数达到最小。请回答下列问题。 1）给出完整的合并过程，并求出最坏情况下比较的总次数。 2）根据你","x":"41. 解答：\n本题同时对多个知识点进行了综合考查。\n对有序表进行两两合并考查了归并排序中的\nmerge()函数；对合并过程的设计考查了哈夫曼树和最佳归并树。外部排序属于大纲新增考点。","fs":"设有6个有序表A、B、C、D、E、F，分别含有10、35、40、50、60和200个数据\n元素，各表中元素按升序排列。要求通过5次两两合并，将6个表最终合并成1个升序表，并\n在最坏情况下比较的总次数达到最小。请回答下列问题。\n1）给出完整的合并过程，并求出最坏情况下比较的总次数。\n2）根据你的合并过程，描述N（N≥2）个不等长升序表的合并策略，并说明理由。"},{"y":2012,"q":42,"t":1,"s":"DS","ch":"线性表","sec":"线性表的实现","kp":"DS.2.2","kn":"单链表/双链表/循环链表/静态链表","p":10,"st":"假定采用带头结点的单链表保存单词，当两个单词有相同的后缀时，则可共享相同的 后缀存储空间，例如，“loading”和“being”的存储映像如下图所示。 strl str2 设 str1和str2分别指向两个单词所在单链表的头结点，链表结点结构为datanex，请设计 一个时间上尽可能高效的算法，找","x":"42. 解答：\n顺序遍历两个链表到尾结点时，并不能保证两个链表同时到达尾结点。这是因为两个链表\n的长度不同。假设一个链表比另一个链表长k个结点，我们先在长链表上遍历k个结点，之后\n同步遍历两个链表，这样就能够保证它们同时到达最后一个结点。由于两个链表从第一个公共\n结点到链表的尾结点都是重合的，所以它们肯定同时到达第一个公共结点。\n尾\n部\n对\n齐\nq\n算法的基本设计思想：\n＠分别求出strl和str2所指的两个链表的长度m和n。\n＠将两个链表以表尾对齐：令指针p、q分别指向strl和str2的头结点，若m;;:=:n, 则使p\n指向链表中的第m-n + l个结点；若m\u003cn, 则使q指向链表中的第n -m+ 1个结点，即使指\n针p和q所指的结点到表尾的长度相等。\n＠反复将指针p和q同步向后移动，并判断它们是否指向同一结点。若p和q指向同一\n结点，则该点即为所求的共同后缀的起始位置。","fs":"假定采用带头结点的单链表保存单词，当两个单词有相同的后缀时，则可共享相同的\n\n后缀存储空间，例如，“loading”和“being”的存储映像如下图所示。\nstrl\nstr2\n设 str1和str2分别指向两个单词所在单链表的头结点，链表结点结构为datanex，请设计\n一个时间上尽可能高效的算法，找出由str1和str2所指向两个链表共同后缀的起始位置（如图\n中字符i所在结点的位置p)。要求：\n1）给出算法的基本设计思想。\n2）根据设计思想，采用C或C++或Java语言描述算法，关键之处给出注释。\n3）说明你所设计算法的时间复杂度。"},{"y":2012,"q":43,"t":1,"s":"CO","ch":"存储器层次结构","sec":"高速缓冲存储器","kp":"CO.3.5","kn":"Cache 基本原理与映射方式（直接/全相联/组相联）","p":13,"st":"假定某计算机的CPU主频为80MHz，CPI为4,平均每条指令访存1.5次，主存与Cache 之间交换的块大小为16B，Cache的命中率为99%，存储器总线宽度为32位。请回答下列问题。 的情况下，主存带宽至少达到多少才能满足CPU的访存要求？ 2）假定在Cache缺失的情况下访问主存时，存在0.","x":"43. 解答：\n本题综合涉及多个考点：计算机的性能指标、存储器的性能指标、DMA的性能分析，DMA\n方式的特点，多体交叉存储器的性能分析。\n1)平均每秒CPU执行的指令数为：80M/4 = 20M, 故MIPS数为20; (1分）\n平均每条指令访存1.5次，故平均每秒Cache缺失的次数=20Mxl.5x(l-99%) = 300k; (1分）\n当Cache缺失时，CPU访问主存，主存与Cache之间以块为传送单位，此时，主存带宽为\n16 Bx300k/s = 4.8MB/s。在不考虑DMA传送的情况下，主存带宽至少达到4.8MB/s才能满足\nCPU的访存要求。(2分）\n2)题中假定在Cache缺失的情况下访问主存，平均每秒产生缺页中断300000x0.0005% = 1.5\n次。因为存储器总线宽度为32位，所以每传送32位数据，磁盘控制器发出一次DMA请求，\n故平均每秒磁盘DMA请求的次数至少为l.5x4KB/4B = 1.5K = 1536。(2分）\n3) CPU和DMA控制器同时要求使用存储器总线时，DMA请求优先级更高；(1分）\n因为DMA请求得不到及时响应，1/0传输数据可能会丢失。(1分）\n4)四体交叉存储模式能提供的最大带宽为4x4B/50ns = 320MB/s。(2分）\n44. 解答：\n1) X 的机器码为[x]补= 1111 1101 1111 1111B, 即指令执行前(RI) = FDFFH, 右移l位后位\n1111 1110 1111 1111B, 即指令执行后(Rl)= FEFFH 。(2分）\n2)每个时钟周期只能有一条指令进入流水线，从第5个时钟周期开始，每个时钟周期都\n会有一条指令执行完毕，故至少需要4 + (5-1) = 8个时钟周期。(2分）\n3) l3的ID段被阻塞的原因：因为l3与l 1 和l2都存在数据相关，需等到l 1 和l2 将结果写回\n寄存器后，l3才能读寄存器内容，所以l3的ID段被阻塞CI分）。L的IF段被阻塞的原因：因\n为l4的前一条指令l3在ID段被阻塞，所以L的IF段被阻塞(1分）。\n注意：要求\n”按序发射，按序","fs":"假定某计算机的CPU主频为80MHz，CPI为4,平均每条指令访存1.5次，主存与Cache\n之间交换的块大小为16B，Cache的命中率为99%，存储器总线宽度为32位。请回答下列问题。\n的情况下，主存带宽至少达到多少才能满足CPU的访存要求？\n2）假定在Cache缺失的情况下访问主存时，存在0.0005%的缺页率，则CPU平均每秒产\n生多少次缺页异常？若页面大小为4KB，每次缺页都需要访问磁盘，访问磁盘时DMA传送采\n用周期挪用方式，磁盘I/O接口的数据缓冲寄存器为32位，则磁盘I/O接口平均每秒发出的\nDMA请求次数至少是多少？\n3）CPU和DMA控制器同时要求使用存储器总线时，哪个优先级更高？为什么？\n4）为了提高性能，主存采用四体低位交叉存储模式，工作时每1/4个存储周期启动一个体。\n若每个体的存储周期为50ns，则该主存能提供的最大带宽是多少？"},{"y":2012,"q":44,"t":1,"s":"CO","ch":"中央处理器","sec":"指令流水线","kp":"CO.5.5","kn":"指令流水线性能与结构/数据/控制冒险","p":10,"st":"某16位计算机中，带符号整数用补码表示，数据Cache和指令Cache分离。题44表 给出了指令系统中部分指令格式，其中Rs和Rd表示寄存器，mem表示存储单元地址，(x)表 示寄存器x或存储单元x的内容。 指令系统中部分指令格式 名称 指令的汇编格式 指令功能 加法指令 ADD Rs, Rd (R","x":"44. 解答：\n1) X 的机器码为[x]补= 1111 1101 1111 1111B, 即指令执行前(RI) = FDFFH, 右移l位后位\n1111 1110 1111 1111B, 即指令执行后(Rl)= FEFFH 。(2分）\n2)每个时钟周期只能有一条指令进入流水线，从第5个时钟周期开始，每个时钟周期都\n会有一条指令执行完毕，故至少需要4 + (5-1) = 8个时钟周期。(2分）\n3) l3的ID段被阻塞的原因：因为l3与l 1 和l2都存在数据相关，需等到l 1 和l2 将结果写回\n寄存器后，l3才能读寄存器内容，所以l3的ID段被阻塞CI分）。L的IF段被阻塞的原因：因\n为l4的前一条指令l3在ID段被阻塞，所以L的I 号为21。理由：因为起始驻留集为空，因此0页对应的页框为空闲链表中的第三\n个空闲页框21, 其对应的页框号为21。\n2)页框号为32。理由：因11 \u003e 10故发生第三轮扫描，页号为1的页框在第二轮已处千空\n闲页框链表中，此刻该页又被重新访问，因此应被重新放回驻留集中，其页框号为32。\n3)页框号为41。理由：因为第2页从来没有被访问过，它不在驻留集中，因此从空闲页\n框链表中取出链表头的页框41, 页框号为41。\n4)合适。理由：如果程序的时间局部性越好，那么从空闲页框链表中重新取回的机会越\n大，该策略的优势越明显。\n46. 解答：\n1)文件系统中所能容纳的磁盘块总数为4TB/1KB = 232。要完全表示所有磁盘块，索引项\n中的块号最少要占32/8 = 4B。而索引表区仅采用直接索引结构，故512B 的索引表区能容纳\n512B/4B = 128个索引项。每个索引项对应一个磁盘块，所以该系统可支持的单个文件最大长度\n是128x 1KB = 128KB。\n2)这里的考查的分配方式不同于我们所熟悉的三种经典分配方式，但是题目中给出了详\n细的解释。所求的单个文件最大长度一共包含两部分：预分配的连续空间和直接索引区。\n连续区块数占2B, 共可以表示2'6个磁盘块，即2\n26B。直接索引区共504B/6B = 84个索引\n项。所以该系统可支持的单个文件最大长度是226B + 84KB。\n为了使单个文件的长度达到最大，应使连续区的块数字段表示的空间大小尽可能接近系统\n最大容量4TB。分别设起始块号和块数分别占4B, 这样起始块号可以寻址的范围是232个磁盘\n块，共4TB,\n即整个系统空间。同样，块数字段可以表示最多232个磁盘块，共4TB。\n47. 解答：\n\n1)由题47-a 表看出，源IP地址为IP分组头的第13-16字节。\n表中1、3、4号\n分组的源IP地址均为192.168.0.8 Cc0a8 0008H), 所以1、3、4号分组是由H发送的。\n题47-a 表中，1号分组封装的TCP段的SYN","fs":"某请求分页系统的局部页面置换策略如下：系统从0时刻开始扫描，每隔5个时间单\n位扫描一轮驻留集（扫描时间忽略不计），本轮没有被访问过的页框将被系统回收，并放入\n到空闲页框链尾，其中内容在下一次分配之前不被清空。当发生缺页时，如果该页曾被使用\n过且还在空闲页链表中，那么重新放回进程的驻留集中；否则，从空闲页框链表头部取出一\n个页框。\n假设不考虑其他进程的影响和系统开销。初始时进程驻留集为空。目前系统空闲页框链表\n中页框号依次为 32、15、21、41。进程P依次访问的\u003c虚拟页号，访问时刻\u003e是\u003c1,1\u003e,\u003c3,2\u003e,\u003c0,\n4\u003e,\u003c0,6\u003e,\u003c1,11\u003e,\u003c0,13\u003e,\u003c2,14\u003e。请回答下列问题。\n1）访问\u003c0,4\u003e时，对应的页框号是什么？说明理由。\n2）访问\u003c1，11\u003e时，对应的页框号是什么？说明理由。\n3）访问\u003c2,14\u003e时，对应的页框号是什么？说明理由。\n．4）该策略是否适合于时间局部性好的程序？说明理由。"},{"y":2012,"q":46,"t":1,"s":"OS","ch":"文件管理","sec":"文件","kp":"OS.4.3","kn":"文件物理结构（连续/链接/索引分配）与混合索引","p":7,"st":"某文件系统空间的最大容量为4TB（1TB=24°B)，以磁盘块为基本分配单位。磁盘块 大小为1KB。文件控制块（FCB）包含一个512B的索引表区。请回答下列问题。 1）假设索引表区仅采用直接索引结构，索引表区存放文件占用的磁盘块号，索引表项中 块号最少占多少字节？可支持的单个文件最大长度是多少字节","x":"46. 解答：\n1)文件系统中所能容纳的磁盘块总数为4TB/1KB = 232。要完全表示所有磁盘块，索引项\n中的块号最少要占32/8 = 4B。而索引表区仅采用直接索引结构，故512B 的索引表区能容纳\n512B/4B = 128个索引项。每个索引项对应一个磁盘块，所以该系统可支持的单个文件最大长度\n是128x 1KB = 128KB。\n2)这里的考查的分配方式不同于我们所熟悉的三种经典分配方式，但是题目中给出了详\n细的解释。所求的单个文件最大长度一共包含两部分：预分配的连续空间和直接索引区。\n连续区块数占2B, 共可以表示2'6个磁盘块，即2\n26B。直接索引区共504B/6B = 84个索引\n项。所以该系统可支持的单个文件最大长度是226B + 84KB。\n为了使单个文件的长度达到最大，应使连续区的块数字段表示的空间大小尽可能接近系统\n最大容量4TB。分别设起始块号和块数分别占4B, 这样起始块号可以寻址的范围是232个磁盘\n块，共4TB,\n即整个系统空间。同样，块数字段可以表示最多232个磁盘块，共4TB。\n47. 解答：\n\n1)由题47-a 表看出，源IP地址为IP分组头的第13-16字节。\n表中1、3、4号\n分组的源IP地址均为192.168.0.8 Cc0a8 0008H), 所以1、3、4号分组是由H发送的。\n题47-a 表中，1号分组封装的TCP段的SYN = 1,ACK = O, seq = 846b41c5H; 2号分组封装的\nTCP段的SYN = 1,ACK= 1, seq = e059 9fefH, ack = 846b41c6H;3号分组封装的TCP段的ACK = 1,\nseq = 846b 41c6H, ack = e059 9flDH, 所以1、2、3号分组完成了TCP连接的建立过程。\n由于快速以太网数据帧有效载荷的最小长度为46字节，表中3、5 号分组的总长度为40\n(28H)字节，小于46字节，其余分组总长度均大于46字节。所以3、5号分组通过快速以太\n网传输时需要填充。\n2)由3号分组封装的TCP段可知，发送应用层数据初始序","fs":"某文件系统空间的最大容量为4TB（1TB=24°B)，以磁盘块为基本分配单位。磁盘块\n大小为1KB。文件控制块（FCB）包含一个512B的索引表区。请回答下列问题。\n1）假设索引表区仅采用直接索引结构，索引表区存放文件占用的磁盘块号，索引表项中\n块号最少占多少字节？可支持的单个文件最大长度是多少字节？\n2）假设索引表区采用如下结构：第0～7字节采用\u003c起始块号，块数\u003e格式表示文件创建时\n预分配的连续存储空间，其中起始块号占6B，块数占2B；剩余504字节采用直接索引结构，\n一个索引项占6B，那么可支持的单个文件最大长度是多少字节？为了使单个文件的长度达到最\n大，请指出起始块号和块数分别所占字节数的合理值并说明理由。"},{"y":2012,"q":47,"t":1,"s":"NET","ch":"传输层","sec":"TCP协议","kp":"NET.5.3","kn":"TCP 段格式/连接管理（三次握手四次挥手）","p":9,"st":"主机 H通过快速以太网连接Intermet，IP 地址为192.168.0.8，服务器S 的IP地址为 211.68.71.80。H与S使用TCP通信时，在H上捕获的其中5个IP分组如题47-a表所示。 题47-a表 编号 IP分组的前40字节内容（十六进制） d3 44 47 50 1 0b d9","x":"47. 解答：\n\n1)由题47-a 表看出，源IP地址为IP分组头的第13-16字节。\n表中1、3、4号\n分组的源IP地址均为192.168.0.8 Cc0a8 0008H), 所以1、3、4号分组是由H发送的。\n题47-a 表中，1号分组封装的TCP段的SYN = 1,ACK = O, seq = 846b41c5H; 2号分组封装的\nTCP段的SYN = 1,ACK= 1, seq = e059 9fefH, ack = 846b41c6H;3号分组封装的TCP段的ACK = 1,\nseq = 846b 41c6H, ack = e059 9flDH, 所以1、2、3号分组完成了TCP连接的建立过程。\n由于快速以太网数据帧有效载荷的最小长度为46字节，表中3、5 号分组的总长度为40\n(28H)字节，小于46字节，其余分组总长度均大于46字节。所以3、5号分组通过快速以太\n网传输时需要填充。","fs":"主机 H通过快速以太网连接Intermet，IP 地址为192.168.0.8，服务器S 的IP地址为\n211.68.71.80。H与S使用TCP通信时，在H上捕获的其中5个IP分组如题47-a表所示。\n\n题47-a表\n编号\nIP分组的前40字节内容（十六进制）\nd3 44 47 50\n1\n0b d91388846b41c5\n0000000070024380\n5db00000\n4300003000004000\n31066e83\nd3 44 4750\nc0a80008\n2\n13880bd9\ne0599fef\n846b 41 c6\n701216d0\n37e10000\n45000028（\n80 061def\nd3 44 47 50\n019c400 均寻道时间是6ms，磁盘传输速率是20MB/s，磁盘控 制器延迟为0.2ms，读取一个4KB的扇区所需的平均时间约为 D. 12.4ms A. 9ms B. 9.4ms C. 12ms","o":["9ms","9.4ms","12ms","12.4ms"],"a":"B","x":"磁盘转速是lOOOOrpm, 转一圈的时间为6ms, 因此平均查询扇区的时间为3ms, 平均寻道\n时间为6ms, 读取4KB扇区信息的时间为4KB/(20MB/s) = 0.2ms, 磁盘控制器延迟为0.2ms,\n总时间为3 + 6 + 0.2 + 0.2 = 9.4ms。","im":"qimg/2013_21.png","imscan":1},{"y":2013,"q":22,"t":0,"s":"CO","ch":"中央处理器","sec":"异常和中断机制","kp":"CO.5.4","kn":"异常与中断的分类、检测与响应","p":2,"st":"下列关于中断I/O方式和DMA方式比较的叙述中，错误的是 A. 中断I/O方式请求的是CPU处理时间，DMA方式请求的是总线使用权 B. 中断响应发生在一条指令执行结束后，DMA响应发生在一个总线事务完成后 C. 中断I/O方式下数据传送通过软件完成，DMA方式下数据传送由硬件完成 D. 中断IO方","o":["中断I/O方式请求的是CPU处理时间，DMA方式请求的是总线使用权","中断响应发生在一条指令执行结束后，DMA响应发生在一个总线事务完成后","中断I/O方式下数据传送通过软件完成，DMA方式下数据传送由硬件完成","中断IO方式适用于所有外部设备，DMA方式仅适用于快速外部设备"],"a":"D","x":"中断处理方式：在1/0设备输入每个数据的过程中，由于无须CPU干预，因而可使CPU\n与1/0设备并行工作。仅当输完一个数据时，才需CPU花费极短的时间去做些中断处理。因此\n中断申请使用的是CPU处理时间，发生的时间是在一条指令执行结束之后，数据是在软件的控\n制下完成传送的。而DMA方式与之不同。DMA方式：数据传输的基本单位是数据块，即在\nCPU与1/0设备之间，每次传送至少一个数据块；DMA方式每次申请的是总线的使用权，所\n传送的数据是从设备直接送入内存的，或者相反；仅在传送一个或多个数据块的开始和结束时，\n才需CPU干预，整块数据的传送是在控制器的控制下完成的。","im":"qimg/2013_22.png","imscan":1},{"y":2013,"q":23,"t":0,"s":"OS","ch":"文件管理","sec":"文件","kp":"OS.4.1","kn":"文件概念/元数据/inode/文件操作","p":2,"st":"用户在删除某文件的过程中，操作系统不可能执行的操作是 A. 删除此文件所在的目录 B. 删除与此文件关联的目录项 C. 删除与此文件对应的文件控制块 D. 释放与此文件关联的内存缓冲区","o":["删除此文件所在的目录","删除与此文件关联的目录项","删除与此文件对应的文件控制块","释放与此文件关联的内存缓冲区"],"a":"A","x":"此文件所在目录下可能还存在其他文件，因此删除文件时不能（也不需要）删除文件所在\n的目录，而与此文件关联的目录项和文件控制块需要随着文件一同删除，同时释放文件关联的\n内存缓冲区。","im":"qimg/2013_23.png","imscan":1},{"y":2013,"q":24,"t":0,"s":"OS","ch":"文件管理","sec":"文件","kp":"OS.4.1","kn":"文件概念/元数据/inode/文件操作","p":2,"st":"为支持CD-ROM中视频文件的快速随机播放，播放性能最好的文件数据块组织方式 是 A. 连续结构 B. 链式结构 C. 直接索引结构D. 多级索引结构","o":["连续结构","链式结构","直接索引结构","多级索引结构"],"a":"A","x":"为了实现快速随机播放，要保证最短的查询时间，即不能选取链表和索引结构，因此\n连续结构最优。","im":"qimg/2013_24.png","imscan":1},{"y":2013,"q":25,"t":0,"s":"OS","ch":"输入输出管理","sec":"I/O管理基础","kp":"OS.5.1","kn":"I/O 控制方式与 I/O 软件层次结构","p":2,"st":"用户程序发出磁盘I/O请求后，系统的处理流程是：用户程序→系统调用处理程序→ 设备驱动程序→中断处理程序。其中，计算数据所在磁盘的柱面号、磁头号、扇区号的程序 种交换 方式完成该报文传输所需的总时间分别为 ","o":["800ms、1600ms","801 ms、1600ms","1600ms、800ms","1600 ms、801ms"],"a":"D","x":"不进行分组时，发送一个报文的时延是8Mb/10Mbps = 800ms, 采用报文交换时，主机甲发\n送报文需要一次时延，而报文到达路由器进行存储转发又需要一次时延，总时延为800msx2\n= \n1600ms。进行分组后，发送一个报文的时延是10kb/10Mbps = lms, 一共有8Mb/10kb = 800个\n分组，主机甲发送800个分组需要lmsx800 = 800ms 的时延，而路由器接收到第一个分组后直\n接开始转发，即除了第一个分组，其余分组经过路由器转发不会产生额外的时延，总时延就为\n800ms + lms = 801ms。","im":"qimg/2013_35.png","imscan":1},{"y":2013,"q":36,"t":0,"s":"NET","ch":"数据链路层","sec":"介质访问控制","kp":"NET.3.4","kn":"随机访问（ALOHA/CSMA/CSMA-CD/CSMA-CA）","p":2,"st":"下列介质访问控制方法中，可能发生冲突的是 A. CDMA B. CSMA C. TDMA D. FDMA","o":["CDMA","CSMA","TDMA","FDMA"],"a":"B","x":"选项A、C和D都是信道划分协议，信道划分协议是静态划分信道的方法，肯定不会发生\n冲突。CSMA全称是载波侦听多路访问协议，其原理是站点在发送数据前先侦听信道，发现信\n道空闲后再发送，但在发送过程中有可能会发生冲突。","im":"qimg/2013_36.png","imscan":1},{"y":2013,"q":37,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络体系结构","kp":"NET.1.2","kn":"分层结构/OSI 与 TCP/IP 模型/协议服务接口","p":2,"st":"HDLC协议对0111110001111110组帧后对应的比特串为 A. 011111000011111010 B. 011111000111110101111110 C. 01111100011111010 D. 0111110001111110 01111101","o":["011111000011111010","011111000111110101111110","01111100011111010","0111110001111110 01111101"],"a":"A","x":"HDLC协议对比特串进行组帧时，HDLC数据帧以位模式0111 1110标识每一个帧的开始\n和结束，因此在帧数据中凡是出现了5个连续的位\"l\" 的时候，就会在输出的位流中填充一个\n\"O\"。因此组帧后的比特串为OllllIQO OOlllllQ 10 (下画线部分为新增的0)。","im":"qimg/2013_37.png","imscan":1},{"y":2013,"q":38,"t":0,"s":"NET","ch":"数据链路层","sec":"局域网与广域网","kp":"NET.3.5","kn":"以太网/IEEE 802.3/802.11/VLAN/PPP","p":2,"st":"对于100Mbps 的以太网交换机，当输出端口无排队，以直通交换（cut-through switching) 方式转发一个以太网帧（不包括前导码）时，引入的转发延迟至少是 A. Oμs B. 0.48μs C. 5.12μs D. 121.44μs","o":["Oμs","0.48μs","5.12μs","121.44μs"],"a":"B","x":"直通交换在输入端口检测到一个数据帧时，检查帧首部，获取帧的目的地址，启动内部的\n动态查找表转换成相应的输出端口，在输入与输出交叉处接通，把数据帧直通到相应的端口，\n实现交换功能。直通交换方式只检查帧的目的地址，共6B,\n所以最短的传输延迟是\n6x8bit/100Mbps = 0.48µs。","im":"qimg/2013_38.png","imscan":1},{"y":2013,"q":39,"t":0,"s":"NET","ch":"传输层","sec":"TCP协议","kp":"NET.5.3","kn":"TCP 段格式/连接管理（三次握手四次挥手）","p":2,"st":"主机甲与主机乙之间已建立一个TCP连接，双方持续有数据传输，且数据
