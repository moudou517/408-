素都小于工作区最小的元素，那么新的归并段大小只能为m。","fs":"(10分)对含有n(n\u003e0)个记录的文件进行外部排序，采用置换－选择排序生成初始归并段时需\n要使用一个工作区，工作区中能保存m个记录，请回答下列问题：\n(1）若文件中有19个记录，其关键字依次是51，94，37，92，14，63，15，99，48，56，23，60，\n31，17，43，8，90，166，100。当m=4时，可生成几个初始归并段？每个归并段各是什么？\n(2）对任意m(n》m\u003e0)，生成的第一个初始归并段的长度最大值和最小值分别是多少？","im":"qimg/2023_42.png","imscan":1},{"y":2023,"q":43,"t":1,"s":"CO","ch":"存储器层次结构","sec":"高速缓冲存储器","kp":"CO.3.5","kn":"Cache 基本原理与映射方式（直接/全相联/组相联）","p":13,"st":"（14分)已知计算机M字长为32位，按字节编址，采用请求调页策略的虚拟存储管理方式，虚 拟地址32位，页大小为4KB；数据Cache采用4路组相联映射方式，数据区大小为8KB，主存 块大小为32B。现有C语言程序段如下： inta[24][24]; for(i=0;i\u003c24;i++) for(j=0","x":"43.\n\n(1）数组a的大小为24行x64列，每个元素的大小为4字节（int类型）。页面大小为4KB，因此\n每个页面可以容纳(4KB)/(4B)=1024个元素。所以数组a需要占用(24×64)/1024=1.5个\n页面。由于页面是最小单位，因此数组a需要占用2个页面。在访问数组a的过程中，每次访\n问一个页面，都需要将该页面加载到内存中，因此会出现2次缺页。第一次缺页发生在第一\n个元素，第二次缺页发生在访问第二页的第一个元素（即第1025个元素），第一个元素的虚\n\n拟地址00422000H，第1025个元素的地址为00422000H+1024×4=00422000H+1000H=\n00423000H，页故障的地址分别为00422000H和00423000H。\n(2）时间局部性是指在一段时间内，如果某个数据被访问，那么在不久的将来该数据很可能再次\n被访问。因为本题中对数组a的每个元素只访问一次，所以没有时间局部性。\n(3）内存块大小为32B，所以块内地址为5位。Cache数据区一共有8KB/32B=28块，采用4\n路组相联，每4块为一组，所以共有2°/22=26组，所以组号需要6位，剩下的21位为\nTag位。所以块内的地址为A4～A0，Cache的组号为A10～A5，a[1][0]的虚拟地址为\n00422000H+64×1=00422000H+100H=00422100H。对应Cache的组号为001000B=8。\n(4）数组a共占（24×64×4B)/32B=192块，因为一个内存块为32B，每个int类型占4B，所以\n一个内存块包含8个int，则每次访问该内存块的第一个元素会不命中，访问剩下的7个元\n素都会命中，所以命中率为7/8=87.5%。因为Cache的总块数大于192块，不管是按照行\n访问还是按照列访问，命中率都为87.5%。","fs":"（14分)已知计算机M字长为32位，按字节编址，采用请求调页策略的虚拟存储管理方式，虚\n拟地址32位，页大小为4KB；数据Cache采用4路组相联映射方式，数据区大小为8KB，主存\n块大小为32B。现有C语言程序段如下：\ninta[24][24];\nfor(i=0;i\u003c24;i++)\nfor(j=0; j\u003c64; j++)\na[i][j]=10;\n已知二维数组a按行优先存储，在虚拟地址空间中分配的起始地址为00422000H，sizeof(int)=\n4，假定在M上执行上述程序段之前数组a不在内存，且在该程序段执行过程中不会发生页面\n置换。请回答下列问题：\n(1）数组a分布在几个页面中？对于数组a的访问，会发生几次缺页异常？页故障地址各是什么？\n第6页 (共8页)\n\n(2）不考虑对变量i和j，该程序段的数据访问是否具有时间局部性？为什么？\n元素a[1][0]的虚拟地址是多少？其所在主存块对应的Cache组号是多少?\n(4）数组a总共占多少主存块？假设上述程序段执行过程中数组a的访问不会和其他数据发生\nCache访问冲突，则数组a的Cache命中率是多少？若将循环中i和j的次序按如下方式调\n换，则数组a的Cache命中率又是多少？\nfor（j=0;j\u003c64;j++)\nfor（i=0;i\u003c24;i++)\na[i][j]=10;","im":"qimg/2023_43.png","imscan":1},{"y":2023,"q":44,"t":1,"s":"CO","ch":"指令系统","sec":"高级语言程序与机器级代码之间的对应","kp":"CO.4.4","kn":"高级语言到机器级代码（选择/循环/过程调用/栈帧）","p":10,"st":"(9分)题43中C程序段在计算机M上的部分机器级代码如下，每个机器级代码行中依次包含 指令序号、虚拟地址、机器指令和汇编指令。 for (i=0;i\u003c 24;i++) mov[ebp - 8], 0 1 00401072 C745F800000000 2 00401079 EB 09 jmp 004","x":"44.\n\n（1）第19条指令的虚拟地址为004010AEH，同时第19条指令占用11字节，所以第20条指令\n的虚拟地址为004010AE+0BH=004010B9H。\n(2）这两条指令都采用的相对寻址方式，执行jmp指令的时候，程序计数器下一条指令的地址\n为0040107BH，加上偏移量为09H，则跳转地址为0040107BH+09H=00401084H。\n(3）原操作数在指令中直接给出，所以是立即数寻址方式。因为数组a为24行64列，edx存放\nj，代表列数，则ecx存储的值和行数相关，每行有64个int，则对应的值为64×4×i=256i。\n对于立即数00422000H来说，在内存中的存储方式为00204200，低字节存放在低地址，所\n以采用的是小端模式。\n(4）第19条指令对应的虚拟地址为004010AEH，对应的页号为00401H，对应的页面在前面的\n指令已经进行调人，所以不会发生缺页。","fs":"(9分)题43中C程序段在计算机M上的部分机器级代码如下，每个机器级代码行中依次包含\n指令序号、虚拟地址、机器指令和汇编指令。\nfor (i=0;i\u003c 24;i++)\nmov[ebp - 8], 0\n1\n00401072\nC745F800000000\n2\n00401079\nEB 09\njmp 00401084h\n3\n0040107B\n8B55 F8\nmov eax,[ebp - 8]\njge 004010bch\n7\n00401088\n7D32\nfor (j = 0; j\u003c64; j++)\n0040108AC745FC00000000\nmov[ebp - 4], 0\n8\na[i][]=10;\nmov[ecx+edx*4+00422000h],0Ah\n请回答下列问题。\n(1）第20条指令的虚拟地址是多少?\n(2）已知第2条jmp 和第7条jge 都是跳转指令，其操作码分别是EBH和7DH，跳转目标地址\n分别为00401084H和004010BCH，这两条指令分别采用什么寻址方式？请给出第2条指令\njmp的跳转目标地址计算过程。\n(3）已知第19条mov指令的功能是“a[i][j]←10\"，其中ecx和edx为寄存器名，00422000H是\n数组a的首地址，指令中源操作数采用什么寻址方式？已知edx中存放的是变量j，ecx中存\n放的是什么？根据该指令的机器码判断计算机M采用的是大端还是小端方式？\n(4）第1次执行第19条指令时，取指令过程中是否会发生缺页异常？为什么？","im":"qimg/2023_44.png","imscan":1},{"y":2023,"q":45,"t":1,"s":"OS","ch":"进程管理","sec":"同步与互斥","kp":"OS.2.5","kn":"同步互斥基本概念与临界区管理（软件/硬件方法）","p":8,"st":"（7分)现要求学生使用swap指令和布尔型变量lock实现临界区互斥。lock为线程间共享的变量。 lock的值为TRUE时线程不能进入临界区，为FALSE时线程能够进入临界区。某同学编写的实 现临界区互斥的伪代码如下图(a)所示。 请回答下列问题。 (1）图 (a)的伪代码中哪些语句存在错误？将其","x":"45.\n\n(1）对于实现临界区互斥访问，应该使用循环来等待lock变量为FALSE的时候再进人临界区。\n因此，在上述伪代码中，需要将if语句改为while循环，以确保在lock为TRUE时一直等待，\n直到lock为FALSE才能进人临界区。同时在退出区，需要将lock=TRUE改为lock=FALSE，\n因为lock为TRUE代表上锁了，退出区需要将lock解锁，所以应改为lock=FALSE。\n(2）不能使用newSwap 指令替代 swap，因为 newSwap的执行不具备原子性，在执行 newSwap\n的过程中，如果进行线程的切换，无法正确实现临界区的互斥。","fs":"（7分)现要求学生使用swap指令和布尔型变量lock实现临界区互斥。lock为线程间共享的变量。\nlock的值为TRUE时线程不能进入临界区，为FALSE时线程能够进入临界区。某同学编写的实\n现临界区互斥的伪代码如下图(a)所示。\n请回答下列问题。\n(1）图 (a)的伪代码中哪些语句存在错误？将其改为正确的语句（不增加语句条数)。\n(2）图(b)给出了交换两个变量值的函数newSwapO的代码，是否可以用函数调用语句\n第7页 (共8页)\n\n某同学编写的伪代码\nnewSwap（）的代码\nbool lock=FALSE;\nⅡ共享变量\nvoid newSwap(bool *a,bool *b){\nbool temp = *a ;\nbool key=TRUE;\n*a=*b;\nif (key ==TRUE)\n进入区\n*b = temp;\nswapkey,lock；//交换key和lock的值！\n临界区；\nlock=TRUE;\n退出区\n(a)\n(b)","im":"qimg/2023_45.png","imscan":1},{"y":2023,"q":46,"t":1,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.2","kn":"内核态/用户态与特权指令、系统调用","p":7,"st":"(8分)进程P通过执行系统调用从键盘接收一个字符的输人。已知此过程中与进程P相关的操 作包括：①将进程P插人就绪队列；②将进程P插人阻塞队列；③将字符从键盘控制器读人系 统缓冲区；④启动键盘中断处理程序；③进程P从系统调用返回；6用户在键盘上输人字符。 以上编号①～仅用于标记操作，与操作的先后顺序无","x":"46.\n\n(1）正确的步骤为②，，④，③，①，③。当进程P通过系统调用请求从键盘读人一个字符，\n进程P首先会被阻塞，等待用户输人字符，用户输人字符后，键盘会发送中断请求给CPU，\nCPU调用相应的中断处理程序，把字符从键盘控制器读人系统缓冲区，字符读到系统缓冲\n区后，进程P因为IO请求完成了，会被调人就绪队列，之后系统调用完成，进行返回。所\n以①的前一个步骤为③，①的后一个步骤为③，的后面是步骤④。\n(2）步骤2一定会使CPU从P进程切换到其他进程，因为P进程阻塞了，这时候CPU会去执行\n就绪队列中的任务。步骤1之后可以调度进程P，因为P在就绪队列中，可以进行调度了。\n(3）磁盘驱动程序是由CPU执行的，负责把字符从键盘控制器读人系统缓冲区，所以步骤3是\n由键盘驱动程序完成的。\n\n(4）中断处理时候，进程P是阻塞状态，CPU因为需要访问内存和硬件，所以处于内核态。","fs":"(8分)进程P通过执行系统调用从键盘接收一个字符的输人。已知此过程中与进程P相关的操\n作包括：①将进程P插人就绪队列；②将进程P插人阻塞队列；③将字符从键盘控制器读人系\n统缓冲区；④启动键盘中断处理程序；③进程P从系统调用返回；6用户在键盘上输人字符。\n以上编号①～仅用于标记操作，与操作的先后顺序无关。请回答下列问题。\n(1）按照正确的操作顺序，操作①的前一个和后一个操作分别是上述操作中的哪一个？操作6\n的后一个操作是上述操作中的哪一个？\n(2）在上述哪个操作之后，CPU一定从进程P切换到其他进程？在上述哪个操作之后CPU调度\n程序才能选中进程P执行？\n(3）完成上述哪个操作的代码属于键盘驱动程序？\n(4）键盘中断处理程序执行时，进程P处于什么状态？CPU处于内核态还是用户态？","im":"qimg/2023_46.png","imscan":1},{"y":2023,"q":47,"t":1,"s":"NET","ch":"应用层","sec":"FTP与电子邮件","kp":"NET.6.2","kn":"FTP/SMTP/POP3/IMAP/MIME","p":9,"st":"（9分)某网络拓扑如下图所示，主机H登录到FTP服务器后，向服务器上传一个大小为18000B 的文件F。假设H为传输F建立数据连接时，选择的初始序号为100，MSS=1000B，拥塞控制 的初始阈值是4MSS，RTT=10ms，忽略TCP的传输时延；在F的传输过程中，H均以MSS段 向服务器发送数据","x":"47.\n\n（1）FTP的控制连接是持久的，而FTP的数据连接是非持久的。控制连接在FTP会话期间一直\n保持开放状态，用于发送命令和控制信息，如登录验证、文件操作指令等。控制连接的持久\n性允许客户端和服务器之间进行多个命令的交互，直到会话结束或显式关闭控制连接。数据\n连接在FTP中用于传输文件内容。每当需要传输文件时，FTP客户端和服务器之间会建立\n一个临时的数据连接，用于传输文件的实际数据。这个数据连接在文件传输完成后会关闭，\n因此是非持久的。在登录服务器时，建立的TCP连接是控制连接。登录操作涉及身份验证、\n发送命令等控制信息，因此使用的是控制连接。数据连接仅在需要传输文件时才会建立。\n(2）FTP使用TCP连接进行数据的传输，在TCP三次握手的过程中，需要消耗1个序号，所以\nF的第一个字节序号为101。在断开数据连接的数据过程中，共传输了18000B的数据，数\n据的第一个序号为101，数据的最后一个序号为18100。在完成数据传输后，客户端发送的\nseq等于已传送过的数据最后一个字节的序号加1，所以seq=18101，因为TCP规定，FIN报\n文即使不携带数据，也消耗掉一个序号。所以服务器给客户端返回的ack=18102，代表已经\n收到了seq=18101号数据，想要接收序号为18102的字节。所以FTP发送的第二次挥手的\nACK序号为18102。\n(3）3MSS。5MSS。主机H发送数据的第一个字节为101，MSS为1000B，代表每次可以发送的\n报文大小为1000B。第一个报文段的序号为101-1100，第二个报文段的序号为1101-2100，\n以此类推。慢开始的门限值为4MISS，在执行满开始算法的时候，发送发每收到一个对新报\n文的确认ACK，拥塞窗口值加1。在本题中，接收到确认号为2101，代表也接收到了确认\n号1101，所以接收到了两个报文段的ACK，这时候的窗口值因为还没有超过4MSS，所以\nH的拥塞窗口值的大小为3MSS。7101代表的是对第7个报文段的确认，发送第一个报文段\n(101-1100)，接收到第一个报文的确认，拥塞窗口调整为2MSS，发送2、3报文段，接收到","fs":"（9分)某网络拓扑如下图所示，主机H登录到FTP服务器后，向服务器上传一个大小为18000B\n的文件F。假设H为传输F建立数据连接时，选择的初始序号为100，MSS=1000B，拥塞控制\n的初始阈值是4MSS，RTT=10ms，忽略TCP的传输时延；在F的传输过程中，H均以MSS段\n向服务器发送数据，且未发生差错、丢包和乱序现象。\nInternet\nFTP服务器\nH\n交换机\n路由器\n请回答下列问题。\n(1）FTP的控制连接是持久的还是非持久的？FTP的数据连接是持久的还是非持久的？H登录\nFTP服务器时，建立的TCP连接是控制连接还是数据连接？\n(2）H通过数据连接发送F时，F的第一个字节序号是多少？在断开数据连接的过程中，FTP服\n务器发送的第二次挥手ACK段的确认序号是多少？\n(3）H通过数据连接发送F的过程中，当H收到确认序号为2101的确认时，H的拥塞窗口调整\n为多少？收到确认序号为7101的确认段时，H的拥塞窗口调整为多少？\n(4）H从请求建立数据连接开始，到确认F已被服务全部接收为止，至少需要多长时间？在这期\n间应用层数据的平均发送速率是多少？\n第8页 (共8页)","im":"qimg/2023_47.png","imscan":1},{"y":2024,"q":1,"t":0,"s":"DS","ch":"线性表","sec":"线性表的实现","kp":"DS.2.2","kn":"单链表/双链表/循环链表/静态链表","p":2,"st":"已知带头结点的非空单链表L 的头指针为h，结点结构为 ，其中 next 是指向直 接后继结点的指针。现有指针p 和q， 若 p 指向L 中非首且非尾的任意一个结点，则执行语 句序列“q=p-\u003enext； p-\u003enext=q-\u003enext；q-\u003enext= h-\u003enext;；h-\u003enext=q；”的结果","o":["在p 所指结点后插入q 所指结点","在q 所指结点后插入p 所指结点","将p 所指结点移动到L 的头结点之后","将q 所指结点移动到L 的头结点之后"],"a":"D","x":"本题考查链表的基本操作。\n语句q=p-\u003enext：指针q 指向p 的下一个结点； \n语句p-\u003enext=q-\u003enext：p 的next 域指向q 的下一个结点，即将q 所指结点从链表中取出； \n语句q-\u003enext=L-\u003enext：q 的next 域指向第一个结点（头结点的后一个结点）； \n语句L-\u003enext=q：头指针指向q 所指结点。 \n因此，这段代码的功能是将q 结点移动到表头。故本题选D。","im":"qimg/2024_1.png"},{"y":2024,"q":2,"t":0,"s":"DS","ch":"栈、队列和数组","sec":"栈、队列和数组的应用","kp":"DS.3.4","kn":"栈的应用（表达式/lower/递归/括号匹配）","p":2,"st":"与表达式x+y*(z-u) / v 等价的后缀表达式是（ ）。 A. xyzu-*v/+ B. xyzu-v/*+ C. +x / * y-zuv D. +x* y /-zuv","o":["xyzu-*v/+","xyzu-v/*+","+x / * y-zuv","+x* y /-zuv"],"a":"A","x":"本题考查栈的应用中表达式的转换。\n可以采用增减括号的方法解答。\n（1）根据运算的先后顺序为中缀表达式全部加上括号变为(x+((y*(z-u))/v))；\n（2）把运算符移到对应的括号外面，变为：(x((y(zu)-)*v)/)+；\n（3）将括号全部去除后即为后缀表达式：xyzu-*v/+。故本题选A。"},{"y":2024,"q":3,"t":0,"s":"DS","ch":"树与二叉树","sec":"二叉树的遍历","kp":"DS.5.3","kn":"二叉树遍历（先/中/后/层次）与序列还原","p":2,"st":"若p 、q 和v 均为二叉树 T 中的结点，v 有两个孩子结点，T 的中序遍历序列形如：“...， p，v，q，...”，则下列叙述中，正确的是（ ）。 A. p 没有右孩子，q 没左孩子 B. p 没有右孩子，q 有左孩子 C. p 有右孩子，q 没有左孩子 D. p 有右孩子，q 有左孩子","o":["p 没有右孩子，q 没左孩子","p 没有右孩子，q 有左孩子","p 有右孩子，q 没有左孩子","p 有右孩子，q 有左孩子"],"a":"A","x":"本题考查二叉树的遍历。\n中序遍历的顺序为左子树、根结点、右子树。本题中v 有两个孩子结点，且中序遍历中有片段\np,v,q，则p、q 分别是v 左、右子树中的结点。在v 的左子树中，p 是左子树的中序遍历序列最\n后一个结点，则p 是最右边的结点，故p 没有右孩子；在v 的右子树中，q 是右子树的中序遍\n历序列第一个结点，则q 是最左边的结点，故q 没有左孩子。故本题选A。"},{"y":2024,"q":4,"t":0,"s":"DS","ch":"图","sec":"图的基本概念","kp":"DS.6.1","kn":"图的基本概念（度/路径/连通/生成树/回路）","p":2,"st":"若无向图G = (V，E)的邻接多重表如下图所示，则G 中顶点b 与d 的度分别是（ ）。 A. 0，2 B. 2，4 C. 2，5 D. 3，4","o":["0，2","2，4","2，5","3，4"],"a":"B","im":"qimg/2024_4.png"},{"y":2024,"q":5,"t":0,"s":"DS","ch":"线性表","sec":"线性表的实现","kp":"DS.2.2","kn":"单链表/双链表/循环链表/静态链表","p":2,"st":"下列数据结构中, 不适合直接使用折半查找的是（ ）。 data next I.有序链表 II.无序数组 III.有序静态链表 IV.无序静态链表 A. 仅I 、III B. 仅II、IV C. 仅II、III、IV D. I、II、III、IV","o":["仅I 、III","仅II、IV","仅II、III、IV","I、II、III、IV"],"a":"D","x":"本题考查折半查找的基本性质。 \n折半查找，也称二分查找，在某些情况下相比于顺序查找，使用折半查找算法的效率更高。但\n是该算法的使用的前提是静态查找表中的数据必须是有序的。也就是说，在使用折半查找算法\n查找数据之前，应该首先把该表的数据按照所查的关键字进行排序。链表不支持随机查找，故\nI 不适用，无序数组不适用折半查找，故II 不适用。静态链表是用数组来实现链式存储结构，\n目的是方便在不设指针类型的高级程序设计语言中使用链式结构。故III、IV 不适用。故本题\n选D。"},{"y":2024,"q":6,"t":0,"s":"DS","ch":"串","sec":"字符串模式匹配","kp":"DS.4.1","kn":"KMP 模式匹配与 next/nextval 数组","p":2,"st":"KMP 算法使用修正后的next 数组进行模式匹配，模式串 S= “aabaab”，当主串中某字符与 S 中某字符失配时， S 将向右滑动的最长距离是（ ）。 A. 5 B. 4 C. 3 D. 2","o":["5","4","3","2"],"a":"A","x":"本题考查KMP 算法中nextval 的应用。 \n传统KMP 算法使用next 数组，会存在j=next[j]的情况，因此采用next_val 来优化，处理结果\n如下： \n下标 \n1 \n2 \n3 \n4 \n5 \n6 \n字符 \na \na \nb \na \na \nb \nnext \n0 \n1 \n2 \n1 \n2 \n3 \nnextval \n0 \n0 \n2 \n0 \n0 \n2 \n当主串中某个字符与S 中某字符失配时，有6 种情况，分别为下标1-6 不匹配。 \n当下标1 不匹配时，需要右移1 位 \n当下标2 不匹配时，需要右移2 位 \n当下标3 不匹配时，需要右移1 位 \n当下标4 不匹配时，需要右移4 位 \n当下标5 不匹配时，需要右移5 位 \n当下标"},{"y":2024,"q":7,"t":0,"s":"DS","ch":"树与二叉树","sec":"树与二叉树的应用","kp":"DS.5.9","kn":"二叉排序树（BST）","p":2,"st":"一棵二叉搜索树如题7 图所示，k1、k2、k3 分别是对应结点保存的关键字，子树T 的任一 结点中保存的关键字x 满足的是（ ）。 A. x\u003c k1 B. x \u003e k2 C. k1 \u003c x \u003c k3 D. k3 \u003c x \u003c k2","o":["x\u003c k1","x \u003e k2","k1 \u003c x \u003c k3","k3 \u003c x \u003c k2"],"a":"D","x":"本题考查二叉搜索树的基本性质。二叉搜索树，即二叉排序树。由二叉排序（搜索）\n树的性质：若它的左子树不空，则左子树上所有结点的值均小于它的根结点的值；若它的右子\n\n树不空，则右子树上所有结点的值均大于它的根结点的值。那么大小顺序应该是：K1\u003cK3\u003cT\u003cK2，\nT 中任意结点均满足该大小顺序。而X 是T 中的一个结点，故本题选D。","im":"qimg/2024_7.png"},{"y":2024,"q":8,"t":0,"s":"DS","ch":"排序","sec":"交换排序","kp":"DS.8.4","kn":"起泡排序与快速排序","p":2,"st":"使用快速排序算法对含n(n≥3)个元素的数组 M 进行排序， 若第一趟排序将 M 中除枢轴 外的n-1 个元素划分为均不为空的 P 和Q 两块，则下列叙述中，正确的是（ ）。 A. P 与Q 块间有序 B. P 与Q 均块内有序 C. P 和Q 的元素个数大致相等 D. P 中和Q 中均不存在相等的","o":["P 与Q 块间有序","P 与Q 均块内有序","P 和Q 的元素个数大致相等","P 中和Q 中均不存在相等的元素"],"a":"A","x":"本题考查快速排序的基本性质。 \n快速排序的基本思想是，通过一趟排序将待排记录分割成独立的两部分，其中一部分记录的关\n键字均比另一部分记录的关键字小，之后，可分别对这两部分记录继续进行排序，以达到整个\n序列有序。故第一趟排序将M 划分为均不空的P 和Q 两块，P 与Q 之间应是块间有序，但P\n与Q 内的顺序无法确定。故本题选A。"},{"y":2024,"q":9,"t":0,"s":"DS","ch":"树与二叉树","sec":"树与二叉树的应用","kp":"DS.5.8","kn":"堆（大根堆/小根堆）及其调整与建堆","p":2,"st":"已知关键字序列 28，22，20，19，8，12，15，5 是大根堆 (最大堆)，对该堆进行两次删除 操作后， 得到的新堆是（ ）。 A. 20，19，15，12，8，5 B. 20，19，15，5，8，12 C. 20，19，12，15，8，5 D. 20，19，8，12，15，5","o":["20，19，15，12，8，5","20，19，15，5，8，12","20，19，12，15，8，5","20，19，8，12，15，5"],"a":"B","x":"本题考查堆排序的过程。 \n堆的删除操作是把根结点和最后一个结点直接交换，删掉（在最后一个结点处的）根结点，再\n从根结点向下调整。向下调整：在该结点的左右子树中，找一个最大的，与该结点交换，重复\n此过程直到叶子节点。因此删除结点的结构如下图所示。 \n原大根堆： \n \n原大根堆：\n \n \n删除结点28：\n \n调整：\n \n删除结点22：\n \n \n调整：\n \n进行两次删除操作后，得到的新堆是20，19，15，5，8，12；故本题选B。"},{"y":2024,"q":10,"t":0,"s":"DS","ch":"排序","sec":"归并排序","kp":"DS.8.6","kn":"二路归并排序","p":2,"st":"现有由关键字组成的3 个有序序列（3，5）、（7，9）和（6），若按从左至右的次序选择 有序序列进行二路归并排序， 则关键字之间的总比较次数是（ ）。 A. 3 B. 4 C. 5 D. 6 在外排序中，利用败者树对初始为升序的归并段进行多路归并， 败者树中记录“冠军”的结 点保存的是（ ）。 A.","o":["3","4","5","6 在外排序中，利用败者树对初始为升序的归并段进行多路归并， 败者树中记录“冠军”的结 点保存的是（ ）"],"a":"C","x":"本题考查二路归并排序的过程。 \n二路归并排序的思想是假设初始序列含有n 个记录，则可看成是n 个有序的子序列，每个子\n序列的长度为1，然后两两归并，得到个长度为2 或1 的有序子序列；再两两归并，......，如\n此重复，直至得到一个长度为n 的有序序列为止。 \n将（3,5）与（7,9）进行合并： \n3 和7 进行比较，3 存入序列得（3）；（1 次比较） \n5 和7 进行比较，5 存入序列得（3,5）；（1 次比较） \n子序列（3,5）处理完毕，将剩下的依次存入得（3,5,7,9）。 \n将（3,5,7,9）与（6）进行合并： \n3 和6 进行比较，3 存入序列得（3）；（1 次比较） \n5 和6 进行比较，5 存入序列得（3,5）"},{"y":2024,"q":12,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"数制与编码","kp":"CO.2.1","kn":"进制转换与定点数编码（原/反/补/移码）","p":2,"st":"C 语言代码如下。 int i=32777； short si=i； int j=si； 执行上述代码段后，j 的值是（ ）。 A. -32 777 B. -32 759 C. 32 759 D. 32 777","o":["-32 777","-32 759","32 759","32 777"],"a":"B","x":"在这道题目中，涉及到了 int 和 short 类型的转换。首先，让我们明确 int 和 short 类型\n的大小：int 通常是 32 位（4 字节），short 通常是 16 位（2 字节），需要注意的是，int 和\nshort 类型都默认是有符号数，即最高位表示符号位。类型转换的规则是：当长整数转短整数\n时，遵循高位截断，低位保留，会改变符号位；当短整数转长整数时，遵循符号扩展，高位按\n照补码规则补。32777 转换为16 进制数，并用int 类型表示的结果是0000 8009H，转换为short\n型只保留低位16 位，高位截掉，结果为8009H。Short 转换成int 需要符号扩展，8009H 在short\n类型中为负数，"},{"y":2024,"q":13,"t":0,"s":"CO","ch":"指令系统","sec":"高级语言程序与机器级代码之间的对应","kp":"CO.4.4","kn":"高级语言到机器级代码（选择/循环/过程调用/栈帧）","p":2,"st":"通常情况下，将汇编语言程序中实现特定功能的指令序列定义成一条伪指令 (pseudoinstruction)。下列选项中，CPU 能理解并直接执行的是（ ）。 I.伪指令 II.微指令 III.机器指令 IV.汇编指令 A. 仅I、 IV B. 仅II、III C. 仅III、IV D. 仅I、III","o":["仅I、 IV","仅II、III","仅III、IV","仅I、III、IV"],"a":"B","x":"伪指令不是真正的指令，并没有与之对应的的机器码，不会被执行，伪指令所起的作\n用主要是对汇编过程进行控制。汇编指令是汇编语言中的指令，它们使用助记符来表示机器指\n令的功能。汇编指令本身并不是CPU 能直接执行的，它们需要被汇编器转换成机器指令后才\n能被CPU 执行。微指令和机器指令都是可以被CPU 直接执行的。"},{"y":2024,"q":14,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"浮点数的表示和运算","kp":"CO.2.4","kn":"IEEE 754 浮点数表示与规格化","p":2,"st":"某科学实验中，需要使用大量的整型参数，为了保证表数精度的基础上提高运算速度， 需 要选择合理的数据表示方法。若整型参数 α 、β 的取值范围分别为- 220~220、- 240~240，则下列 选项中，α 、β 最适宜采用的数据表示方法分别是（ ）。 A. 32 位整数、32 位整数 B. 单精度浮","o":["32 位整数、32 位整数","单精度浮点数、单精度浮点数","32 位整数、双精度浮点数","单精度浮点数、双精度浮点数"],"a":"C","x":"32 位整数可以表示 α 范围内的每一个数字。对于β，虽然单精度浮点数可以表示的\n范围是-2128 到2128，包含了B 的范围。但是浮点数并不能表示范围内的任意整数。比如 240-1\n的二进制表示是11111111⋯ 1111（39 个1），单精度浮点数不能表示这个数字，因为尾数只有\n23 位。而双精度浮点数的尾数有52 位，可以完全表示β范围里的每一个整数。"},{"y":2024,"q":15,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"运算方法和运算电路","kp":"CO.2.3","kn":"乘法与除法运算（阵列乘法器/除法器）","p":2,"st":"下列关于整数乘法运算的叙述中，错误的是（ ）。 A. 用阵列乘法器实现乘运算可以在一个时钟周期内完成 B. 用ALU 和移位器实现的乘运算无法在一个时钟周期内完成 C. 变量与常数的乘运算可以编译优化为若干条移位及加/减运算指令 D. 两个变量的乘运算无法编译转换为移位及加法等指令的循环实现","o":["用阵列乘法器实现乘运算可以在一个时钟周期内完成","用ALU 和移位器实现的乘运算无法在一个时钟周期内完成","变量与常数的乘运算可以编译优化为若干条移位及加/减运算指令","两个变量的乘运算无法编译转换为移位及加法等指令的循环实现"],"a":"D","x":"二进制的乘法可以表示成左移和加法，比如“111” 可以分为*100+*10+*1 也就是左\n移2 位 +左移1 位+本身。所以一个乘法可以展开成移位和加法，这样可以通过ALU 和移位\n器在多个时钟周期下完成乘法运算。"},{"y":2024,"q":16,"t":0,"s":"CO","ch":"存储器层次结构","sec":"高速缓冲存储器","kp":"CO.3.5","kn":"Cache 基本原理与映射方式（直接/全相联/组相联）","p":2,"st":"对于页式虚拟存储管理系统，下列关于存储器层次结构的叙述中, 错误的是（ ）。 A. Cache-主存层次的交换单位为主存块，主存-外存层次的交换单位为页 B. Cache-主存层次替换算法由硬件实现，主存-外存层次替换算法由软件实现 C. Cache-主存层次可采用回写法写策略，主存-外存层次通常采","o":["Cache-主存层次的交换单位为主存块，主存-外存层次的交换单位为页","Cache-主存层次替换算法由硬件实现，主存-外存层次替换算法由软件实现","Cache-主存层次可采用回写法写策略，主存-外存层次通常采用回写法写策略","Cache-主存层次可采用直接映射方式，主存-外存层次通常采用直接映射方式"],"a":"D","x":"A.为概念性知识 \nB.cache 缺失是大概率事件，所以要利用速度比较快的方式，硬件速度快。缺页的发生相对较\n少，所以采用软件实现。 \nC. Cache-主存层次可采用回写法写策略，也可采用全写法。主存-外存交换页面的开销比较大，\n所以采用回写法。 \nD. 对于后半句，外存中的页面可以放到主存的任意位置，所以可以看成某种意义上的全相联\n映射，而不是直接映射。"},{"y":2024,"q":17,"t":0,"s":"CO","ch":"存储器层次结构","sec":"虚拟存储器","kp":"CO.3.7","kn":"页式虚拟存储器/页表/TLB/地址转换","p":2,"st":"某计算机按字节编址，采用页式虚拟存储管理方式，虚拟地址为32 位，主存地址为30 位， 页大小为1KB。若TLB 共有32 个表项，采用4 路组相联映射方式，则TLB 表项中标记字段 的位数至少是（ ）。 A. 17 B. 18 C. 19 D. 20","o":["17","18","19","20"],"a":"C","x":"表项用4 路组相联，说明有32/4=8 组组号，占3 个二进制位。页大小是1KB=210 \nB，说明页内偏移占 10 个二进制位，所以标记字段位为：32-10-3=19 位。"},{"y":2024,"q":18,"t":0,"s":"CO","ch":"存储器层次结构","sec":"虚拟存储器","kp":"CO.3.7","kn":"页式虚拟存储器/页表/TLB/地址转换","p":2,"st":"下列事件中，不是在MMU 地址转换过程中检测的是（ ）。 A. 访问越权 B. Cache 缺失 C. 页面缺失 D. TLB 缺失","o":["访问越权","Cache 缺失","页面缺失","TLB 缺失"],"a":"B","x":"MMU 负责虚拟地址到物理地址的转换，而 cache 缺失属于访问物理内存后的工作，\n不属于MMU。"},{"y":2024,"q":19,"t":0,"s":"CO","ch":"中央处理器","sec":"指令流水线","kp":"CO.5.5","kn":"指令流水线性能与结构/数据/控制冒险","p":2,"st":"对于采用“取指、译码/取数、执行、访存、写回” 5 段流水线的 RISC 数据通路， 下列 关于指令流水线数据冒险处理的叙述中，错误的是（ ）。 A. 相邻两条指令中的操作数相关可能引起数据冒险 B. 在数据相关的指令间插入 “气泡”能避免数据冒险 C. 所有数据冒险都可以通过加入转发（旁路）电路解","o":["相邻两条指令中的操作数相关可能引起数据冒险","在数据相关的指令间插入 “气泡”能避免数据冒险","所有数据冒险都可以通过加入转发（旁路）电路解决","所有数据冒险都能通过调整指令顺序和插入 nop 指令解决"],"a":"C","x":"C.假设R[x]表示通用寄存器x 的内容，M[x]表示地址为x 的存储单元内容， I0 : R[r1]\n← M[R[rs1]+imm]，I1: R[r1]+R[r2]—\u003eR[Rr1]，那么第一条先从内存中取一个数到寄存器r1 第\n\n二条指令要用到这个r1，那么就算用转发也要使用阻塞等到访存结束才能拿到这个数。 \nD. 如果插入空指令，那么在数据冒险的时候，流水线会退化成单周期，这样就能消除数据冒\n险。"},{"y":2024,"q":20,"t":0,"s":"CO","ch":"总线与输入输出","sec":"总线","kp":"CO.6.1","kn":"总线概念、组成与性能指标/事务与定时","p":2,"st":"某存储器总线的时钟频率为 420MHz，总线宽度为 64 位，每个时钟周期传送 2 次数据； 其总线事务支持突发传送方式, 最多传送8 次数据，第1 个时钟周期传送地址和读/写命令，从 第4 个至第7 个时钟周期连续传送8 次数据。该总线的总线带宽（最大数据传输率)为 （ ）。 A 3.84 GB/"},{"y":2024,"q":21,"t":0,"s":"CO","ch":"中央处理器","sec":"异常和中断机制","kp":"CO.5.4","kn":"异常与中断的分类、检测与响应","p":2,"st":"下列关于中断I/O 方式的叙述中，错误的是（ ）。 A. 中断屏蔽字用于确定中断响应的优先级 B. 保存断点和程序状态字在中断响应阶段完成 C. 保存通用寄存器和设置新中断屏蔽字由软件实现 D. 单重中断方式下中断处理时CPU 处于关中断状态","o":["中断屏蔽字用于确定中断响应的优先级","保存断点和程序状态字在中断响应阶段完成","保存通用寄存器和设置新中断屏蔽字由软件实现","单重中断方式下中断处理时CPU 处于关中断状态"],"a":"A","x":"A.中断响应优先级是由中断控制照本身电路决定的，是有固定的顺序，而中断屏蔽字\n是软件设置的，用来决定是否响应当前传过来的中断。 \nC.在中断处理时，用指令（软件）保存通用寄存器和设置的中断屏蔽字，由硬件保存断点和程\n序状态字（PSW）。 \nD.单级中断必须保证正在处理的中断不能被别的中断插入嵌套执行，因此在中断处理过程中应\n该始终让 CPU 处于关中断状态。"},{"y":2024,"q":22,"t":0,"s":"CO","ch":"总线与输入输出","sec":"I/O方式","kp":"CO.6.4","kn":"DMA 方式（控制器/传送过程/与中断比较）","p":2,"st":"DMA 控制 I/O 方式下，设备的输入/输出由DMA 控制器控制完成，此时，DMA 控制器控 制的数据传输通路位于（ ）。 A. CPU 和主存之间 B. CPU 和 DMA 控制器之间 C. 设备接口和主存之间 D. 设备接口和DMA 控制器之间","o":["CPU 和主存之间","CPU 和 DMA 控制器之间","设备接口和主存之间","设备接口和DMA 控制器之间"],"a":"C","x":"DMA 的作用是实现外设数据和主存数据的直接交换，数据传输过程不需要CPU 的\n参与。所以选C。需要注意的是，DMA 传输前的预处理和传输后的后处理阶段还是需要CPU \n參与的，前者通常由设备驱动程序来完成，后者通常由中断处理程序来完成，预处理阶段的数\n据交换主要发生在CPU 和DMA 控制器之间，在数据传输过程中，DMA 控制器代替CPU 和\n设备接口及内存进行数据传输，每次传输单位依然为一个字，但是这些数据交换与题干要求无\n关。"},{"y":2024,"q":23,"t":0,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.2","kn":"内核态/用户态与特权指令、系统调用","p":2,"st":"下列关于中断、异常和系统调用的叙述中，错误的是（ ）。 A. 中断或异常发生时，CPU 处于内核态 B. 每个系统调用都有对应的内核服务例程 C. 中断处理程序开始执行时，CPU 处于内核态 D. 系统添加新类型设备时，需注册相应的中断服务例程","o":["中断或异常发生时，CPU 处于内核态","每个系统调用都有对应的内核服务例程","中断处理程序开始执行时，CPU 处于内核态","系统添加新类型设备时，需注册相应的中断服务例程"],"a":"A","x":"中断或异常发生时，CPU 既可能处于内核态，也可能处于用户态。例如，当某个用户\n程序试图将一个数除以 0 时，CPU 会检测到这一非法操作并触发异常，此时 CPU 仍处于用\n户态。"},{"y":2024,"q":24,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"下列选项中，操作系统在终止进程时不一定执行的是（ ）。 A. 终止子进程 B. 回收进程占用的设备 C. 释放进程控制块 D. 回收为进程分配的内存","o":["终止子进程","回收进程占用的设备","释放进程控制块","回收为进程分配的内存"],"a":"A","x":"在操作系统终止父进程时，通常不会强制终止其子进程。此时，子进程会变成“孤儿\n进程”，并由 init 进程（在 Linux 系统中为 PID=1 的进程）接管。操作系统在终止进程时，\n会回收该进程所占用的所有资源，包括设备和内存，并释放进程控制块。"},{"y":2024,"q":25,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.2","kn":"页式/段式/段页式管理","p":2,"st":"在支持页式存储管理的系统中，进程切换时操作系统需要执行的操作是（ ）。 I. 更新程序计数器的值 II.更新栈基址寄存器的值 Ⅲ.更新页表基地址寄存器的值 A. 仅Ⅲ B. 仅I、Ⅱ C. 仅I、Ⅲ D. I、Ⅱ、Ⅲ","o":["仅Ⅲ","仅I、Ⅱ","仅I、Ⅲ","I、Ⅱ、Ⅲ"],"a":"D","x":"程序计数器（PC）保存着进程下一条即将执行的指令的地址。在进程切换时，需要将\n当前进程的程序计数器值恢复，以便该进程能够从之前暂停的地方继续执行。栈基址寄存器（SP）\n保存着进程栈的基地址，栈用于存储函数调用信息、局部变量、返回地址等数据，每个进程都\n有自己的栈。在进程切换时，需要将当前进程的栈指针恢复，以便该进程可以正确访问自己的\n栈。页表基地址寄存器（PTBR）保存着进程页表的基地址。在页式存储管理中，页表存储了\n虚拟地址到物理地址的映射，每个进程都有自己的页表。进程切换时需要将当前进程的页表指\n针恢复，以便该进程可以访问自己的内存区域。"},{"y":2024,"q":26,"t":0,"s":"OS","ch":"文件管理","sec":"文件系统","kp":"OS.4.5","kn":"文件系统布局/外存空闲空间管理（位示图/成组链接）","p":2,"st":"文件系统需占用部分外存空间记录空闲块位置。下列方法中，占用外存空间的大小与当前空 闲块数量无关的是（ ）。 A. 位图法 B. 空闲表法 C. 成组链接法 D. 空闲链表法","o":["位图法","空闲表法","成组链接法","空闲链表法"],"a":"A","x":"位图法使用位图来表示资源的使用状态，每个位表示一个磁盘块的占用情况。其中，\n0 表示对应的磁盘块是空闲的，尚未被分配；1 表示对应的磁盘块已被分配。因此，位图法占\n用的外存空间大小仅与外存空间的总大小有关，而与空闲块的数量无关。相对而言，B、C、D \n选项的思想是只记录空闲块的信息，而不记录已分配块的信息，因此它们占用的外存空间大小\n与当前空闲块的数量有关。"},{"y":2024,"q":27,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.1","kn":"连续分配管理方式与内存管理基本概念","p":2,"st":"下列算法中，每次回收分区时仅合并大小相等的空闲分区的是（ ）。 A. 伙伴算法 B. 最佳适应算法 C. 最坏适应算法 D. 首次适应算法","o":["伙伴算法","最佳适应算法","最坏适应算法","首次适应算法"],"a":"A","x":"伙伴算法的核心思想是将内存划分为大小为2 的幂次方的块，最小块的大小是系统定\n义的最小内存单元。每次分配内存时，如果请求的内存大小不符合当前内存块的大小标准，内\n存块会继续拆分成两半，直到找到合适大小的块。每当内存回收时，系统会尝试将相邻的“伙\n伴”块合并，所以仅合并大小相等的空闲分区。而B、C、D 选项则会合并相邻的空闲分区，\n而不考虑它们的大小。"},{"y":2024,"q":28,"t":0,"s":"OS","ch":"文件管理","sec":"文件","kp":"OS.4.1","kn":"文件概念/元数据/inode/文件操作","p":2,"st":"若进程P 中的线程T 先打开文件，得到文件描述符fd，再创建两个线程 Ta 和 Tb，则下列 资源中，Ta 与Tb 可共享的是（ ）。 I.进程 P 的地址空间 Ⅱ.线程T 的栈 Ⅲ.文件描述符fd A. 仅I B. 仅I、Ⅲ C. 仅Ⅱ、Ⅲ D. I、Ⅱ、Ⅲ","o":["仅I","仅I、Ⅲ","仅Ⅱ、Ⅲ","I、Ⅱ、Ⅲ"],"a":"B","x":"栈是线程私有的内存区域，用于存储线程在执行过程中的局部变量、函数调用的返回\n地址、函数参数和一些中间结果。每个线程都有自己的栈空间，因此线程 Ta 和 Tb 无法访问\n线程 T 的栈。进程 P 的地址空间、文件描述符、全局变量和堆空间等资源是进程 P 中所有\n线程共享的。"},{"y":2024,"q":29,"t":0,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.2","kn":"内核态/用户态与特权指令、系统调用","p":2,"st":"下列系统调用的实现中，包含文件按名查找功能的是（ ）。 A. open( ) B. read( ) C. write( ) D. close( )","o":["open( )","read( )","write( )","close( )"],"a":"A","x":"在调用 open() 函数时，操作系统根据传入的文件名在文件系统中查找具体的文件并\n将其打开，然后返回一个文件描述符，这就是文件按名查找功能。在调用 read()、write() 和 \nclose() 函数时，只允许传入文件描述符，而不允许传入文件名。"},{"y":2024,"q":30,"t":0,"s":"OS","ch":"进程管理","sec":"CPU调度与上下文切换","kp":"OS.2.3","kn":"CPU 调度算法（FCFS/SJF/HRRN/RR/优先级/多级反馈）","p":2,"st":"假设某系统使用时间片轮转调度算法进行CPU 调度，时间片大小为5ms，系统共有10 个进 程，初始时均处于就绪队列，执行结束前仅处于执行态或就绪态。若队尾的进程P 所需CPU 时间最短，时间为25ms，在不考虑系统开销的情况下，则进程P 的周转时间为（ ）。 A. 200ms B. 205ms C.","o":["200ms","205ms","250ms","295ms"],"a":"C","x":"在时间片轮转调度算法中，系统将所有就绪进程放入一个队列中，每个进程按顺序轮\n\n流获得 CPU 执行的机会。每个进程在获得 CPU 时，最多可以执行一个固定长度的时间片。\n如果在时间片结束前进程没有完成，它将被放回队列的末尾，等待下一轮执行。在这个系统中，\n时间片的大小为 5ms，队尾进程 P 需要 25ms 的 CPU 时间，所以进程 P 需要 5 轮调度才\n能执行完成。由于系统中共有 10 个进程，一轮调度的时间为 5ms × 10 = 50ms，5 轮调度\n共需要 5 × 50ms = 250ms，此时进程 P 刚好执行完毕。进程的周转时间是指进程完成时间\n减去进程到达时间。对于进程 P，到达时间为 0ms，完成时间为 250m"},{"y":2024,"q":31,"t":0,"s":"OS","ch":"进程管理","sec":"同步与互斥","kp":"OS.2.7","kn":"经典同步问题（生产者-消费者/读者写者/哲学家/理发师）","p":2,"st":"键盘中断服务例程执行结束时，所输入数据的存放位置是（ ）。 A. 用户缓冲区 B. CPU 中的通用寄存器 C. 内核缓冲区 D. 键盘控制器的数据寄存器","o":["用户缓冲区","CPU 中的通用寄存器","内核缓冲区","键盘控制器的数据寄存器"],"a":"C","x":"当 CPU 接收到来自键盘的中断信号后，操作系统会暂停当前正在运行的任务，并跳\n转到专门的中断服务例程来处理该中断。中断服务例程通过键盘控制器读取按键扫描码，以确\n定用户按下的是哪个按键，并将其转换为相应的字符，然后存入内核中的键盘缓冲区。之后，\n操作系统或应用程序可以从内核缓冲区中读取用户输入的数据进行处理。"},{"y":2024,"q":32,"t":0,"s":"OS","ch":"输入输出管理","sec":"外存管理","kp":"OS.5.3","kn":"磁盘结构与磁盘调度算法（FCFS/SSTF/SCAN/CSCAN）","p":2,"st":"某磁盘的磁道数为400(磁道号为0~399)，采用循环扫描算法（CSCAN）进行磁盘调度，完 成对200 号磁道的请求后，磁头向磁道号减小的方向移动。若还有7 个磁盘请求，对应的磁道 号分别为300，120，110，0，160，210，399，则完成上述磁盘访问请求后磁头移动的距离是 （ ）。 A.","o":["599","619","788","799"],"a":"C","x":"在循环扫描算法中，磁头在磁盘上仅向一个方向扫描并服务沿途遇到的所有磁盘请求。\n当磁头到达磁盘上待访问请求的最低磁道后，它会快速回到磁盘上待访问请求的最高磁道，在\n此期间不处理任何请求，然后再次开始向同一方向扫描并服务新的请求。本题中，磁盘完成对 \n200 号磁道的请求后，磁头向磁道号减小的方向移动到 0 号磁道，处理了请求 160、120、110 \n和 0，期间移动了 200 个磁道。随后，磁头从 0 号磁道快速移动到 399 号磁道，不处理任\n何请求，期间移动了 399 个磁道。最后，磁头从 399 号磁道移动到 210 号磁道，处理了请\n求 399、300 和 210，期间移动了 189 个磁道。整个过程共移动了 200 + 3"},{"y":2024,"q":33,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络基本概念","kp":"NET.1.1","kn":"网络定义/组成/分类与性能指标","p":2,"st":"若某分组交换网络及每段链路的带宽如下图所示，则H1 到H2 的最大吞吐量约为（ ）。 A. 1 Mb/s B. 10 Mb/s C. 100 Mb/s D. 1000 Mb/s","o":["1 Mb/s","10 Mb/s","100 Mb/s","1000 Mb/s"],"a":"B","x":"带宽指的是网络或通信链路在单位时间内能够承载或传输的最大数据量，吞吐量指的\n是实际在某一段时间内成功传输的数据量。如果链路的传输速率限制了数据的发送或接收速度，\n那么即使其他链路可以更快地传输数据，也无法提升整体的吞吐量。 \n在本题中，H1 和H2 之间的数据传输有三种可能的路径：1、经过两条带宽为1000Mb/s 的路\n径；2、经过一条带宽为1Mb/s 的路径；3、经过两条100Mb/s 的路径。无论选择哪种路径，数\n据传输都必须经过带宽为10Mb/s 的链路（H1 到路由）和10Mb/s 的链路（路由到H2）。在理\n想环境下（即未提及拥塞或数据包丢失的情况），整体吞吐量由瓶颈链路的带宽决定。因此，\n这三种不同路径的整体数据吞吐量","im":"qimg/2024_33.png"},{"y":2024,"q":34,"t":0,"s":"NET","ch":"物理层","sec":"通信基础","kp":"NET.2.1","kn":"信道/码元/波特/速率等基本概念与编码调制","p":2,"st":"在下列二进制数字调制方法中，需要2 个不同频率载波的是（ ）。 A. ASK B. PSK C. FSK D. DPSK","o":["ASK","PSK","FSK","DPSK"],"a":"C","x":"在这些选项中，FSK (Frequency Shift Keying) 是唯一需要使用两个不同频率载波的调\n制方法。FSK 是一种二进制调制技术，通过改变载波信号的频率来传输信息，其中两种不同的\n频率分别表示二进制的两个状态（0 和1）。其他选项中，ASK (Amplitude Shift Keying) 通过\n改变载波的幅度来表示不同的二进制状态。PSK (Phase Shift Keying) 则通过改变载波的相位来\n传递信息。DPSK (Differential Phase Shift Keying) 是PSK 的变体，通过改变载波的相位差来传\n输信息。选项C 是正确答案。"},{"y":2024,"q":35,"t":0,"s":"NET","ch":"数据链路层","sec":"局域网与广域网","kp":"NET.3.5","kn":"以太网/IEEE 802.3/802.11/VLAN/PPP","p":2,"st":"如题35 图所示的支持VLAN 划分的交换机，已按端口划分了3 个VLAN，部分端口连接主 机的IP 地址和MAC 地址如图中所示，ARP 表结构为\u003cIP 地址，MAC 地址，TTL\u003e。下列选项 中，不会出现在 H4 的ARP 表中的是（ ）。 A. 192.168.3.81，00-18-A2-3B","o":["192.168.3.81，00-18-A2-3B-36-21， 14: 32:00","192.168.3.91，00-3E-C2-39-12-B5， 14: 37:00","192.168.3.125，00-E5-78-4A-09-B2，14:45:00","192.168.3.129，00-08-6E-05-A7-82，14:52:00"],"a":"D","x":"H4 与其他主机通过支持VLAN 划分的交换机连接，该交换机按端口划分了不同的\nVLAN，因此不同VLAN 之间的主机无法直接通信。ARP 表中仅存储与H4 处于同一VLAN 内\n的主机的IP 地址与MAC 地址映射关系。因此，H4 只能通过ARP 获得与其处于同一VLAN\n的主机信息，跨VLAN 的主机不会出现在H4 的ARP 表中。H4 位于VLAN1，选项D 中的主\n机H6 位于VLAN3，无法与H4 直接通信，因此不会出现在H4 的ARP 表中。而选项A、B、\nC 中的主机H2、H1 和H3 都与H4 同处VLAN1，可能出现在H4 的ARP 表中。选项D 是正\n确答案。"},{"y":2024,"q":36,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络基本概念","kp":"NET.1.1","kn":"网络定义/组成/分类与性能指标","p":2,"st":"在采用 CSMA/CA 的802.11 无线局域网中，DIFS=128μs，SIFS=28μs，RTS、CTS 和ACK 帧的传输时延分别是3μs、2μs 和2μs，忽略信号传播时延。若主机A 欲向AP 发送一个总长度 为1998 B 的数据帧，无线链路带宽为54Mb/s，则隐藏站B 收到 AP 发","o":["326μs","354μs","385μs","513μs"],"a":"B","x":"在CSMA/CA 协议中，当主机A 打算发送数据时，它会通过发送RTS 帧来通知接收\n设备AP。接收设备在发送CTS 帧时，会在帧中包含一个NAV 字段，指示接下来通信的时间\n长度。收到CTS 帧的其他设备（如隐藏站B）读取NAV 值，知道在这段时间内信道会被占用，\n从而不再尝试占用信道。NAV 设置了一个倒计时器，当倒计时结束时，设备才会再次检测信道\n是否空闲，以决定是否可以发起新的通信。 \n所以本道题中我们需要计算的NAV 值，也就是主机B 收到CTS 帧后，AP 与主机A 之间通信\n的持续时间的值，也就是主机A 收到AP 发送CTS 帧后（由于题目中忽略信号传播时延，故\nCTS 帧从AP 到B 的时间与到A 的时间相同）开始发"},{"y":2024,"q":37,"t":0,"s":"NET","ch":"数据链路层","sec":"流量控制与可靠传输机制","kp":"NET.3.2","kn":"停止等待/GBN/SR 与滑动窗口","p":2,"st":"主机甲通过选择重传(SR)滑动窗口协议向主机乙发送帧的部分过程如题37 图所示，Fx 为数 据帧，ACKx 为确认帧，x 是位数为3 比特的序号。乙只对正确接收的数据帧进行独立确认， 发送窗口与接收窗口大小相同且均为最大值。甲在t1 时刻和t2 时刻发送的数据帧分别是（ ）。 A. F1，F3 B.","o":["F1，F3","F1，F4","F3，F1","F4，F1"],"a":"D","x":"本题使用的是选择重传（SR）滑动窗口协议，且序号的位数为3 比特，发送窗口和接\n收窗口大小相同且均为最大值，故发送窗口与接收窗口的大小均为4。 \n根据图示，甲首先发送了F0 至F3 四个连续的数据帧，其中F1 在传输过程中丢失。此时，甲\n的滑动窗口内的数据帧已全部发送。t1 时刻，甲收到乙对F0 的确认帧，滑动窗口向后移动，\n发送数据帧F4；t2 时刻，甲收到乙对F2 的确认帧，但由于未收到F1 的确认帧，滑动窗口未\n继续滑动，此时F1 超时，甲重新发送F1。综上，t1 和t2 时刻甲分别发送了F4 和F1，选项D\n是正确答案。","im":"qimg/2024_37.png"},{"y":2024,"q":38,"t":0,"s":"NET","ch":"传输层","sec":"TCP协议","kp":"NET.5.3","kn":"TCP 段格式/连接管理（三次握手四次挥手）","p":2,"st":"假设主机H 通过TCP 向服务器发送长度为3000B 的报文，往返时间RTT=10ms，最长报 文段寿命MSL=30s，最大报文段长度MSS=1 000 B，忽略TCP 段的传输时延，报文传输结束 后H 首先请求断开连接，则从H 请求建立TCP 连接时刻起，到H 进入 CLOSED 状态为止， 所需","o":["30.03 s","30.04 s","60.03 s","60.04 s"],"a":"D","x":"从H 请求建立TCP 连接时刻起，到H 进入CLOSED 状态为止，共要经历三个阶段，\n分别是TCP 连接建立阶段，数据传输阶段和TCP 连接结束阶段。具体过程如下： \n首先，H 向服务器发送第一次握手信息，服务器回复第二次握手信息。由于TCP 协议采用慢\n开始的拥塞控制策略，H 在发送第三次握手信息时，可以携带1000B 的数据，这标志着第一次\n数据传输的开始，此时拥塞窗口为1，H 需要等待服务器的ACK。接下来，H 在第二次数据传\n输时，拥塞窗口为2，可以一次性发送2000B 的数据，数据传输阶段在服务器返回ACK 后结\n束。随后，H 请求断开连接，向服务器发送第一次挥手数据包。由于服务器没有数据需要回传，\n它会依次发送第二次和"},{"y":2024,"q":39,"t":0,"s":"NET","ch":"传输层","sec":"UDP协议","kp":"NET.5.2","kn":"UDP 数据报与校验","p":2,"st":"若UDP 协议在计算校验和过程中，计算得到中间结果为1011 1001 1011 0110 时，还需要 加上最后一个16 位数0110 0101 1100 0101，则最终计算得到的校验和是（ ）。 A. 0001 1111 0111 1011 B. 0001 1111 0111 1100 C. 1","o":["0001 1111 0111 1011","0001 1111 0111 1100","1110 0000 1000 0011","1110 0000 1000 0100"],"a":"C","x":"UDP 校验和的计算主要分为三个步骤：字块求和、进位回卷和按位取反。首先，将数\n据按16 位字块划分，对这些字块执行二进制加法操作。这里的二进制加法包括进位处理，而\n不是异或运算。通过这种加法操作，得到结果X。接下来，检查X 的位数是否超过16 位。如\n果X 的位数超出了16 位，则将高位溢出的部分加回到低位。最后，对结果X 进行按位取反，\n得到的值即为校验和。 \n在题目中，已完成多个字块的求和，现需进行最后一次求和。我们将 1011 1001 1011 0110 和 \n0110 0101 1100 0101 相加，得到 1 0001 1111 0111 1011。由于结果超过了16 位，需进行进位\n回卷，将溢出的高位加回到低位，得"},{"y":2024,"q":40,"t":0,"s":"NET","ch":"传输层","sec":"TCP协议","kp":"NET.5.3","kn":"TCP 段格式/连接管理（三次握手四次挥手）","p":2,"st":"若浏览器不支持并行 TCP 连接，使用非持久的HTTP/1.0 协议请求浏览1 个Web 页，该 页中引用同一网站上7 个小图像文件，则从浏览器为传输 Web 页请求建立TCP 连接开始， 到接收完所有内容为止，所需要的往返时间RTT 数至少是（ ）。 A. 4 B. 9 C. 14 D. 16 二","o":["4","9","14","16 二、综合应用题：41～47 小题，共70 分"],"a":"D","x":"在使用非持久的HTTP/1.0 协议请求一个Web 页面时，每个资源（包括主页面和引用\n的图像）都需要单独的TCP 连接。每个TCP 连接的建立和数据传输都需要往返时间RTT。具\n体来说，每个TCP 连接的过程包括：建立连接需要1 个RTT，发送请求并接收响应也需要1\n个RTT。因此，对于一个包含1 个主页面和7 个图像的网页，总共有8 个请求。每个请求都涉\n及到建立一个新的TCP 连接和进行数据传输，因此总共需要8 个TCP 连接 * 2 RTT（每个连\n接的建立和数据传输），总共为16 RTT。选项D 是正确答案。 \n二、简答题"},{"y":2024,"q":41,"t":1,"s":"DS","ch":"图","sec":"图的基本应用","kp":"DS.6.6","kn":"拓扑排序与AOV网","p":13,"st":"（13 分）2023 年10 月26 日，神州十七号载人飞船发射取得圆满成功，再次彰显了中国航 天事业的辉煌成就。载人航天工程是包含众多子工程的复杂系统工程，为了保证工程的有序开 展，需要明确各子工程的前导子工程，以协调各子工程的实施。该问题可以简化、抽象为有向 图的拓扑序列问题。已知有向图G 采用","x":"41.\n\n（1）算法的基本设计思想\n建立图 G 各顶点的入度表 degree[ ]。\n选择入度为0 的顶点v，将v 的所有邻接点的入度减1，重复执行这个过程。若每次选中\n的入度为0 的顶点有且仅有一个，且共进行了 G.numVertices 次，则意味着存在唯一的拓扑序\n列，返回1，否则不存在拓扑序列，或存在多个拓扑序列，返回0。\n（2）用C 语言描述的算法\n int uniquely(MGraph G) //判定有向图是否存在唯一的拓扑序列\n{\n\nint*degree, i, j,count=0, in0= -1, prev_ in0;\ndegree =(int*)malloc(G. numVertices*sizeof(int));\nfor( j=0 ; j\u003cG.numVertices; j++) //计算各顶点的入度\n        {\n      degree[j]=0 ;\n              for(i=0; i\u003cG.numVertices; i++)\n                    degree[j]+=G. Edge[i][j];\n      if(degree[j]= =0)\n      {\nif(in0= = -1)in0=j; //入度为0 的顶点\nelse in0 = -2; //有多个入度为0 的顶点\n\n       }\n        }\nwhile(in0\u003e=0)\n{\n      Count++;\n      prev_in0=in0;\n      in0 = -1;\n      for ( j=0 ; j\u003cG.numVertices; j++)\n            if (G. Edge[prev _ in0] [j]\u003e0)\n            {\n                      if(--degree[j]= =0) //邻接点入度值减1\n                         {\n                                if(in0= = -1)in0=j; //入度为0 的顶点\n                                else in0= -2; //有多个入度为0 的顶点\n                         }\n            }\n        }\nfree(degree) ;\n\nif(count= =G. numVertices) return 1;\nelse return 0;\n}","fs":"（13 分）2023 年10 月26 日，神州十七号载人飞船发射取得圆满成功，再次彰显了中国航\n天事业的辉煌成就。载人航天工程是包含众多子工程的复杂系统工程，为了保证工程的有序开\n展，需要明确各子工程的前导子工程，以协调各子工程的实施。该问题可以简化、抽象为有向\n图的拓扑序列问题。已知有向图G 采用邻接矩阵存储，类型定义如下。\n\ntypedef struct //图的类型定义\n{\nint numVertices，numEdges; //图的顶点数和有向边数\nchar VerticesList[MAXV]; //顶点表，MAXV 为已定义常量\nint Edge[MAXV][MAXV]; //邻接矩阵\n}MGraph;\n\n请设计算法: int uniquely(MGraph G)，判定G 是否存在唯一的拓扑序列，若是，则返回1，否\n则返回0。要求如下。\n（1）给出算法的基本设计思想。（4 分）\n（2）根据设计思想，采用C 或 C++语言描述算法，关键之处给出注释。（9 分）"},{"y":2024,"q":42,"t":1,"s":"DS","ch":"查找","sec":"散列（Hash）表","kp":"DS.7.6","kn" 号整数，则应根据哪个标志判断是否溢出？（5 分）\n（3）执行 slli 指令时，控制信号 Ext 的取值可以是0 也可以是 1，为什么？（2 分）\n（4）执行 1w 指令时，控制信号 Ext、ALUctr 的取值分别是什么？（2 分）\n0000000\nrs2\nrs1\n000\nrd\n0110011\n0000000\nshamt\nrs1\n010\nrd\n0010011\nimm\nrs1\n010\nrd\n0000011\n\n（5）若一条指令的机器码是 A040 A103H，则该指令一定是 1w 指令，为什么？若执行该指\n令时，R[01H]=FFFF A2D0H，则所读取数据的存储地址是什么？（2 分）","im":"qimg/2024_43.png"},{"y":2024,"q":44,"t":1,"s":"CO","ch":"中央处理器","sec":"数据通路","kp":"CO.5.2","kn":"数据通路的功能和基本结构","p":10,"st":"（10 分）对于题43 中的计算机M，C 语言程序P 包含的语句“sum+ = a[i];” 在 M 中对应的指令序列 S 如下。 slli r4，r2，2 //R[r4]←R[r2]\u003c\u003c2 add r4,r3,r4 //R[r4]←R[r3]+R[r4] 1w r5,0(r4) //R[r5]←M","x":"44.\n\n（1）a 的首地址存放在 r3；i 存放在 r2；sum 存放在 r1。\n（2）a[i]的地址为0013 E004H； a[i]的机器数为FFFF ECDCH；\nsum 的机器数为0000 000EH； a[i]所在页的页号是0013EH；\n数组a 至少存放在2 页中。\n（3）指令机器码为 0021 2213H。汇编形式是 slli r4，r2，1。","fs":"（10 分）对于题43 中的计算机M，C 语言程序P 包含的语句“sum+ = a[i];”\n在 M 中对应的指令序列 S 如下。\nslli r4，r2，2 //R[r4]←R[r2]\u003c\u003c2\nadd r4,r3,r4 //R[r4]←R[r3]+R[r4]\n1w r5,0(r4) //R[r5]←M[R[r4]+0]\nadd rl,rl, r5 //R[r1]←R[r1]+R[r5]\n已知变量 i、sum 和数组a 都为 int 型，通用寄存器 r1~r5 的编号为 01H~05H。\n请回答下列问题。\n（1）根据指令序列S 中每条指令的功能，写出存放数组a 的首地址、变量i 和sum 的通用寄\n存器编号。（3 分）\n（2）已知 M 为小端方式计算机，采用页式存储管理方式，页大小为4KB。若执行到指令序列\nS 中第1 条指令时，i=5 且r1 和 r3 的内容分别为0000 1332H 和0013 DFF0H，从地址0013\nDFF0H 开始的存储单元内容如题 44 图所示，则执行“sum+ =a[i];”语句后，a[i]的地址、a[i]\n和sum 的机器数分别是什么（用十六进制表示）？a[i]所在页的页号是多少？此次执行中，数\n组a 至少存放在子页中？（5 分）\n地址\n\n0\n1\n2\n3\n4\n5\n6\n7\n0013 DFF0\n0013 DFF8\n0013 E000\n0013 E008\n题 44 图\n（3）指令“slli r4，r2，2”的机器码是什么（用十六进制表示）？若数组a 改为 short 类型，则\n指令序列S 中 slli 指令的汇编形式应是什么？（2 分）\n\nFF FF FF 7C 70 FE FF FF\n00 00 00 0C 3C 02 01 FF\nF0 F1 00 00 DC EC FF FF\nFF FF 01 02 00 00 01 02"},{"y":2024,"q":45,"t":1,"s":"CO","ch":"存储器层次结构","sec":"虚拟存储器","kp":"CO.3.7","kn":"页式虚拟存储器/页表/TLB/地址转换","p":8,"st":"（7 分）某计算机按字节编址，采用页式虚拟存储管理方式，虚拟地址和物理地址的长度均 为 32 位，页表项的大小为4 字节。页大小为4 MB，虚拟地址结构如下。 页号（10 位） 页内偏移量（22 位） 进程P 的页表起始虚拟地址为 B8C0 0000H，被装载到从物理地址 6540 0000H 开始","x":"45.\n\n（1）页表项的虚拟地址为： B8C0 0000H+ 48H \u003c\u003c 2 = B8C0 0120H。\n页表项的物理地址为：6540 0000H+48H \u003c\u003c 2 = 6540 0120H\n相应页表项中的页框号为：BAB4 5678H \u003e\u003e 22 = 2EAH。\n（2）进程P 的页表所在页的页号为：B8C0 0000H \u003e\u003e 22 = 2E3H。\n页表项的虚拟地址为： B8C0 0000H + 2E3H \u003c\u003c 2 = B8C0 0B8CH。\n页表项中的页框号为：6540 0000H\u003e\u003e22=195H。","fs":"（7 分）某计算机按字节编址，采用页式虚拟存储管理方式，虚拟地址和物理地址的长度均\n为 32 位，页表项的大小为4 字节。页大小为4 MB，虚拟地址结构如下。\n页号（10 位）\n页内偏移量（22 位）\n进程P 的页表起始虚拟地址为 B8C0 0000H，被装载到从物理地址 6540 0000H 开始的连续主\n存空间中。\n请回答下列问题，要求答案用十六进制表示。\n（1）若CPU 在执行进程P 的过程中，访问虚拟地址 1234 5678H 时发生了缺页异常，经过缺\n页异常处理和 MMU 地址转换后得到的物理地址是 BAB4 5678H，在此次缺页异常处理过程\n中，需要为所缺页分配页框并更新相应的页表项，则该页表项的虚拟地址和物理地址分别是什\n么？该页表项中的页框号更新后的值是什么？（3 分）\n（2）进程P 的页表所在页的页号是什么？该页对应的页表项的虚拟地址是什么？该页表项中\n的页框号是什么？（4 分）"},{"y":2024,"q":46,"t":1,"s":"OS","ch":"进程管理","sec":"同步与互斥","kp":"OS.2.6","kn":"信号量机制与 PV 操作","p":7,"st":"（8 分）计算机系统中的进程之间往往需要相互协作以完成一个任务。在某网络系统中，缓 冲区 B 用于存放一个数据分组，对B 的操作有 C1、C2 和 C3。C1 将一个数据分组写入B 中，C2 从 B 中读出一个数据分组，C3 对B 中的数据分组进行修改。要求 B 为空时才能执行 C1，B 非空时才能","x":"46.\n\n（1）实现C1 的代码是临界区。因为代码 C1 执行对B 的写操作，且 P1 和 P2 需要互斥执行\nC1。\n（2）进程 P1 和 P2 的同步伪代码如下。\nSemaphore S=0; //实现进程 P1 与 P2 的同步\n\nP1\n...\n\nC1;\n\nsignal(S);\n...\n\nP2\n...\n\nwait(S);\n\nC2;\n...\n\n（3）进程 P1 和 P2 的互斥伪代码如下。\nSemaphore mutex=1; //实现 P1 与P2 互斥执行 C3\n\nP1\n...\n\nP2\n...\n\nwait(mutex);\n\nC3;\n\nsignal(mutex);\n\n...\n\nwait(mutex);\n\nC3;\n\nsignal(mutex);\n\n...","fs":"（8 分）计算机系统中的进程之间往往需要相互协作以完成一个任务。在某网络系统中，缓\n冲区 B 用于存放一个数据分组，对B 的操作有 C1、C2 和 C3。C1 将一个数据分组写入B\n中，C2 从 B 中读出一个数据分组，C3 对B 中的数据分组进行修改。要求 B 为空时才能执行\nC1，B 非空时才能执行C2 和C3。\n请回答下列问题。\n（1）假设进程 P1 和 P2 均需要执行 C1，实现 C1 的代码是否为临界区？为什么？（2 分）\n（2）假设B 初始为空，进程 P1 执行 C1 一次，进程 P2 执行 C2 一次。请定义尽可能少的\n信号量，并用 wait（）、signal（）操作描述进程 P1 和 P2 之间的同步或互斥关系，说明所\n用信号量的作用及其初值。（3 分）\n（3）假设 B 初始不为空，进程 P1 和 P2 各执行 C3 一次。请定义尽可能少的信号量，并用\nwait（）、signal（）操作描述进程P1 和 P2 之间的同步或互斥关系，说明所用信号量的作用\n及其初值。（3 分）"},{"y":2024,"q":47,"t":1,"s":"NET","ch":"网络层","sec":"路由算法","kp":"NET.4.2","kn":"静态/动态路由与距离向量/链路状态算法","p":9,"st":"（9 分）网络空间是继陆海空天之后的“第五疆域”，网络技术是网络疆域建设与治理的基 础。路由算法与协议是网络核心技术之一，对其准确认知、合理选择与应用，对于网络建设十 分重要。假设现有互联网中的4 个自治系统 量，用wait（）和signa","x":"45.【8 分】三个人一起植树，甲挖坑，乙放树苗入坑并填土，丙负责为新种树苗浇水。步骤\n依次为：挖树坑，放树苗，填土和浇水。现在有铁锹和水桶各一个，铁锹用于挖树坑，填\n土。水桶用于浇水。当树坑数量小于 3 时，甲才可以挖树坑。设初始坑=0，铁锹水桶均\n可用，定义尽可能少的信号量，用 wait（）和signal（）。操作描述植树过程中三人的同步互\n斥关系，并说明所用信号量的作用及其初值。\n\n约束类型 具体要求\n实现方式\n流程顺序 挖坑→放树苗→填土→浇水\n同步信号量\n坑数限制 坑数量 \u003c 3\n计数信号量\n资源互斥 铁锹(甲乙共用)，水桶(丙独用) 互斥信号量\n参与者分工\n甲: 挖坑(需要铁锹)\n乙: 放树苗 + 填土(填土需要铁锹)\n丙: 浇水(需要水桶)\n信号量设计\n信号量 类型 初值 作用\n使用者\nempty\n计数 3\n控制坑数上限(\u003c3)\n甲申请，乙释放\nholes\n计数 0\n已挖好的坑数量\nready\n计数 0\n已种好待浇水的树\n甲生产，乙消费\n乙生产，丙消费\nshovel\n互斥 1\n铁锹互斥访问\n甲乙共用\n说明：水桶仅丙使用且单线程，为\"尽可能少\"省略bucket 信号量\n同步互斥代码实现\n甲(挖坑进程)\n甲() {\n    while (true) {\nwait(empty); // 确保坑数\u003c3\nwait(shovel); // 申请铁锹\n挖坑();\nsignal(shovel); // 释放铁锹\nsignal(holes); // 增加可用坑数\n    }\n}\n乙(种树填土进程)\n乙() {\n    while (true) {\nwait(holes);\n放树苗();\nwait(shovel);\n// 等待有坑可用\n  // 不需要工具\n// 申请铁锹填土\n填土();\nsignal(shovel); // 释放铁锹\nsignal(ready); // 增加待浇水树数\nsignal(empty); // 释放坑位容量\n    }\n}\n\n丙(浇水进程)\n丙() {\n    while (true) {\n// 等待有树需浇水\nwait(ready);\n浇水();\n// 使用水桶(单线程无需互斥)\n    }\n}\n信号量作用机制分析\n同步关系实现\n同步关系 实现信号量\n机制说明\nholes\n甲→乙\n乙→丙\nready\n甲生产坑，乙消费坑\n乙生产待浇水树，丙消费\n坑数控制 empty + holes 有界缓冲区模型\n互斥关系实现\n互斥资源 实现信号量 竞争进程 使用场景\n铁锹\nshovel\n甲、乙\n甲挖坑，乙填土\n水桶\n省略\n仅丙\n单线程无竞争\n本方案用4 个信号量实现完整同步互斥：\n•\nempty/holes: 有界缓冲区控制坑数上限\n•\nready: A→B→C 流程同步\n•\nshovel: 铁锹互斥访问\n保证了流程正确性、资源安全性和无死锁特性。\n评分标准\n信号量定义（2 分）\n完整性（1 分）\n正确定义了所有必要的信号量，包括控\n制资源（铁锹）互斥使用的信号量和控\n制树坑数量的信号量，可得 2 分。\n如果遗漏了控制资源互斥的信号量（如\nmutex1 或mutex2）或者遗漏了控制树\n坑数量的empty 信号量，扣 1 分。\n如果信号量定义完全错误，得 0 分。\n正确性（1 分）\n所定义的信号量初值正确，可得 1 分。\n若有信号量初值设置错误，扣 1 分。\n进程同步互斥描述（3 分）\n进程操作完整性（2 分）\n对甲、乙、丙三个进程的操作都使用wait()和signal()\n进行了正确描述，包括对资源获取和释放的操作以及\n对树坑数量控制的操作，可得 3 分。\n如果只正确描述了两个进程的操作，扣 1 分。\n如果只正确描述了一个进程的操作，扣 2 分。\n如果三个进程的操作都描述错误，得 0 分。\n操作顺序正确性（1 分）\n每个进程中的wait()和signal()操作顺序正确，符合逻\n辑，可得 1 分。\n若存在操作顺序错误（例如在没有获取资源之前就释\n放资源等逻辑错误），扣 1 分。\n解释与说明（2 分）\n信号量作用解释（1 分）\n对所定义的每个信号量的作用都进\n行了准确的解释，可得 1 分。\n若有信号量作用解释错误或者遗漏\n某个信号量的解释，扣 1 分。\n信号量初值解释（1 分）\n对信号量初值的设定依据进行了合\n理准确的解释，可得 1 分。\n若初值解释错误或者不合理，扣 1\n分。\n\nϰϲ.【9 分】某进程的虚拟地址空间如下图所示，阴影部分为未占用区域。\n内核区\n阴影处\n用户栈\n运行时堆\n可读写数据区\n只读代码区\n题46 图\n另现有 C 程序代码：\nchar*ptr；\nvoid main（）{\nint length；\nptr =（char*）malloc（size of（char））；\nscanf（\"%s\"，ptr）；\nlength = strlen（ptr）；\nprintf（\"length=%din\"，length）；\nfree（ptr）；\n}\n请回答下列问题，并说明理由。\n（1）上述程序执行时，PCB 位于哪个区域，执行 scanf（）等待键盘输入时，该进程处于什\n么状态？（3 分）\n（2）main（）函数的代码位于哪个区域？其直接调用的哪些函数的功能需要通过执行驱动\n程序实现？（3 分）\n（3）变量 ptr 被分配在哪个区域？若变量 length 没有被分配在寄存器中，则会被分配在哪\n个区域？ptr 指向的字符串位于哪个区域？（3 分）\n虚拟地址空间结构\n区域\n特性\n存储内容\n访问权限\n内核区\n高地址，内核管理 PCB、内核数据结构\n内核态访问\n阴影区\n未映射区域\n空闲虚拟地址空间\n不可访问\n用户栈\n向下增长\n局部变量、函数参数 读写\n运行时堆\n向上增长\n动态分配内存\n读写\n可读写数据区 固定大小\n全","fs":"【8 分】三个人一起植树，甲挖坑，乙放树苗入坑并填土，丙负责为新种树苗浇水。步骤\n依次为：挖树坑，放树苗，填土和浇水。现在有铁锹和水桶各一个，铁锹用于挖树坑，填土。\n水桶用于浇水。当树坑数量小于 3 时，甲才可以挖树坑。设初始坑=0，铁锹水桶均可用，\n定义尽可能少的信号量，用wait（）和signal（）。操作描述植树过程中三人的同步互斥关系，\n并说明所用信号量的作用及其初值。"},{"y":2025,"q":46,"t":1,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.3","kn":"中断异常处理/链接装入/内存映像","p":7,"st":"【9 分】某进程的虚拟地址空间如下图所示，阴影部分为未占用区域。 内核区 阴影处 用户栈 运行时堆 可读写数据区 只读代码区 题46 图 另现有 C 程序代码： char*ptr； void main（）{ int length； ptr =（char*）malloc（size of（char））；"},{"y":2025,"q":47,"t":1,"s":"NET","ch":"计算机网络概述","sec":"计算机网络基本概念","kp":"NET.1.1","kn":"网络定义/组成/分类与性能指标","p":9,"st":"【9 分】如题47 图所示，卫星天通一号的轨道高度是36000km，电磁波传播速度为 300000km/s。TR1 和TR2 用于收发卫星信号，采用全双工调制解调，其收发速率为200Kbps。 请回答下列问题，并说明理由。 （1）忽略卫星信号中继，TR1，TR2 调制解调开销，则R1 到R2 之间的","im":"qimg/2025_47.png"},{"y":2026,"q":1,"t":0,"s":"DS","ch":"线性表","sec":"线性表的实现","kp":"DS.2.1","kn":"顺序表（顺序存储）","p":2,"st":"线性表中有n 个元素，使用顺序存储结构，能保持原有顺序下，执行的操作 是( )。 I. 表头插入一个元素 II. 表头删除一个元素 III. 表尾插入一个元素 IV. 表尾删除一个元素"},{"y":2026,"q":2,"t":0,"s":"DS","ch":"线性表","sec":"线性表的实现","kp":"DS.2.2","kn":"单链表/双链表/循环链表/静态链表","p":2,"st":"设有一个双向链表 L，结构为[p2,d,p1]，头结点为 head，初始时 head=cu。现 要将每个结点的p2 指向p1 指向结点的直接后继，应该进行的操作是( )。 A. while(cu!=null){cu-\u003ep2=cu-\u003ep1-\u003ep1;cu=cu-\u003ep1;} B. while(cu!=nu","o":["while(cu!=null){cu-\u003ep2=cu-\u003ep1-\u003ep1;cu=cu-\u003ep1;}","while(cu!=null\u0026\u0026cu-\u003ep2!=null){}","while(cu!=null){if(cu-\u003ep1!=null){ cu-\u003ep2=cu-\u003ep1-\u003ep1;cu=cu-\u003ep1;}}","while(cu!=null){if(cu-\u003ep1!=null){ cu-\u003ep2=cu-\u003ep1-\u003ep1;} else cu-\u003ep2=null; cu=c u-\u003ep1;}"],"a":"D","x":"操作目标：将当前结点cu的 p2指向cu-\u003ep1所指结点的直接后继（即 \ncu-\u003ep1-\u003ep1）。关键风险：若cu-\u003ep1为null，则cu-\u003ep1-\u003ep1会引发空指针异常。 \n选项分析：A.未检查cu-\u003ep1是否为空，不安全。B.增加了对cu-\u003ep2的无关联判断， \n未解决根本问题。C.在赋值前检查cu-\u003ep1 != null，避免了空指针，但未处理 cu-\u003ep1 \n为空时 cu-\u003ep2的赋值。D.完整处理了两种情况： \n若cu-\u003ep1非空，则cu-\u003ep2 = cu-\u003ep1-\u003ep1； \n若cu-\u003ep1为空，则置cu-\u003ep2 = null。 \n逻辑严密，且循环推进cu = cu-\u003ep1正确。"},{"y":2026,"q":3,"t":0,"s":"DS","ch":"树与二叉树","sec":"二叉树的遍历","kp":"DS.5.3","kn":"二叉树遍历（先/中/后/层次）与序列还原","p":2,"st":"已知二叉树T 的中序序列为{b,e,d,f,c,a,g}，层次遍历序列为{a,b,g,c,d,e,f}，则 后序遍历序列为( )。 A. c e d f b g a B. c e f d b g a C. e f d c b g a D. e g f d b c a","o":["c e d f b g a","c e f d b g a","e f d c b g a","e g f d b c a"],"a":"C","x":"层序第一个节点为根：a。在中序中找到a，左子树中序为b,e,d,f,c，右子树中序为 \ng。根据层序顺序，得左子树层序为 b,c,d,e,f，右子树层序为g。递归构建左子树： \n根为b，中序左为空，右为e,d,f,c，层序为c,d,e,f。右子树根为c，中序左为e,d,f，右 \n为空，层序为d,e,f。左子树根为d，中序左为e，右为f，层序为e,f。依次得叶子节 \n点e、f。右子树仅g。后序遍历：左子树→右子树→根，得e,f,d,c,b,g,a。"},{"y":2026,"q":4,"t":0,"s":"DS","ch":"树与二叉树","sec":"树、森林与二叉树的转换","kp":"DS.5.5","kn":"树的存储/森林与二叉树转换/树与森林遍历","p":2,"st":"森林中有5 棵树，其结点个数分别为2、3、4、5、7，森林中树的次序可以任 意，问二叉树的最小高度为( )。 A. 5 B. 6 C. 8 D. 10","o":["5","6","8","10"],"a":"B","x":"森林转换为二叉树时，每棵树可独立设计结构使其转换高度最小。设\n为\n \n个节点的树经转换后二叉树的最小高度，计算得： \n。 \n将五棵树按转换高度降序排列：4,4,3,3,2。转换后二叉树的高度为： \n。"},{"y":2026,"q":5,"t":0,"s":"DS","ch":"树与二叉树","sec":"树与二叉树的应用","kp":"DS.5.6","kn":"哈夫曼树与哈夫曼编码","p":2,"st":"已知字符abcdefg 对应权值为1,2,4,5,8,10,12，使得带权路径长度最小，与e 同层的结点有( )。 A. d B. g C. d 和f D. f 和g","o":["d","g","d 和f","f 和g"],"a":"D","x":"【【解析】 \n根据哈夫曼树的构造算法，将节点按权值从小到大排序，每次合并权值最小的 \n两个节点，直至形成一棵树。构造过程如下：初始节点：a(1), b(2), c(4), d(5), e(8), \nf(10), g(12),合并a(1)和b(2)，得新节点3，合并3和c(4)，得新节点7，合并d(5)和7， \n得新节点12，合并e(8)和f(10)，得新节点18，合并12（来自步骤4）和g(12)，得新 \n节点24，合并18和24，得根节点 42构造出的哈夫曼树结构（深度从根开始为0）： \n深度2的叶子节点：e(8), f(10), g(12)；其他叶子节点深度：d(5)深度3, c(4) 深度4,a(1) \n和b(2)深度5。因此"},{"y":2026,"q":6,"t":0,"s":"DS","ch":"图","sec":"图的存储及基本操作","kp":"DS.6.2","kn":"邻接矩阵/邻接表/十字链表/邻接多重表","p":2,"st":"采用邻接表存储有向图G，求图G 一个顶点入度的时间复杂度为( )。 A. O(|V|) B. O(min(|V|,|E|)) C. O(E) D. O(max(|V|,|E|))","o":["O(|V|)","O(min(|V|,|E|))","O(E)","O(max(|V|,|E|))"],"a":"D","x":"在邻接表存储中，计算某顶点的入度需遍历所有顶点的出边链表，检查每条边 \n是否指向该顶点。遍历所有顶点的时间为O(|V|)，检查所有边的时间为O(|E|)， \n因此总时间复杂度为O(|V|+|E|)。由于O(|V|+|E|) = O(max(|V|,|E|))，故选项D正 \n确。"},{"y":2026,"q":7,"t":0,"s":"DS","ch":"图","sec":"图的遍历","kp":"DS.6.3","kn":"DFS 与 BFS 遍历（含生成树/复杂度）","p":2,"st":"设有向图中顶点数为n，只有一个初始顶点S，有多个标记顶点T，图中每条 边有一个字符，S 到T 的所有字符串构成集合S，则以下说法中错误的是( )。 A. 若G 无环，S 为有穷集合 B. 若G 无环，S 有长度等于n 的串 C. 若G 有环，S 有长度大于n 的串 D. 若G 有环，S 有小于2n ","o":["若G 无环，S 为有穷集合","若G 无环，S 有长度等于n 的串","若G 有环，S 有长度大于n 的串","若G 有环，S 有小于2n 的串"],"a":"B","x":"根据题目描述，有向图顶点数为n，初始顶点S，标记顶点T，每条边有字符，从 \nS到T的所有路径上的字符构成字符串集合S。该结构等价于一个NFA（非确定有 \n限自动机），其中状态为顶点，初始状态为S，接受状态为T，边上的字符为转移。 \n因此，集合S是正则语言，且可能是无限集合（若图中存在环）。常见错误说法 \n是“集合S是有穷语言”，因为S可能包含任意长的字符串（当图中存在可达环时）。 \n其他正确说法通常包括：S是正则语言、S是上下文无关语言、存在状态数不超过 \nn的自动机（NFA）识别S。"},{"y":2026,"q":8,"t":0,"s":"DS","ch":"树与二叉树","sec":"树与二叉树的应用","kp":"DS.5.10","kn":"平衡二叉树（AVL）与调整","p":2,"st":"在高度为4 的平衡二叉树中，根的左、右子树结点数相差最多的是( )。 A. 1 B. 2 C. 3 D. 5 A. Ⅰ、Ⅱ. B. Ⅰ、Ⅲ. C. Ⅱ、Ⅳ. D. Ⅲ、Ⅳ.","o":["1","2","3","5"],"a":"B","x":"在高度为4的平衡二叉树中，结点数最少的情况为7个结点。此时，根的左右子树 \n高度组合为(3,2)或(2,3)，对应结点数分别为4和2，相差最多为2。"},{"y":2026,"q":9,"t":0,"s":"DS","ch":"排序","sec":"插入排序","kp":"DS.8.2","kn":"直接插入排序与折半插入排序","p":2,"st":"使用直接插入排序对序列进行升序排序，以下比较次数最少的是( )。 A. 30,27,56,41,80,95,69 B. 31,43,26,55,63,99,77 C. 61,84,51,23,34,91,40 D. 93,32,48,81,50,21,72","o":["30,27,56,41,80,95,69","31,43,26,55,63,99,77","61,84,51,23,34,91,40","93,32,48,81,50,21,72"],"a":"B","x":"在直接插入排序中，比较次数与初始序列的有序程度正相关，序列越接 \n近升序，比较次数越少。通过分析各序列的逆序对数量或模拟排序过程比较次数： \nA序列比较次数为9次，逆序对4个；B序列比较次数为8次，逆序对3个；C序列比 \n较次数为16次，逆序对约12个；D序列比较次数为16次，逆序对约12个。B序列最 \n接近升序，比较次数最少，故选B。"},{"y":2026,"q":10,"t":0,"s":"DS","ch":"排序","sec":"交换排序","kp":"DS.8.4","kn":"起泡排序与快速排序","p":2,"st":"有两门科目，成绩分别为C1、C2，由成绩C1、C2 和总成绩保存在数组M 中。排名是按照总成绩由高到低，总成绩相同的按照C1 的乘积由高到低，C1 相同的按照原始次序排名。对数组M 先按照C1，再按照总乘积排序，这种排序 算法是( )。 A. 基数排序 B. 快速排序 C. 希尔排序 D. 选择排序","o":["基数排序","快速排序","希尔排序","选择排序"],"a":"A","x":"基数排序适用于多关键字排序，按照关键字的优先级从低到高（或从次到主）依 \n次进行稳定排序。本题中，最终排序要求以总成绩为主关键字、C1为次关键字， \n且要求稳定。实现时先按次关键字C1稳定排序，再按主关键字总成绩稳定排序， \n这正符合基数排序的LSD（最低位优先）方法。因此，这种排序算法是基数排序。"},{"y":2026,"q":11,"t":0,"s":"DS","ch":"排序","sec":"归并排序","kp":"DS.8.6","kn":"二路归并排序","p":2,"st":"使用k 路归并对外存中的数据进行排序，归并趟数为d，以下说法正确的是 ( )。 I.增大k 可以减少d 的值 II.归并趟数d 不受初始归并段影响 III.可用内存的大小限制初始归并段的长度 A. I B. I、II C. I、III D. II、III","o":["I","I、II","I、III","II、III"],"a":"C","x":"归并趟数\n（为初始归并段数量）。增大可减小，I 正确。与 \n初始归并段数量\n直接相关，故II 错误。生成初始归并段时，内存大小决定了 \n每次可排序的数据量，从而限制了初始归并段的长度，故III 正确。因此，正确 \n说法为I 和III。 \n\n26 考研408 真题及解析 \n5"},{"y":2026,"q":12,"t":0,"s":"CO","ch":"计算机系统概述","sec":"计算机系统层次结构","kp":"CO.1.1","kn":"计算机系统组成与存储程序工作方式","p":2,"st":"关于计算机的系统层次的叙述，错误的是( ) A. 最上层是应用软件层 B. 指令集体系结构是软件和硬件的接口 C. 计算机组成(即微架构)属于指令集体系结构的物理实现层 D. 操作系统可通过ISA 进行抽象，向上层软件提供服务","o":["最上层是应用软件层","指令集体系结构是软件和硬件的接口","计算机组成(即微架构)属于指令集体系结构的物理实现层","操作系统可通过ISA 进行抽象，向上层软件提供服务"],"a":"C","x":"计算机系统层次中，最上层是应用软件层，A正确。指令集体系结构（ISA）是软 \n件和硬件之间的接口，B正确。计算机组成（微架构）是ISA的逻辑实现，而非物 \n理实现（物理实现指电路、工艺等），C错误。操作系统通过ISA抽象硬件，向上 \n层提供系统调用等服务，D正确。"},{"y":2026,"q":13,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"运算方法和运算电路","kp":"CO.2.2","kn":"加减运算/溢出判断/标志位（ZF/SF/OF/CF）","p":2,"st":"对机器数10100110B 先算术右移3 位再算术左移2 位，最终结果是( ) A. 1101 0000B B. 1101 0011B C. 0101 0000B D. 0101 0011B","o":["1101 0000B","1101 0011B","0101 0000B","0101 0011B"],"a":"A","x":"【【解析】 \n算术右移3位（符号位不变，高位补符号位）：右移1位：1101 0011，右移2 \n位：1110 1001，右移3位：1111 0100；再算术左移2位（低位补0，高位丢 \n弃）：对1111 0100左移1位：1110 1000，左移2位：1101 0000 \n最终结果为1101 0000B。"},{"y":2026,"q":14,"t":0,"s":"CO","ch":"数据的表示和运算","sec":"浮点数的表示和运算","kp":"CO.2.4","kn":"IEEE 754 浮点数表示与规格化","p":2,"st":"已知float 型变量用IEEE754 单精度浮点数表示，采用就近舍入(中间值取偶 数)，若float 型变量x 为12.1，则x 的机器数是( ) A. 41419999H B. 4141999AH C. 41E0 CCCCH D. 41EO CCCDH","o":["41419999H","4141999AH","41E0 CCCCH","41EO CCCDH"],"a":"B","x":"【【解析】 \n转换为二进制：12.1 = 1100.000110011001100110011...（小数部分0.1二进制循\n环 0011）。 \n规范化：移动小数点：1.10000011001100110011001...×2³，指数为3。 \n指数位：指数偏移127，得3+127=130，二进制：10000010。 \n尾数位（23 位）与舍入：尾数取规范化后小数部分：10000011001100110011001... \n第24位为1，且后续有非零位，因此向上舍入，得 10000011001100110011010。 \n\n26 考研408 真题及解析 \n6 \n组合与十六进制：符号位0 （正数），指数10000010 ，尾数\n1000"},{"y":2026,"q":15,"t":0,"s":"CO","ch":"存储器层次结构","sec":"主存储器","kp":"CO.3.2","kn":"主存容量扩展与CPU连接（字扩展/位扩展）","p":2,"st":"用8 个64M×8 位的DRAM 芯片按交叉编上方式构成主存储器，并与一个宽 度为64 位的存储总数相连，主存每次最多每次读写64 位，且按字节编址，则下 列地址中，与主存地址0018 001DH 位于同一芯片中的是() A. 000 01D5H B. 000F A020H C. 0018 001E","o":["000 01D5H","000F A020H","0018 001EH","0F02 0014H"],"a":"A","x":"【【解析】 \n在由8个64M×8位芯片组成64位数据宽度的存储器中，每个芯片对应数据总线的 \n一个字节段，地址低3位（A2~A0）用于芯片（存储体）选择。给定地址0018001DH， \n其低3位计算如下：十六进制地址0018001DH转换为二进制，最低字节为1DH \n（00011101），取低3位为101（二进制）。因此，该地址位于芯片5（编号从0开 \n始）。同一存储体的地址特征：所有与0018001DH在同一存储体（同一芯片）的 \n地址，其低3位必须相同，即二进制低3位为101，或地址模8等于5。"},{"y":2026,"q":16,"t":0,"s":"CO","ch":"中央处理器","sec":"指令流水线","kp":"CO.5.5","kn":"指令流水线性能与结构/数据/控制冒险","p":2,"st":"下列不是由指令集体系传构规定的是( ) A. 输入输出指令 B. 采用向量中断 C. 虚拟存储管理方式 D. 指令流水线是否使用超级流水线技术","o":["输入输出指令","采用向量中断","虚拟存储管理方式","指令流水线是否使用超级流水线技术"],"a":"C","x":"A. 输入输出指令：属于ISA，定义I/O操作方式。B.采用向量中断：属于ISA， \n规定中断处理机制。C. 虚拟存储管理方式：涉及操作系统和硬件的具体管理策 \n略（如分页、分段实现），不属于ISA规定范畴，ISA仅提供虚拟存储的硬件支持 \n机制（如页表基址寄存器）。D. 指令流水线是否使用超级流水线技术：属于微 \n架构实现细节，非ISA内容。"},{"y":2026,"q":17,"t":0,"s":"CO","ch":"指令系统","sec":"高级语言程序与机器级代码之间的对应","kp":"CO.4.4","kn":"高级语言到机器级代码（选择/循环/过程调用/栈帧）","p":2,"st":"下列指令中执行后有可能按存放顺序执行其下一条指令的是( ) I.条件跳转指令 II.过程调用指令 III.陷阱(Trap)指令 IV.过程返回指令 A. 仅I、II B. 仅I、IV C. 仅II、III D. 仅III、IV","o":["仅I、II","仅I、IV","仅II、III","仅III、IV"],"a":"C","x":"26 考研408 真题及解析 \n7 \n【解析】 \n过程调用指令（如CALL、BL等）在执行时会自动保存返回地址（即顺序执行的 \n下一条指令地址），以便子程序执行后能正确返回。陷阱指令（如系统调用、软 \n中断）也会保存现场信息，包括返回地址（下一条指令地址），以便异常/中断 \n处理结束后恢复。条件跳转指令仅根据条件决定是否跳转，不涉及保存返回地址。 \n过程返回指令用于从子程序返回，它取出之前保存的返回地址并跳转，不会保存 \n新的返回地址。"},{"y":2026,"q":18,"t":0,"s":"CO","ch":"存储器层次结构","sec":"高速缓冲存储器","kp":"CO.3.5","kn":"Cache 基本原理与映射方式（直接/全相联/组相联）","p":2,"st":"某计算机按字节编址，数据cache 共有1024 行，采用4 路组相联映射试，主 存块大小为32B，若访问主存地址为1028 的4 字节数据，则该数据所在主存块 对应的组号为( ) A. 4 B. 16 C. 32 D. 64","o":["4","16","32","64"],"a":"C","x":"Cache 总行数1024，4 路组相联，组数=1024÷4 =256。主存块大小32B，块内 \n偏移占5 位。主存地址1028 所在块号= ⌊1028 ÷ 32⌋ =32。组号=块号mod 组 \n数=32 mod 256=32"},{"y":2026,"q":19,"t":0,"s":"CO","ch":"存储器层次结构","sec":"虚拟存储器","kp":"CO.3.7","kn":"页式虚拟存储器/页表/TLB/地址转换","p":2,"st":"某计算机按字节编址，虚拟地址为16 位，页大小为256B，页表项中包含装 入位(P)，页框号(PPN)等字段，TLB 采用4 路组相联映射，共有16 个页表项， TLB 表项中包含标记(Tag)有效位(V)等字段，在TLB 表项与主存页表同步后，若 主存页表中页号22 对应的页表项中P=0，PPN=","o":["Tag =05 H, V=1, PPN=1 CH","Tag =06 H, V=1, PPN=2 AH","Tag =16 H, V=0, PPN=2 AH","Tag =05 H, V=0, PPN=1 CH"],"a":"A","x":"虚拟地址16位，页大小256B，故页内偏移占8位，虚页号占8位。TLB为4路组相联， \n共16个表项，故分4组（组号0~3），索引占虚页号低2位，标记占高6位。虚页号 \n22的二进制为00010110，索引为10（即组号2），标记为000101（即05H）。主存 \n页表中该页表项的装入位 P=0，表示页面不在内存。TLB 与主存页表同步时， \n若缓存该表项，其有效位V应与P一致，即 V=0。因此，组号为2的TLB 表项中， \n\n26 考研408 真题及解析 \n8 \n若标记为05H，则V必须为0，故V=1不可能出现。其他标记（如15H、0AH 等） \n对应的页表项状态未知，其V值可能为0或1，皆有可能。"},{"y":2026,"q":20,"t":0,"s":"CO","ch":"中央处理器","sec":"数据通路","kp":"CO.5.2","kn":"数据通路的功能和基本结构","p":2,"st":"在不考虑异常中断处理和访存的额外开销下，下列关于数据通路结构与CPI 之间的关系是正确的为( ) I.单周期数据通路计算机的CPI 等于1 II.多周期数据通路计算机的CPI 大于1 III.流水线数据通路计算机的CPI 等于1 A. 仅I、II B. 仅I、III C. 仅II、III D. I、","o":["仅I、II","仅I、III","仅II、III","I、II、III"],"a":"D","x":"单周期：每条指令在固定一个时钟周期内完成，CPI=1，Ⅰ正确。多周期：每条 \n指令分为多个阶段，每个阶段占一个时钟周期，CPI\u003e1，Ⅱ正确。流水线：理想 \n情况下（不考虑异常、冲突和访存开销），流水线充满时每个时钟周期完成一条 \n指令，CPI=1，Ⅲ正确。"},{"y":2026,"q":21,"t":0,"s":"CO","ch":"总线与输入输出","sec":"I/O方式","kp":"CO.6.3","kn":"程序查询方式与程序中断方式","p":2,"st":"在I/O 子系统，由驱动程序和中断服务程序直接控制外设与主机之间的输入/ 输出操作，其中需要用到一些特权指令。下列指令中，不是特权指令的是() A. I/O 指令 B. 关中断指令 C. 中断返回指令 D. 系统调用指令","o":["I/O 指令","关中断指令","中断返回指令","系统调用指令"],"a":"D","x":"特权指令只能在核心态（管态）下执行，通常涉及硬件资源管理或关键操作。 \nA. I/O指令：直接控制外设，属于特权指令。B. 关中断指令：修改中断允许位， \n属于特权指令。C. 中断返回指令：恢复现场并返回用户态，属于特权指令。 \nD. 系统调用指令：是用户程序主动进入核心态的“陷入”指令，在用户态执行， \n不属于特权指令，其功能由操作系统在核心态实现。因此，不是特权指令的是系 \n统调用指令。"},{"y":2026,"q":22,"t":0,"s":"CO","ch":"中央处理器","sec":"异常和中断机制","kp":"CO.5.4","kn":"异常与中断的分类、检测与响应","p":2,"st":"中断控制I/O 方式下，实现I/O 需要硬件和软件协同完成，中断响应和处理 过程中所包含的下列工作中，必须由硬件完成的是() A. 开中断 B. C. 保存断点 D. 保存通用寄存器"},{"y":2026,"q":23,"t":0,"s":"OS","ch":"操作系统概述","sec":"程序运行环境","kp":"OS.1.2","kn":"内核态/用户态与特权指令、系统调用","p":2,"st":"下列操作中，在内核态执行的是() A. 编译程序 B. 链接程序 C. 装入程序 D. 命令解释程序","o":["编译程序","链接程序","装入程序","命令解释程序"],"a":"C","x":"内核态是操作系统内核运行的特权模式，负责管理硬件和核心资源。编译程序、 \n链接程序、命令解释程序（如Shell）均运行在用户态，属于用户级工具或应用。 \n装入程序（加载程序）负责将可执行程序加载到内存并创建进程，通常由操作系 \n统内核通过系统调用（如exec()）实现，需在内核态执行以直接访问内存管理硬件 \n等特权资源。"},{"y":2026,"q":24,"t":0,"s":"OS","ch":"内存管理","sec":"虚拟内存管理","kp":"OS.3.3","kn":"虚拟内存基本概念与请求页式管理","p":2,"st":"在支持虚拟存储器系统下的指令执行过程中，正确的是() A. 地址转换由操作系统完成 B. 页表项的内容由编译器确定 C. 虚拟地址的长度必须与物理地址长度相同 D. 异常由操作系统处理","o":["地址转换由操作系统完成","页表项的内容由编译器确定","虚拟地址的长度必须与物理地址长度相同","异常由操作系统处理"],"a":"D","x":"A错误：地址转换由硬件（MMU）完成，操作系统仅管理页表。B错误：页表项 \n内容由操作系统在程序运行时动态确定。C错误：虚拟地址与物理地址长度相互 \n独立，无需相同。D正确：异常（如缺页）由硬件触发，由操作系统异常处理程 \n序响应。"},{"y":2026,"q":25,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"下列的线程描述中，正确的是( ) A. 内核级线程和用户级线程都由操作系统创建 B. 多个内核级线程可以映设到用户线程 C. 同一个进程下的多个内核级线程共享进程栈 D. 同一个进程下的多个线程共享进程堆","o":["内核级线程和用户级线程都由操作系统创建","多个内核级线程可以映设到用户线程","同一个进程下的多个内核级线程共享进程栈","同一个进程下的多个线程共享进程堆"],"a":"D","x":"A错误：用户级线程由用户级线程库创建和管理，操作系统不参与；只有内核级 \n线程由操作系统创建。B错误：常见的映射关系是多个用户级线程映射到一个内 \n核级线程（多对一模型），或多个用户级线程映射到多个内核级线程（多对多）， \n但多个内核级线程映射到一个用户级线程不符合常规，会导致执行混乱。C错误： \n每个线程拥有独立的栈（线程私有），不共享进程栈；进程栈通常指主线程的栈， \n其他线程有自己的栈。D正确：同一进程的所有线程共享进程的地址空间，包括 \n堆、全局变量、代码段等，堆是共享的。"},{"y":2026,"q":26,"t":0,"s":"OS","ch":"进程管理","sec":"同步与互斥","kp":"OS.2.6","kn":"信号量机制与 PV 操作","p":2,"st":"系统中有8 个进程，执行右图的操作，资源S 的初始值为5，若此时S 的值 为-2，m 表示执行到访问资源的进程个数，n 表示阻塞的进程个数，则m 和n 的 值是( ) wait （S） 访问资源 signal （S） A. 5,2 B. 5,1 C. 6,2 D. 7,1","o":["5,2","5,1","6,2","7,1"],"a":"A","x":"信号量S的初值为5，表示可用资源数。当S\u003c0时，|S|表示阻塞的进程数，故n=2。 \n此时资源已全部分配，正在访问资源的进程数m等于资源总数5。验证：S=5-m- \nn=5-5-2=-2，符合题意。"},{"y":2026,"q":27,"t":0,"s":"OS","ch":"进程管理","sec":"进程与线程","kp":"OS.2.1","kn":"进程/线程概念与状态转换","p":2,"st":"假设进程P 的读、写进程集合分别是R(P)和W(P)，进程Q 的读写进程集合 分别为R(Q)和W(Q)，则进程P 和Q 并发执行中，不会发生错误的并发执行冲 要充要条件是( ) Ⅰ.R(Q)∩W(P)= ∅ Ⅱ.R(P)∩R(Q)= ∅ Ⅲ.W (P) ∩W(Q)=ø Ⅳ.R (P) ∩W(Q)=ø","o":["I、II","I、II、III","I、III、IV","II、III 若64 位的系统采用三级虚拟分页存储管理方式，其结构如下图所示，第三 级页表所占用的页框数是( ) 补充位( 25 ) 一级页表( 9 ) 二级页表( 9 ) 二级页表( 9 ) 页内偏移( 12 )"],"a":"C","x":"根据 Bernstein条件，两进程并发且不产生数据冲突的充要条件为：进程P的写集 \n与进程Q的读集无交集（对应Ⅰ：R(Q)∩W(P) = ∅）；进程P的写集与进程Q的 \n写集无交集（对应Ⅲ：W(P)∩W(Q)=∅）；进程 P 的读集与进程Q的写集无交集 \n（对应Ⅳ：R(P)∩W(Q)=∅）。而进程P与进程Q的读集相交（Ⅱ）不会引发冲突， \n故不需要。"},{"y":2026,"q":29,"t":0,"s":"OS","ch":"内存管理","sec":"内存管理基础","kp":"OS.3.2","kn":"页式/段式/段页式管理","p":2,"st":"下列方法中能够有效降低系统平均访存时间的是() I.TLB II.多级页表 III.工作集概念 IV.页表缓冲队列 A. I、III B. II、III C. I、III、IV D. I、II、IV","o":["I、III","II、III","I、III、IV","I、II、IV"],"a":"C","x":"I.TLB：通过缓存页表项减少地址转换的访存次数，直接降低访存时间。II.多级页 \n表：主要用于节省页表存储空间，但增加了地址转换的访存次数，反而可能增加 \n平均访存时间。III.工作集概念：依据局部性原理将常用页面保留在内存中，减少 \n缺页异常，从而降低访存时间。IV.页表缓冲队列：缓存页表项以加速地址转换， \n类似于TLB的作用，也能降低访存时间。"},{"y":2026,"q":30,"t":0,"s":"OS","ch":"操作系统概述","sec":"操作系统的基本概念","kp":"OS.1.1","kn":"OS 基本概念/功能/发展历程/结构","p":2,"st":"进程P1 和P2 共享一个文件R，该文件的页表项分别是R1 和R2，其在2 个 进程中的虚拟地址分别是W1 和W2，则下列说法中正确的是() A. 页表项R1 和R2 的内容完全不同 B. W1 和W2 映射的物理地址相同 C. 进程P1 对W1 的修改不会影响P2 对W2 的访问 D. W1 和W","o":["页表项R1 和R2 的内容完全不同","W1 和W2 映射的物理地址相同","进程P1 对W1 的修改不会影响P2 对W2 的访问","W1 和W2 虚拟地址相同"],"a":"B","x":"进程P1和P2共享文件R，即通过内存映射（mmap）将同一文件映射到各自虚拟 \n地址空间，两个页表项R1和R2映射到相同的物理页帧，故物理地址相同。A错 \n误：页表项中物理页帧号相同，但其他字段（如进程标识、保护位等）可能不 \n同。C错误：共享同一物理页，任一进程的修改对另一进程立即可见。D错误： \n不同进程的虚拟地址空间独立，虚拟地址通常不相同，除非显式指定相同地址 \n映射。"},{"y":2026,"q":31,"t":0,"s":"OS","ch":"输入输出管理","sec":"I/O管理基础","kp":"OS.5.1","kn":"I/O 控制方式与 I/O 软件层次结构","p":2,"st":"下列关于驱动程序的描述中，错误的是() A. 驱动程序是硬件与操作系统之间的接口程序 B. 驱动程序需根据硬件特性定制开发 C. 驱动程序需要设置统一的接口 D. 字符设备，块设备都是同一种I/O方式","o":["驱动程序是硬件与操作系统之间的接口程序","驱动程序需根据硬件特性定制开发","驱动程序需要设置统一的接口","字符设备，块设备都是同一种I/O方式"],"a":"D","x":"驱动程序是硬件与操作系统之间的接口（A正确），需针对硬件特性开发（B正 \n确），并为操作系统提供统一接口（C正确）。字符设备和块设备是两种不同的 \nI/O方式：字符设备以字符流为单位顺序访问（如键盘），块设备以数据块为单 \n位随机访问（如磁盘）。两者I/O方式不同，驱动程序实现也不同。"},{"y":2026,"q":32,"t":0,"s":"OS","ch":"输入输出管理","sec":"I/O管理基础","kp":"OS.5.1","kn":"I/O 控制方式与 I/O 软件层次结构","p":2,"st":"下列操作中，鼠标中断处理程序完成的是() A. 解析鼠标的输入指令含义 B. 将鼠标数据同步到用户应用程序缓冲区 C. 将数据从输入设备传输到数据寄存器 D. 将数据从数据寄存器传输到内核缓冲区","o":["解析鼠标的输入指令含义","将鼠标数据同步到用户应用程序缓冲区","将数据从输入设备传输到数据寄存器","将数据从数据寄存器传输到内核缓冲区"],"a":"D","x":"鼠标中断处理程序属于操作系统底层中断服务例程（ISR）。在I/O过程中：硬件 \n负责从输入设备读取数据到数据寄存器（即C选项描述的操作）。中断处理程序 \n响应硬件中断，其核心职责是从硬件的数据寄存器中读取数据，并传输到操作系 \n统内核的缓冲区（即D选项）。中断上下文要求快速响应，因此解析指令、同步 \n到用户缓冲区等更高层操作均在中断返回后，由驱动程序或用户程序完成。"},{"y":2026,"q":33,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络体系结构","kp":"NET.1.2","kn":"分层结构/OSI 与 TCP/IP 模型/协议服务接口","p":2,"st":"下列关于分层网络体系结构的叙述中，错误的是( ) A. 每层都有明确的功能边界 B. 层次越多效率越高 C. 有利于各层技术独立演化 D. 上层无需关心下层的具体实现细节","o":["每层都有明确的功能边界","层次越多效率越高","有利于各层技术独立演化","上层无需关心下层的具体实现细节"],"a":"B","x":"分层网络体系结构的设计原则包括：每层功能明确（A正确）、各层技术独立发 \n展（C正确）、上层通过接口使用下层服务而无需了解其细节（D正确）。但层次 \n并非越多越好，层次过多会增加封装/解封装的开销，导致效率降低。网络设计 \n需在层次清晰与效率之间权衡，故B说法错误。"},{"y":2026,"q":34,"t":0,"s":"NET","ch":"物理层","sec":"通信基础","kp":"NET.2.2","kn":"奈奎斯特定理与香农定理","p":2,"st":"若在带宽200kHz，信噪比S/N=1023 的信道上，发送一个长度为1500B 的分 组，则发送该分组的传输时延至少是( ) A. 1ms B. 2ms C. 3ms D. 6ms","o":["1ms","2ms","3ms","6ms"],"a":"D","x":"由香农公式，信道容量:\n;带宽\n，信噪比 \n。\n \n分组长度\n。最小传输时延（理论下界）为： \n。因此，传输该分组至少需要6ms。"},{"y":2026,"q":35,"t":0,"s":"NET","ch":"计算机网络概述","sec":"计算机网络基本概念","kp":"NET.1.1","kn":"网络定义/组成/分类与性能指标","p":2,"st":"假设采用CSMA/CA 的IEEE802.11 无线局域网，其数据传输速率为300 Mbps， DIFS=128μs，SIFS=28μs。忽略除数据帧以外的其他帧的传输时延及信号传播时 延，主机H 发送一个总长度为1500B 的数据帧，则H 从开始发送数据帧至确认 接收方收到所需的时间至少( ) A","o":["40μs","68μs","168μs","200μs"],"a":"D","x":"数据帧传输时间=帧长/速率=\n。最短时间=DIFS \n+数据帧传输时间+SIFS=\n，约等于6ms。"},{"y":2026,"q":36,"t":0,"s":"NET","ch":"数据链路层","sec":"局域网与广域网","kp":"NET.3.5","kn":"以太网/IEEE 802.3/802.11/VLAN/PPP","p":2,"st":"支持VLAN 划分的以太网交换机，已按端口划分了两个VLAN。VLAN 划分 结果及部分端口连接主机的MAC 地址如图所示。下列具有不同目的MAC 地址 （DA）和源MAC 地址（SA）的以太网帧F1-F4 中，H3 会接收到的是（） 36.支持VLAN 划分的以太网交换机，已按端口划分了两个VLA","o":["仅F2、F4","仅F1、F3","仅F1、F2","仅F3、F4"],"a":"B","x":"VLAN隔离原则：同一VLAN内主机可直接通信，不同VLAN间二层隔离。图中V\nLAN划分通常为：VLAN1包含H1、H2、H3（MAC 地址 01、02、03）；VLAN2\n包含H4、H5、H6（MAC地址04、05、06）。F1：H1（VLAN1）发往H3（VLAN\n\n26 考研408 真题及解析 \n15 \n1）的单播帧，H3 可接收。F2：H5（VLAN2）发往H4（VLAN2）的单播帧，仅\n在 VLAN2内转发，H3无法接收。F3：H2（VLAN1）发出的广播帧，在VLAN1\n内广播，H3可接收。F4：（VLAN1）发往H6（VLAN2）的单播帧，跨VLAN 需\n三层设备转发，且H3不会接收自己发出的帧。故H3仅接收到F1和"},{"y":2026,"q":37,"t":0,"s":"NET","ch":"网络层","sec":"网络层设备","kp":"NET.4.8","kn":"路由器的组成/路由表与分组转发","p":2,"st":"某网络在t0 刻的网络拓扑和R1 的路由表如下图所示。R1~R4 是路由器，基 于链路状态路由算法计算路由。S0~S4 是路由器R1 的接口，链路上的数值为链 路费用，若t1（t1\u003et0）时刻，R1 检测到R1 到R2 的链路断开，则R1 再重新计 算路由并进行充分路由聚合后的表中路由项的数量（） ","o":["3","4","5","6"],"a":"B","x":"根据链路状态路由算法，当 R1 到 R2 的链路断开后，R1 重新计算最短路径\n树，并考虑路由聚合（将连续子网合并）。由拓扑图可知，R1 直连若干子网，\n并通过其他路由器到达其他子网。断开后，原本经 R2 的子网可能改经 R3 或 \nR4 可达。计算后，可达子网经充分聚合（如 199.10.20.0/27 与 199.10.20.32/27 \n可聚合为 199.10.20.0/26 等），路由表项数量为 4。 \n\n26 考研408 真题及解析 \n16","im":"qimg/2026_37.png"},{"y":2026,"q":38,"t":0,"s":"NET","ch":"网络层","sec":"路由算法","kp":"NET.4.2","kn":"静态/动态路由与距离向量/链路状态算法","p":2,"st":"下列路由协议中，能将一个自治系统划分为多个区域的内部网关协议是( ) I.OSPS II.RIP III.BGP A. 仅I B. 仅II C. 仅I、III D. 仅II、III","o":["仅I","仅II","仅I、III","仅II、III"],"a":"A","x":"内部网关协议（IGP）用于自治系统内部路由，包括OSPF 和RIP。其 \n中，OSPF 是一种基于链路状态的IGP，支持将自治系统划分为多个区域，以实 \n现层次化路由和高效管理。RIP 作为距离矢量IGP，不支持区域划分。BGP 是 \n外部网关协议，用于自治系统间路由。"},{"y":2026,"q":39,"t":0,"s":"NET","ch":"网络层","sec":"IPv4","kp":"NET.4.4","kn":"IPv4 地址/NAT/子网划分/子网掩码/CIDR/路由聚集","p":2,"st":"若将IP 网络123.4.4.0/22 划分为规模均衡的32 个子网，则IP 地址 123.4.5.11 所在的子网是（） A. 123.4.4.0/27 B. 123.4.4.32/27 C. 123.4.5.0/27 D. 123.4.5.192/27","o":["123.4.4.0/27","123.4.4.32/27","123.4.5.0/27","123.4.5.192/27"],"a":"C","x":"原始网络：123.4.4.0/22，主机位10位。划分子网：需划分32个子网，因\n， \n故借用5位主机位作为子网位，新掩码为22+5=27位（即/27）。确定子网：IP地 \n址123.4.5.11的二进制为01111011 00000100 00000101 00001011。取前27位（包括 \n第一、二字节全部16位，第三字节全部8位，第四字节前3位“000”），得到网 \n络地址123.4.5.0/27。"},{"y":2026,"q":40,"t":0,"s":"NET","ch":"应用层","sec":"WWW与HTTP","kp":"NET.6.3","kn":"WWW 与 HTTP 协议","p":2,"st":"下列叙述中不属于cookie 的技术典型用途的是( ) A. 用户跟踪 B. 个性化推荐 C. 构建虚拟购物车 D. 缩短web 对象的响应时间 二、综合应用题","o":["用户跟踪","个性化推荐","构建虚拟购物车","缩短web 对象的响应时间 二、综合应用题"],"a":"D","x":"Cookie主要用于客户端状态管理，典型用途包括：用户追踪：记录用户浏览行为， \n实现会话管理。个性化推荐：基于存储的用户偏好提供定制内容。虚拟购物车： \n维护购物车状态，保持用户选择商品。减少web访问时间并非Cookie的设计目标。 \n实际上，Cookie可能增加请求开销（每次请求携带Cookie数据），而减少访问时 \n间通常依赖缓存、CDN等技术。因此，D项不属于其典型用途。 \n\n26 考研408 真题及解析 \n17 \n二、综合应用题：41~47 题，共70 分。"},{"y":2026,"q":41,"t":1,"s":"DS","ch":"树与二叉树","sec":"树与二叉树的应用","kp":"DS.5.9","kn":"二叉排序树（BST）","p":13,"st":"假定二叉搜索树使用二叉链表存储，存储结构如下: 给一棵二叉搜索树T 和整数K，查找树中关键字与K 之差的绝对值最小的所有 结点，并输出该绝对值与结点中的关键字。 (1)给出算法的基本思想。(4 分) (2)使用C/C++描述算法思想。(8 分)","x":"41.（12 分）假定二叉搜索树使用二叉链接表存储，存储结构如下：\n\n给一棵二叉搜索树T 和整数K，查找树中关键字与K 之差的绝对值最小的所有\n结点，并输出该绝对值与结点中的关键字。\n\n(1)给出算法的基本思想。(4 分)\n(2)使用C/C++描述算法思想。(8 分)\n（1）叉搜索树的中序序列递增。与K差值绝对值最小的结点只可能出现在：小于\n等于K的最大结点（前驱）；大于等于K的最小结点（后继）。从根开始查找K，\n若找到则直接输出（绝对差0）；否则在查找路径中记录最接近K的结点作为候选\n（前驱/后继）。比较前驱和后继与K的差值，输出绝对值最小的所有结点。\n（2）\n\n26 考研408 真题及解析\n18","fs":"假定二叉搜索树使用二叉链表存储，存储结构如下:\n给一棵二叉搜索树T 和整数K，查找树中关键字与K 之差的绝对值最小的所有\n结点，并输出该绝对值与结点中的关键字。\n(1)给出算法的基本思想。(4 分)\n(2)使用C/C++描述算法思想。(8 分)"},{"y":2026,"q":42,"t":1,"s":"DS","ch":"栈、队列和数组","sec":"栈和队列的基本概念","kp":"DS.3.1","kn":"栈的基本概念与进出栈序列","p":10,"st":"栈的基本操作有出栈和入栈，将序列1,2,3,…,n 依次入栈，回答下列问题: (1)当n=9 时，可以得到出栈序列{2,3,1,6,4,7,5,4,8}吗?可以得到出栈序列吗?(2 分) (2)假设1,2,3,…,n 组成任意序列的出栈序列P₁,P₂,…,Pₙ，在序列中有Pᵢ、Pⱼ、 Pₖ(i\u003cj\u003c","x":"42.（10分）栈的基本操作有出栈和人栈，将序列1，2.3,...,n依次人栈，回答下列\n问题:\n(1)当n=9时，能否得到出栈序列{2,3,1,6.4,7,5.9,8)？能否得到出栈序列{2,3,1,5.6,7,4.\n9,8}？(2分)\n(2)假设1,2,3....n组成任意序列的出栈序列 P1,P2…Pn,在序列中有Pi、Pj、Pk(i＜j\u003c\nk)，若该出栈序列不能由栈得到，则Pi、Pj、Pk的大小关系是？(2分)\n(3)若n=4.则2开头的序列的个数有多少个？(2分)\n(4)若n=k-1时,出栈序列总共有M个，如果n=k,那么以1开头的出栈序列个数有多少\n个？以2开头的出栈序列有多少个？总共的出栈序列有多少个？(4分)\n\n(1) 序列{2,3,1,6,4,7,5,9,8}：不能（出4时栈顶为5，不合法）。序列{2,3,1,5,6,7,4,9,\n8}：能（模拟可行）。\n(2) 若出栈序列不能由栈得到，则存在\n使\n（即“大中小”顺\n序）。\n(3) n=4时，2开头的合法出栈序列有5个（枚举：2134,2143,2314,2341,2431）。\n(4) n=k时：以1开头的个数：M（1首先出栈，剩余k-1个数出栈序列数即为M）。\n以2 开头的个数：M（2 首先出栈，则1 被压栈底必须最后出，剩余k-1 个数出\n栈序列数为M）。总个数：\n（卡特兰数递推公式）。","fs":"栈的基本操作有出栈和入栈，将序列1,2,3,…,n 依次入栈，回答下列问题:\n(1)当n=9 时，可以得到出栈序列{2,3,1,6,4,7,5,4,8}吗?可以得到出栈序列吗?(2 分)\n(2)假设1,2,3,…,n 组成任意序列的出栈序列P₁,P₂,…,Pₙ，在序列中有Pᵢ、Pⱼ、\nPₖ(i\u003cj\u003ck)，若该出栈序列不能由栈得到，则Pᵢ、Pⱼ、Pₖ的大小关系是?(2 分)\n(3)若n=4，则2 开头的序列个数有多少个?(2 分)\n(4)若n=k-1 时，出栈序列总共有M 个，如果n=k，那么以1 开头的出栈序列个\n数有多少个?以2 开头的出栈序列有多少个?总共的出栈序列有多少个?(4 分)"},{"y":2026,"q":43,"t":1,"s":"CO","ch":"中央处理器","sec":"数据通路","kp":"CO.5.2","kn":"数据通路的功能和基本结构","p":13,"st":"(10 分)某16 位计算机c 按字编址，通用寄存器R0~R15 的编号为0~15，存 储器地地为16 位，采用定长指令字，指令格有R,I 和M 型如下所示。 其中OP1 为0001,0010 分别表示加，左移指令，OP2 为0100 表示加立即数指令。 OP3 为1110、1111 分别表示取数、","x":"43. (10分)某16位计算机c按字编址,通用寄存器RO~R15的编号为0-15,存储器地\n\n26 考研408 真题及解析\n19\n地为16位，采用定长指令字，指令格有R,和M型如下所示。\n\n其中OP1为0001.0010分别表示加.左移指令.OP2为0100表示加立即数指令.OP3为1\n110、1111分别表示取数、存数指令，R[r］表示寄存器r中的内容，num表示移位\n位数,M[addr]表示储存器地址addr中的内容，请回答下列问题:\n(1存储单元的位数是多少?寄存器的位数是是多少？(2分)\n(2)op1和op2的编码能不能相同？op2和op3的编码能不能相同？(2分)\n(3)若R(2)=ABCDH,R(9)=F001H,则指令0000 0010 1001 0001执行后,R2和R9中内\n容分别是多少？(2分)\n(4)X变量和y变量在内存中是连续的，从低地址到高地址存放的，现在一条C语言\n代码:y=x*16-5，可以用上边的指令完成，共4条指令，给定了每条指令的部分的\n机器码。变量x,y均为16位带符号整数，在存储器中是连续的，依次从低地址向高\n地址连续存放,x的地址在R15中，实现y=16*x-5的指令共四条11~14,写出1~4处的\n内容(4分)\n\n(1) 存储单元位数＝字长＝16位；寄存器编号0～15，共16个，位数与字长一致，\n为16位。\n(2)op1与op2可相同，因op1在R型指令低4位，op2在I型指令高4位，位置不同，不\n会混淆（但需保证op2≠0000，否则与R型标志冲突）。op2与op3不可相同，因二\n者均在指令高4位，若相同则无法区分I型与M型指令。\n(3) 指令0000 0010 1001 0001为R型加法：R[2]←R[2]+R[9]。R[2]=ABCDH，R\n[9]=F001H，相加得1 9BCEH（进位舍去），故R[2]=9BCEH，R[9]不变，为F00\n1H。\n(4) 变量x、y按字编址，地址差1。指令序列及机器码如下：\n\n26 考研408 真题及解析\n20","fs":"(10 分)某16 位计算机c 按字编址，通用寄存器R0~R15 的编号为0~15，存\n储器地地为16 位，采用定长指令字，指令格有R,I 和M 型如下所示。\n其中OP1 为0001,0010 分别表示加，左移指令，OP2 为0100 表示加立即数指令。\nOP3 为1110、1111 分别表示取数、存数指令，R[r]表示寄存器r 中的内容，num\nR 型\n0000\nrt\nrs/num\nop1\nR[rt]←R[rt]op1R[rs];\nR[rt]←R[rt]op1num\nI 型\nop2\nrt\nimm8\nR[rt]←R[rt]op2 imm8\nM 型\nop3\noffset\noffset\nR[0]←M[R[15]+offset];\nM[R[15]+offset]←R[0]\ntypedef struct BSTNode{\nint data;\nstruct BSTNode *left,*right;\n} BSTNode;\ntypedef BSTNode BTNode;\n\n表示移位位数，M[addr]表示储存器地址addr 中的内容，请回答下列问题\n(1)主存单元和通用寄存器的宽变合为的少位?(2 分)\n(2)OP1 和OP2 的编码是否可以相同?OP2 和OP3 的编码是否可以相同?(2 分)\n(3)若R(2)=ABCDH，R(9)=F001H 则指令0000 0010 1001 0001 执行后，R2 和R9\n中内容分别是多少?(2 分)\n(4)若变量x,y 均为16 位带符号整数，在存储器中依次从低地址向高地址连续存\n放，x 的地址在R15 中，实现y=16*x-5 的4 条指令I1~I4 如题43 表所示，写出\n①~④处的内容(4 分)\n题43 表\n21:\n①\n0000 0000 0000 0000\n22: 0000\n②\n0010\n23: 0100 0000\n③\n24: 1111\n④"},{"y":2026,"q":44,"t":1,"s":"CO","ch":"中央处理器","sec":"数据通路","kp":"CO.5.2","kn":"数据通路的功能和基本结构","p":10,"st":"(15 分)假定43 题中计算机C 的部分数据通路如题44 所示。 (1)①②是同一类部件，其名称是什么(1 分) (2)I 型指令中imm8 可以是带符号或无符号整数，M 型指令中offset 是带符号整 数，则EXtOP 至少有几位?为什么?(2 分) (3)取指周期中MARSrC. ALUA ","x":"44.（15分）假定43题中计算机C的部分数据通路如44所示。\n\n(1) ①②是同一类部件，其名称是什么?(1分)\n(2)I型指令中imm8可以是带符号或无符号整数,M型指令中offset是带符号整数,则\nEX1OP至少有几位?为什么?(2分)\n(3)取值周期中MARSrC、ALUASrC、ALUBSrC、RegWr的取值各是什么?\n(4分)\n(4)左移指令周期中ALUBSrC、Regwsre、RegDst、RegWr的取值各是什么?(4分)\nExtop是否可以与M型指令中的EXtop相同?为什么?(4分)\n\n（1）①部件名称为指令寄存器（或IR的高低位部分）。\n（2）EX1OP的位数：EX1OP是I型指令的扩展控制信号，用于对imm8进行符\n号扩展（有符号数）或零扩展（无符号数）。imm8为8位，扩展结果至少需16位\n（与ALU输入等宽），故EX1OP至少需要2位，分别选择“符号扩展”、“零扩展”\n或“其他扩展方式”（如低位补零高位符号位等）。\n（3）取指周期控制信号\nMARSrc=0或PC（选择PC作为存储器地址）。ALUASrc=PC（将PC送入ALU的\nA端）。ALUBSrc=4（常数字4，用于PC+4）。RegWr=0（不写寄存器，取指\n\n26 考研408 真题及解析\n21\n阶段不修改寄存器）。\n（4）左移指令周期控制信号\nALUBSrc=shamt（指令中的移位量字段）。RegWrSrc=1或ALU（选择ALU结\n果写入寄存器）。RegDst=rd（目标寄存器为rd字段）。RegWr=1（允许写入寄\n存器）。Extop可否与M型指令的EXtop相同。不可以。I型指令的Extop对8位立即\n数imm8进行扩展（扩展至16位）。M型指令的EXtop对offset 进行扩展（通常off\nset位数与imm8不同，如5位或6位）。扩展的位数和含义不同，控制逻辑不同，故\nExtop不能与M型指令的EXtop相同。","fs":"(15 分)假定43 题中计算机C 的部分数据通路如题44 所示。\n(1)①②是同一类部件，其名称是什么(1 分)\n(2)I 型指令中imm8 可以是带符号或无符号整数，M 型指令中offset 是带符号整\n数，则EXtOP 至少有几位?为什么?(2 分)\n(3)取指周期中MARSrC、ALUA SrC、ALUB SrC、RegWr 的取值各是什么?(4 分)\n(4)左移指令周期中ALUB SrC、Regwsrc、RegDst、Regwr 的取值各是什么?Extop\n是否可以与M 型指令中的EXtop 相同?为什么?(2 分)\n44. (7 分)系统采用优先权(优先权越大优先级越大)和时间片轮转调度算法，只有\n在发生时间中断的时候才运行抢占CPU，时间中断间隔是10ms，当进程进入就\n绪队列时候，时间片是50ms，当进程是时间片用完重新回到就绪队列时，优先\n权值的大小减1；当进程是被更高优先级抢占回到就绪队列时，优先权值的大小\n不变。优先权相等的时候，先进入就绪队列的被优先调度。4 个进程的到达时刻、\n初始优先权、CPU 运行时间如下表所示:\n\n进程\n到就绪队列的时间\n优先权(初始)\nCPU 运行时间\nP1\n10ms\n3\n95ms\nP2\n10ms\n4\n20ms\nP3\n12ms\n2\n40ms\nP4\n14ms\n5\n60ms\n(1)在10ms 的时候开始进行进程调度，4 个进程调度结束，中断次数和CPU 调度\n次数分别是?P1,P2,P3,P4 在什么时刻进行第一次调度(5 分)\n(2)时间片由50ms 改为100ms，CPU 的调度次数会增大，不变或减少?如果中断\n间隔从10ms 变为1ms，则系统开销会增大、不变还是减少?(2 分)","im":"qimg/2026_44.png"},{"y":2026,"q":46,"t":1,"s":"OS","ch":"文件管理","sec":"文件","kp":"OS.4.1","kn":"文件概念/元数据/inode/文件操作","p":7,"st":"(8 分)文件系统的目录项包括文件名和索引节点号，磁盘包含索引节点表、位 图、目录、文件数据等元数据，若盘块大小为4KB，盘号是4B，索引节点表存 放了系统的所有文件，从0 开始编号，存放在盘块号100 开始连续的4096 个盘 块中。索引节点号占128B，包含直接地址项5 个，一级间接地址项、二级","x":"46.\n\n有磁盘块的位图，还有索引节点的位图，然后一个索引节点应该是128B对于每\n个索引结点中，采用索引结构组织文件，每个索引结点中有5个直接地址项，分\n别有一级间接项，二级间接地址项，三级间接地址项各一个。然后一个磁盘块是\n4KB，索引结点在磁盘中连续存放在4096个磁盘块中，起始盘块号是100。\n(1) 文件file它的索引节点存在几号磁盘块？若要该文件file的索引结点已经在内\n存中了，如果想要读取第21460个字节的数据(只读一个字节)，至少需要访存\n几次？如果磁盘空间大小没有上限请问最多可以创建多少个文件？(3分)\n(2) 是如果要把这个dir1目录删除的话，要动哪些数据结构或者是元数据，怎么操\n作？(5分)\n\n(1)①设文件file的索引节点号为N（由目录项给出），索引节点存放在磁盘块\n号：\n（每个磁盘块存放\n个索引节点）。\n②读取第21460字节（偏移量21459）至少需2次 访存。计算：逻辑块号=\n（从0开始），超出5个直接地址范围，需通过一级间接块寻\n址，故先读间接块（1次），再读数据块（1次）。\n③最多创建文件数由索引节点总数决定：\n个。\n(2) 删除目录 dir1的操作步骤：","fs":"(8 分)文件系统的目录项包括文件名和索引节点号，磁盘包含索引节点表、位\n图、目录、文件数据等元数据，若盘块大小为4KB，盘号是4B，索引节点表存\n放了系统的所有文件，从0 开始编号，存放在盘块号100 开始连续的4096 个盘\n块中。索引节点号占128B，包含直接地址项5 个，一级间接地址项、二级间接\n地址项、三级间接地址项各1 个。磁盘位示图和索引节点位示图分别记录磁盘和\n索引节点的使用情况，0 表示未使用，1 表示使用。其中目录结构图和文件的索\n引节点表如下所示，file 文件占30KB。\n(1)file 的索引节点所在的盘块号是多少?若file 的索引节点已经读取到内存，要访\n问file 文件中偏移地址21460 的一个字节数据，则最多需要读多少个盘块?如果\n文件系统中有足够的磁盘空间，则最多可以存放多少个文件?(3 分)\n(2)如果要删除目录dir1，则需要对元数据进行哪些操作?(5 分)","im":"qimg/2026_46.png"},{"y":2026,"q":47,"t":1,"s":"NET","ch":"传输层","sec":"TCP协议","kp":"NET.5.3","kn":"TCP 段格式/连接管理（三次握手四次挥手）","p":9,"st":"假设C 建立一条TCP 连接，向服务器Si 上传一个总长度为2000B 的计算任 务描述文件。 已知C 的拥塞窗口初始阈值为8MSS，MSS=500B，Si 对收到每个TCP 段进行确 认，且确认段不封装数据。接收窗口rwnd 始终为1000B，RTT=5ms，C 建立连 接时选择的初始序号为100","x":"47.假设C建立一条TCP连接向服务器Si上传一个总长度为2000B的计算任务描述\n\n26 考研408 真题及解析\n23\n文件,已知C的拥塞窗初始阈值为8MSS.MSS=500B.Si对收到每个TCP段进行确\n认.且确认段不封装数据。接收窗口rwnd始终为1000B,RTT=5ms,C建立连接时选\n择的初始序号为1000,Si选择的初始序号为2000,SYN、ACK、FIN为标志位,seq为\n序号,ack_seq为确认序号。在整个文件传输过程中未出现任何重传或报文丢失。\n(1) C与Si建立TCP连接过程需要几次握手？C收到的SYN=1,ACK=1的TCP段的确\n认序号是多少？\n(2) 当C接收Si发送的ACK=1,seq=2001,ack_seq=2001,wnd=1000确认段后,C的拥塞\n窗口增加到多少？C的发送窗口设置为多少？\n(3) C与Si释放TCP连接过程需要几次挥手？C收到最后一个TCP报文段的序号seq,\n确认序号ack_seq,FIN的值分别是多少？\n(4) 忽略报文段传输时延,且时间从C请求建立TCP连接时刻算起,则C确定Si已成\n功接收到文件的时间是多少？\n\n(1) 需要3次握手。C收到的SYN=1,ACK=1的TCP段的确认序号是1001（对C的SY\nN的确认）。\n(2) 拥塞窗口增加到2MSS（1000B）。发送窗口设置为1000B（受接收窗口rwnd=1\n000B限制）。\n(3) 需要4次挥手。C收到的最后一个TCP报文段（Si的FIN+ACK段）中，seq=200\n1，ack_seq=3002，FIN=1。\n(4) C确定Si已成功接收到文件的时间是15ms（3个RTT）。","fs":"假设C 建立一条TCP 连接，向服务器Si 上传一个总长度为2000B 的计算任\n务描述文件。\n\n已知C 的拥塞窗口初始阈值为8MSS，MSS=500B，Si 对收到每个TCP 段进行确\n认，且确认段不封装数据。接收窗口rwnd 始终为1000B，RTT=5ms，C 建立连\n接时选择的初始序号为1000，Si 选择的初始序号为2000，SYN、ACK、FIN 为\n标志位，seq 为序号，ack_seq 为确认序号。在整个文件传输过程中未出现任何重\n传或报文丢失\n(1)C 与Si 建立TCP 连接过程需要几次握手?C 收到的SYN=1，ACK=1 的TCP\n段的确认序号是多少?\n(2)当C 接收Si 发送的ACK=1，seq=2001，ack_seq=2001，rwnd=1000 确认段后，\nC 的拥塞窗口增加到多少?C 的发送窗口设置为多少?\n(3)C 与Si 释放TCP 连接过程需要几次挥手?C 收到最后一个TCP 报文段的序号\n(seq)，确认序号(ack_seq)，FIN 的值分别是多少?\n(4)忽略报文段传输时延，且时间从C 请求建立TCP 连接时刻算起，则C 确定\nSi 已成功接收到文件的时间是多少?","im":"qimg/2026_47.png"}],"tree":[{"key":"DS","name":"数据结构","n":228,"p":768,"chapters":[{"name":"树与二叉树","n":69,"p":206,"kps":[{"id":"DS.5.6","name":"哈夫曼树与哈夫曼编码","n":12,"p":43,"ny":11},{"id":"DS.5.3","name":"二叉树遍历（先/中/后/层次）与序列还原","n":13,"p":37,"ny":12},{"id":"DS.5.1","name":"树/二叉树性质与结点度数计算","n":9,"p":26,"ny":9},{"id":"DS.5.9","name":"二叉排序树（BST）","n":7,"p":25,"ny":7},{"id":"DS.5.8","name":"堆（大根堆/小根堆）及其调整与建堆","n":7,"p":22,"ny":7},{"id":"DS.5.2","name":"二叉树的顺序存储与链式存储","n":5,"p":21,"ny":5},{"id":"DS.5.10","name":"平衡二叉树（AVL）与调整","n":7,"p":14,"ny":7},{"id":"DS.5.5","name":"树的存储/森林与二叉树转换/树与森林遍历","n":6,"p":12,"ny":6},{"id":"DS.5.4","name":"线索二叉树的基本概念与构造","n":3,"p":6,"ny":3}]},{"name":"图","n":43,"p":181,"kps":[{"id":"DS.6.2","name":"邻接矩阵/邻接表/十字链表/邻接多重表","n":6,"p":50,"ny":6},{"id":"DS.6.1","name":"图的基本概念（度/路径/连通/生成树/回路）","n":10,"p":31,"ny":9},{"id":"DS.6.4","name":"最小生成树（Prim/Kruskal）","n":6,"p":28,"ny":6},{"id":"DS.6.5","name":"最短路径（Dijkstra/Floyd/BFS）","n":5,"p":21,"ny":5},{"id":"DS.6.6","name":"拓扑排序与AOV网","n":5,"p":21,"ny":5},{"id":"DS.6.7","name":"关键路径与AOE网","n":5,"p":18,"ny":5},{"i <script>
(function(){
  const P = JSON.parse(document.getElementById('payload').textContent);
  const ROWS = P.rows, TREE = P.tree;
  const SUBJ = {DS:'数据结构',CO:'计算机组成原理',OS:'操作系统',NET:'计算机网络'};
  const ACC  = {DS:'#1f5fa8',CO:'#a83226',OS:'#1c6b3c',NET:'#96650a'};

  const state = {scope:'all', kp:null, ch:null, subj:null, type:'all', text:''};
  const $ = s => document.querySelector(s);
  const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

  /* ---------- totals ---------- */
  const totQ = ROWS.length, totP = ROWS.reduce((a,r)=>a+r.p,0);
  const years = [...new Set(ROWS.map(r=>r.y))].sort();
  $('#totQ').textContent = totQ;
  $('#totP').textContent = totP;
  $('#totY').textContent = years.length;
  $('#navAllN').textContent = totQ;

  /* ---------- sidebar tree ---------- */
  const treeBox = $('#tree');
  TREE.forEach(sb=>{
    const group = el('div','sb-group');
    const row = el('button','sb-row sb-ch open','<span class="chev">▶</span><span class="cdot"></span>'+
      '<span class="lbl">'+sb.name+'</span><span class="num">'+sb.n+'</span>');
    row.style.setProperty('--ac', ACC[sb.key]);
    row.dataset.subj = sb.key;
    const kids = el('div','sb-kids open');
    sb.chapters.forEach(ch=>{
      const crow = el('button','sb-row sb-ch sb-sub',
        '<span class="chev">▶</span><span class="lbl">'+esc(ch.name)+'</span><span class="num">'+ch.n+'</span>');
      crow.style.setProperty('--ac', ACC[sb.key]);
      const ckids = el('div','sb-kids');
      ch.kps.forEach(kp=>{
        const krow = el('button','sb-row sb-kp',
          '<span class="lbl">'+esc(kp.name)+'</span><span class="num">'+kp.n+'</span>');
        krow.style.setProperty('--ac', ACC[sb.key]);
        krow.dataset.kp = kp.id;
        krow.dataset.subj = sb.key;
        krow.dataset.ch = ch.name;
        krow.onclick = e => { e.stopPropagation(); go({scope:'kp',kp:kp.id,subj:sb.key,ch:ch.name}); };
        ckids.appendChild(krow);
      });
      crow.dataset.subj = sb.key;
      crow.dataset.ch = ch.name;
      crow.onclick = e => {
        e.stopPropagation();
        const open = crow.classList.toggle('open');
        ckids.classList.toggle('open', open);
        go({scope:'ch',subj:sb.key,ch:ch.name});
      };
      kids.appendChild(crow); kids.appendChild(ckids);
    });
    row.onclick = e=>{
      e.stopPropagation();
      const open = row.classList.toggle('open');
      kids.classList.toggle('open', open);
      go({scope:'subj',subj:sb.key});
    };
    group.appendChild(row); group.appendChild(kids);
    treeBox.appendChild(group);
  });

  document.querySelector('[data-nav="all"]').onclick = ()=>go({scope:'all'});

  /* ---------- chips ---------- */
  document.querySelectorAll('#typeChips .chip').forEach(c=>{
    c.onclick = ()=>{
      document.querySelectorAll('#typeChips .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
      state.type = c.dataset.type;
      render();
    };
  });
  $('#reset').onclick = ()=>{ $('#q').value=''; go({scope:'all'}); };

  /* ---------- search ---------- */
  let timer;
  $('#q').addEventListener('input', e=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{ state.text = e.target.value.trim().toLowerCase(); render(); }, 120);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='/' && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
    if(e.key==='Escape'){ $('#q').value=''; state.text=''; render(); }
  });

  /* ---------- navigation ---------- */
  function go(next){
    state.scope = next.scope;
    state.kp = next.kp||null; state.ch = next.ch||null; state.subj = next.subj||null;
    syncHash();
    syncSidebar();
    render();
    if(window.innerWidth<=900) $('#sb').classList.remove('open');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function syncHash(){
    let h = '#';
    if(state.scope==='kp') h += 'kp='+encodeURIComponent(state.kp);
    else if(state.scope==='ch') h += 'ch='+encodeURIComponent(state.subj+'/'+state.ch);
    else if(state.scope==='subj') h += 'subj='+state.subj;
    else h += 'all';
    history.replaceState(null,'',h);
  }
  function syncSidebar(){
    document.querySelectorAll('.sb-row').forEach(r=>r.classList.remove('on'));
    if(state.scope==='all'){ document.querySelector('[data-nav="all"]').classList.add('on'); return; }
    let sel=null;
    if(state.scope==='kp') sel = document.querySelector('.sb-kp[data-kp="'+CSS.escape(state.kp)+'"]');
    else if(state.scope==='ch') sel = document.querySelector('.sb-ch[data-ch="'+CSS.escape(state.ch)+'"][data-subj="'+state.subj+'"]');
    else if(state.scope==='subj') sel = document.querySelector('.sb-ch[data-subj="'+state.subj+'"]:not(.sb-sub)');
    if(sel){ sel.classList.add('on'); }
  }

  /* ---------- filter + render ---------- */
  function filtered(){
    return ROWS.filter(r=>{
      if(state.scope==='kp' && r.kp!==state.kp) return false;
      if(state.scope==='ch' && !(r.s===state.subj && r.ch===state.ch)) return false;
      if(state.scope==='subj' && r.s!==state.subj) return false;
      if(state.type!=='all' && String(r.t)!==state.type) return false;
      if(state.text){
        const hay = (r.st+' '+r.kn+' '+r.ch+' '+r.sec+' '+r.y+' '+r.q).toLowerCase();
        if(!hay.includes(state.text)) return false;
      }
      return true;
    });
  }

  function render(){
    const rows = filtered();
    const pts = rows.reduce((a,r)=>a+r.p,0);
    $('#hitN').textContent = rows.length;
    $('#hitP').textContent = pts;

    let t='全部题目', sub='', crumb='INDEX / ALL';
    if(state.scope==='kp'){
      const m = rows[0];
      t = m ? m.kn : state.kp;
      crumb = 'INDEX / '+state.subj+' / '+state.ch;
      sub = '知识点 '+state.kp+' · 所在章：'+state.ch;
    } else if(state.scope==='ch'){
      t = state.ch; crumb='INDEX / '+state.subj; sub = SUBJ[state.subj]+' · 本章收录';
    } else if(state.scope==='subj'){
      t = SUBJ[state.subj]; crumb='INDEX / '+state.subj; sub='本科目全部题目';
    } else {
      sub = '共 '+totQ+' 题；点击左侧目录可按科目 / 章 / 知识点下钻';
    }
    $('#viewTitle').textContent = t;
    $('#crumb').textContent = crumb;
    $('#viewSub').textContent = sub + ' · 命中 ' + rows.length + ' 题 / ' + pts + ' 分';

    const list = $('#list');
    list.innerHTML='';
    if(!rows.length){
      list.appendChild(el('div','empty','<b>没有匹配的题目</b>换个关键词，或点「重置」'));
      return;
    }
    const byYear = {};
    rows.forEach(r=>{ (byYear[r.y] = byYear[r.y]||[]).push(r); });
    Object.keys(byYear).sort().forEach((y,gi)=>{
      const block = el('section','yearblock');
      block.id = 'y-'+y;
      const ys = byYear[y];
      block.appendChild(el('div','yearhead',
        '<span class="yy">'+y+'</span><span class="yc">'+ys.length+' 题 · '+
        ys.reduce((a,r)=>a+r.p,0)+' 分</span>'));
      ys.forEach((r,i)=>{
        const wrap = el('div','qwrap');
        wrap.id = 'q-'+r.y+'-'+r.q;
        const row = el('div','q');
        row.style.setProperty('--ac', ACC[r.s]);
        const typeLbl = r.t ? '综合' : '选择';
        const hasX = !!(r.x || r.o);
        row.innerHTML =
          '<div class="qno">'+r.q+'<span>'+r.y+'</span></div>'+
          '<div class="qbody">'+
            '<div class="qstem">'+esc(r.st)+'</div>'+
            '<div class="qtags">'+
              '<span class="tag type '+(r.t?'t1':'')+'">'+typeLbl+'</span>'+
              '<span class="tag ch">'+esc(r.ch)+'</span>'+
              '<span class="tag kp" data-kp="'+r.kp+'">'+esc(r.kn)+'</span>'+
              (r.a?'<span class="tag ans">答案 '+r.a+'</span>':'')+
              (hasX?'<button class="xbtn">▾ 解析</button>'
                   :'<span class="tag nox">暂无解析</span>')+
            '</div>'+
          '</div>'+
          '<div class="qpts"><b>'+r.p+'</b>分</div>'+
          '<button class="copylink" title="复制直达链接">#link</button>';
        row.querySelector('.copylink').onclick = ev=>{
          ev.stopPropagation();
          const url = location.href.split('#')[0]+'#q='+r.y+'-'+r.q;
          const done = ()=>{ ev.target.textContent='copied';
                             setTimeout(()=>ev.target.textContent='#link',1200); };
          try{
            if(navigator.clipboard && navigator.clipboard.writeText){
              navigator.clipboard.writeText(url).then(done).catch(()=>prompt('复制链接：',url));
            } else { prompt('复制链接：',url); }
          }catch(e){ prompt('复制链接：',url); }
        };
        row.querySelector('.tag.kp').onclick = ev=>{
          ev.stopPropagation();
          go({scope:'kp', kp:r.kp, subj:r.s, ch:r.ch});
        };
        row.querySelector('.tag.ch').onclick = ev=>{
          ev.stopPropagation();
          go({scope:'ch', subj:r.s, ch:r.ch});
        };
        const xb = row.querySelector('.xbtn');
        if(xb){
          const exp = el('div','qexp');
          exp.hidden = true;
          const parts = [];
          if(r.im) parts.push('<div class="qimg">'+
            '<img loading="lazy" src="'+r.im+'" alt="本题插图">'+
            (r.imscan?'<span class="imtag">原卷截图</span>':'')+'</div>');
          if(r.t===1 && r.fs) parts.push('<div class="fs rt">'+richText(r.fs)+'</div>');
          if(r.o) parts.push('<ol class="olist">'+
            r.o.map((o,k)=>'<li class="'+(r.a && 'ABCD'[k]===r.a?'ok':'')+'">'+
              '<b>'+'ABCD'[k]+'.</b> '+esc(o)+'</li>').join('')+'</ol>');
          if(r.a) parts.push('<div class="aline">正确答案：<b>'+r.a+'</b></div>');
          if(r.x) parts.push('<div class="xbody rt"><b>'+(r.t===1?'参考答案与思路：':'解析：')+
            '</b>'+richText(r.x)+'</div>');
          exp.innerHTML = parts.join('');
          xb.onclick = ev=>{
            ev.stopPropagation();
            exp.hidden = !exp.hidden;
            xb.textContent = exp.hidden ? '▾ 解析' : '▴ 收起';
          };
          wrap.appendChild(row); wrap.appendChild(exp);
        } else {
          wrap.appendChild(row);
        }
        block.appendChild(wrap);
      });
      list.appendChild(block);
    });
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  /* ---- 段落 / 代码块渲染：保留换行与缩进，自动识别代码 ---- */
  function isCode(lines){
    const ls = lines.filter(function(l){ return l.trim(); });
    if(!ls.length) return false;
    if(ls.length === 1){
      const t = ls[0];
      return /[{};]\s*$/.test(t) && /[=<>()]|\[/.test(t) && t.trim().length > 6;
    }
    const hit = ls.filter(function(l){
      return /[{};]/.test(l) || /^\s{2,}\S/.test(l) ||
             /^\s*(for|while|if|else|return|int|void|char|struct|typedef|float|double|long|unsigned|printf|scanf|malloc|free|sizeof|push|pop)\b/.test(l);
    });
    if(hit.length >= Math.ceil(ls.length * 0.5)) return true;
    const short = ls.filter(function(l){ return l.trim().length <= 20; }).length;
    return ls.length >= 3 && short >= Math.ceil(ls.length * 0.7);
  }
  function joinCJK(lines){
    var out = '';
    lines.forEach(function(l){
      l = l.trim();
      if(!l) return;
      if(!out){ out = l; return; }
      var a = out.slice(-1), c = l.charAt(0);
      var cjkA = /[\u4e00-\u9fff，。；：、）】》？！]/.test(a);
      var cjkB = /[\u4e00-\u9fff（【《]/.test(c);
      out += (cjkA || cjkB) ? l : (' ' + l);
    });
    return out;
  }
  function richText(s){
    if(!s) return '';
    var raw = String(s).replace(/\t/g, '    ');
    var blocks = [], cur = [];
    raw.split('\n').forEach(function(ln){
      if(!ln.trim()){ if(cur.length){ blocks.push(cur); cur = []; } }
      else cur.push(ln);
    });
    if(cur.length) blocks.push(cur);
    return blocks.map(function(b){
      if(isCode(b)) return '<pre class="code">' + esc(b.join('\n')) + '</pre>';
      return '<p class="para">' + esc(joinCJK(b)) + '</p>';
    }).join('');
  }

  /* ---------- deep link on load ---------- */
  function fromHash(){
    const h = decodeURIComponent(location.hash.slice(1));
    if(!h || h==='all'){ go({scope:'all'}); return; }
    const mQ = h.match(/^q=(\d{4})-(\d+)$/);
    const mK = h.match(/^kp=(.+)$/);
    const mC = h.match(/^ch=([^/]+)\/(.+)$/);
    const mS = h.match(/^subj=(.+)$/);
    if(mQ){
      const y=mQ[1], q=mQ[2];
      const row = ROWS.find(r=>String(r.y)===y && String(r.q)===q);
      if(row){ state.type='all'; state.text=''; go({scope:'all'}); }
      setTimeout(()=>{
        const node = document.getElementById('q-'+y+'-'+q);
        if(node){ node.scrollIntoView({block:'center',behavior:'smooth'});
          node.classList.add('flash'); setTimeout(()=>node.classList.remove('flash'),1600); }
      },60);
      return;
    }
    if(mK){ const r = ROWS.find(x=>x.kp===mK[1]); go({scope:'kp',kp:mK[1],subj:r?r.s:null,ch:r?r.ch:null}); return; }
    if(mC){ go({scope:'ch',subj:mC[1],ch:mC[2]}); return; }
    if(mS){ go({scope:'subj',subj:mS[1]}); return; }
    go({scope:'all'});
  }

  $('#menuBtn').onclick = ()=> $('#sb').classList.toggle('open');
  window.addEventListener('hashchange', fromHash);

  render();
  fromHash();
})();
</script>
