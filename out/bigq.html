始坑=0，铁锹水桶均\n可用，定义尽可能少的信号量，用 wait（）和signal（）。操作描述植树过程中三人的同步互\n斥关系，并说明所用信号量的作用及其初值。\n\n约束类型 具体要求\n实现方式\n流程顺序 挖坑→放树苗→填土→浇水\n同步信号量\n坑数限制 坑数量 \u003c 3\n计数信号量\n资源互斥 铁锹(甲乙共用)，水桶(丙独用) 互斥信号量\n参与者分工\n甲: 挖坑(需要铁锹)\n乙: 放树苗 + 填土(填土需要铁锹)\n丙: 浇水(需要水桶)\n信号量设计\n信号量 类型 初值 作用\n使用者\nempty\n计数 3\n控制坑数上限(\u003c3)\n甲申请，乙释放\nholes\n计数 0\n已挖好的坑数量\nready\n计数 0\n已种好待浇水的树\n甲生产，乙消费\n乙生产，丙消费\nshovel\n互斥 1\n铁锹互斥访问\n甲乙共用\n说明：水桶仅丙使用且单线程，为\"尽可能少\"省略bucket 信号量\n同步互斥代码实现\n甲(挖坑进程)\n甲() {\n    while (true) {\nwait(empty); // 确保坑数\u003c3\nwait(shovel); // 申请铁锹\n挖坑();\nsignal(shovel); // 释放铁锹\nsignal(holes); // 增加可用坑数\n    }\n}\n乙(种树填土进程)\n乙() {\n    while (true) {\nwait(holes);\n放树苗();\nwait(shovel);\n// 等待有坑可用\n  // 不需要工具\n// 申请铁锹填土\n填土();\nsignal(shovel); // 释放铁锹\nsignal(ready); // 增加待浇水树数\nsignal(empty); // 释放坑位容量\n    }\n}\n\n丙(浇水进程)\n丙() {\n    while (true) {\n// 等待有树需浇水\nwait(ready);\n浇水();\n// 使用水桶(单线程无需互斥)\n    }\n}\n信号量作用机制分析\n同步关系实现\n同步关系 实现信号量\n机制说明\nholes\n甲→乙\n乙→丙\nready\n甲生产坑，乙消费坑\n乙生产待浇水树，丙消费\n坑数控制 empty + holes 有界缓冲区模型\n互斥关系实现\n互斥资源 实现信号量 竞争进程 使用场景\n铁锹\nshovel\n甲、乙\n甲挖坑，乙填土\n水桶\n省略\n仅丙\n单线程无竞争\n本方案用4 个信号量实现完整同步互斥：\n•\nempty/holes: 有界缓冲区控制坑数上限\n•\nready: A→B→C 流程同步\n•\nshovel: 铁锹互斥访问\n保证了流程正确性、资源安全性和无死锁特性。\n评分标准\n信号量定义（2 分）\n完整性（1 分）\n正确定义了所有必要的信号量，包括控\n制资源（铁锹）互斥使用的信号量和控\n制树坑数量的信号量，可得 2 分。\n如果遗漏了控制资源互斥的信号量（如\nmutex1 或mutex2）或者遗漏了控制树\n坑数量的empty 信号量，扣 1 分。\n如果信号量定义完全错误，得 0 分。\n正确性（1 分）\n所定义的信号量初值正确，可得 1 分。\n若有信号量初值设置错误，扣 1 分。\n进程同步互斥描述（3 分）\n进程操作完整性（2 分）\n对甲、乙、丙三个进程的操作都使用wait()和signal()\n进行了正确描述，包括对资源获取和释放的操作以及\n对树坑数量控制的操作，可得 3 分。\n如果只正确描述了两个进程的操作，扣 1 分。\n如果只正确描述了一个进程的操作，扣 2 分。\n如果三个进程的操作都描述错误，得 0 分。\n操作顺序正确性（1 分）\n每个进程中的wait()和signal()操作顺序正确，符合逻\n辑，可得 1 分。\n若存在操作顺序错误（例如在没有获取资源之前就释\n放资源等逻辑错误），扣 1 分。\n解释与说明（2 分）\n信号量作用解释（1 分）\n对所定义的每个信号量的作用都进\n行了准确的解释，可得 1 分。\n若有信号量作用解释错误或者遗漏\n某个信号量的解释，扣 1 分。\n信号量初值解释（1 分）\n对信号量初值的设定依据进行了合\n理准确的解释，可得 1 分。\n若初值解释错误或者不合理，扣 1\n分。\n\nϰϲ.【9 分】某进程的虚拟地址空间如下图所示，阴影部分为未占用区域。\n内核区\n阴影处\n用户栈\n运行时堆\n可读写数据区\n只读代码区\n题46 图\n另现有 C 程序代码：\nchar*ptr；\nvoid main（）{\nint length；\nptr =（char*）malloc（size of（char））；\nscanf（\"%s\"，ptr）；\nlength = strlen（ptr）；\nprintf（\"length=%din\"，length）；\nfree（ptr）；\n}\n请回答下列问题，并说明理由。\n（1）上述程序执行时，PCB 位于哪个区域，执行 scanf（）等待键盘输入时，该进程处于什\n么状态？（3 分）\n（2）main（）函数的代码位于哪个区域？其直接调用的哪些函数的功能需要通过执行驱动\n程序实现？（3 分）\n（3）变量 ptr 被分配在哪个区域？若变量 length 没有被分配在寄存器中，则会被分配在哪\n个区域？ptr 指向的字符串位于哪个区域？（3 分）\n虚拟地址空间结构\n区域\n特性\n存储内容\n访问权限\n内核区\n高地址，内核管理 PCB、内核数据结构\n内核态访问\n阴影区\n未映射区域\n空闲虚拟地址空间\n不可访问\n用户栈\n向下增长\n局部变量、函数参数 读写\n运行时堆\n向上增长\n动态分配内存\n读写\n可读写数据区 固定大小\n全"},{"y":2025,"q":46,"p":7,"s":"OS","ch":"操作系统概述","kp":"OS.1.3","kn":"中断异常处理/链接装入/内存映像","st":"【9 分】某进程的虚拟地址空间如下图所示，阴影部分为未占用区域。\n内核区\n阴影处\n用户栈\n运行时堆\n可读写数据区\n只读代码区\n题46 图\n另现有 C 程序代码：\nchar*ptr；\nvoid main（）{\nint length；\nptr =（char*）malloc（size of（char））；\nscanf（\"%s\"，ptr）；\nlength = strlen（ptr）；\nprintf（\"length=%din\"，length）；\nfree（ptr）；\n}\n请回答下列问题，并说明理由。\n（1）上述程序执行时，PCB 位于哪个区域，执行 scanf（）等待键盘输入时，该进程处于什\n么状态？（3 分）\n（2）main（）函数的代码位于哪个区域？其直接调用的哪些函数的功能需要通过执行驱动\n程序实现？（3 分）\n（3）变量 ptr 被分配在哪个区域？若变量 length 没有被分配在寄存器中，则会被分配在哪\n个区域？ptr 指向的字符串位于哪个区域？（3 分）","sol":""},{"y":2025,"q":47,"p":9,"s":"NET","ch":"计算机网络概述","kp":"NET.1.1","kn":"网络定义/组成/分类与性能指标","st":"【9 分】如题47 图所示，卫星天通一号的轨道高度是36000km，电磁波传播速度为\n300000km/s。TR1 和TR2 用于收发卫星信号，采用全双工调制解调，其收发速率为200Kbps。\n\n请回答下列问题，并说明理由。\n（1）忽略卫星信号中继，TR1，TR2 调制解调开销，则R1 到R2 之间的卫星链路单向传播\n时延是多少？主机 H 向总部服务器传输数据时可达到的最大吞吐量是多少？\n若忽略各层协议首部开销，以及以太网的传播时延，则 H→sever 上传一个 4000B 的文件，\n至少需要多长时间？（3 分）\n（2）基于 GBN 为卫星链路设计单向可靠的链路层协议 SLP，支持 R1→R2 发送数据。SLP\n数据帧长1500B，忽略ACK 帧长度，要求SLP 单向信道利用率不低于80%，则发送窗口至少\n为多少？SLP 帧序号至少为多少？（3 分）\n（3）总部给工程部分配IP 地址空间10.10.10.0/24，再划分为3 个子网，生活区子网不少于\n120 个，作业子网，管理区子网 IP 均不少于 60 个，H 已正确配置 IP。问作业区子网，管\n理区子网，生活区子网地址各是多少？（3 分）","sol":"","im":"qimg/2025_47.png"},{"y":2026,"q":41,"p":13,"s":"DS","ch":"树与二叉树","kp":"DS.5.9","kn":"二叉排序树（BST）","st":"假定二叉搜索树使用二叉链表存储，存储结构如下:\n给一棵二叉搜索树T 和整数K，查找树中关键字与K 之差的绝对值最小的所有\n结点，并输出该绝对值与结点中的关键字。\n(1)给出算法的基本思想。(4 分)\n(2)使用C/C++描述算法思想。(8 分)","sol":"41.（12 分）假定二叉搜索树使用二叉链接表存储，存储结构如下：\n\n给一棵二叉搜索树T 和整数K，查找树中关键字与K 之差的绝对值最小的所有\n结点，并输出该绝对值与结点中的关键字。\n\n(1)给出算法的基本思想。(4 分)\n(2)使用C/C++描述算法思想。(8 分)\n（1）叉搜索树的中序序列递增。与K差值绝对值最小的结点只可能出现在：小于\n等于K的最大结点（前驱）；大于等于K的最小结点（后继）。从根开始查找K，\n若找到则直接输出（绝对差0）；否则在查找路径中记录最接近K的结点作为候选\n（前驱/后继）。比较前驱和后继与K的差值，输出绝对值最小的所有结点。\n（2）\n\n26 考研408 真题及解析\n18"},{"y":2026,"q":42,"p":10,"s":"DS","ch":"栈、队列和数组","kp":"DS.3.1","kn":"栈的基本概念与进出栈序列","st":"栈的基本操作有出栈和入栈，将序列1,2,3,…,n 依次入栈，回答下列问题:\n(1)当n=9 时，可以得到出栈序列{2,3,1,6,4,7,5,4,8}吗?可以得到出栈序列吗?(2 分)\n(2)假设1,2,3,…,n 组成任意序列的出栈序列P₁,P₂,…,Pₙ，在序列中有Pᵢ、Pⱼ、\nPₖ(i\u003cj\u003ck)，若该出栈序列不能由栈得到，则Pᵢ、Pⱼ、Pₖ的大小关系是?(2 分)\n(3)若n=4，则2 开头的序列个数有多少个?(2 分)\n(4)若n=k-1 时，出栈序列总共有M 个，如果n=k，那么以1 开头的出栈序列个\n数有多少个?以2 开头的出栈序列有多少个?总共的出栈序列有多少个?(4 分)","sol":"42.（10分）栈的基本操作有出栈和人栈，将序列1，2.3,...,n依次人栈，回答下列\n问题:\n(1)当n=9时，能否得到出栈序列{2,3,1,6.4,7,5.9,8)？能否得到出栈序列{2,3,1,5.6,7,4.\n9,8}？(2分)\n(2)假设1,2,3....n组成任意序列的出栈序列 P1,P2…Pn,在序列中有Pi、Pj、Pk(i＜j\u003c\nk)，若该出栈序列不能由栈得到，则Pi、Pj、Pk的大小关系是？(2分)\n(3)若n=4.则2开头的序列的个数有多少个？(2分)\n(4)若n=k-1时,出栈序列总共有M个，如果n=k,那么以1开头的出栈序列个数有多少\n个？以2开头的出栈序列有多少个？总共的出栈序列有多少个？(4分)\n\n(1) 序列{2,3,1,6,4,7,5,9,8}：不能（出4时栈顶为5，不合法）。序列{2,3,1,5,6,7,4,9,\n8}：能（模拟可行）。\n(2) 若出栈序列不能由栈得到，则存在\n使\n（即“大中小”顺\n序）。\n(3) n=4时，2开头的合法出栈序列有5个（枚举：2134,2143,2314,2341,2431）。\n(4) n=k时：以1开头的个数：M（1首先出栈，剩余k-1个数出栈序列数即为M）。\n以2 开头的个数：M（2 首先出栈，则1 被压栈底必须最后出，剩余k-1 个数出\n栈序列数为M）。总个数：\n（卡特兰数递推公式）。"},{"y":2026,"q":43,"p":13,"s":"CO","ch":"中央处理器","kp":"CO.5.2","kn":"数据通路的功能和基本结构","st":"(10 分)某16 位计算机c 按字编址，通用寄存器R0~R15 的编号为0~15，存\n储器地地为16 位，采用定长指令字，指令格有R,I 和M 型如下所示。\n其中OP1 为0001,0010 分别表示加，左移指令，OP2 为0100 表示加立即数指令。\nOP3 为1110、1111 分别表示取数、存数指令，R[r]表示寄存器r 中的内容，num\nR 型\n0000\nrt\nrs/num\nop1\nR[rt]←R[rt]op1R[rs];\nR[rt]←R[rt]op1num\nI 型\nop2\nrt\nimm8\nR[rt]←R[rt]op2 imm8\nM 型\nop3\noffset\noffset\nR[0]←M[R[15]+offset];\nM[R[15]+offset]←R[0]\ntypedef struct BSTNode{\nint data;\nstruct BSTNode *left,*right;\n} BSTNode;\ntypedef BSTNode BTNode;\n\n表示移位位数，M[addr]表示储存器地址addr 中的内容，请回答下列问题\n(1)主存单元和通用寄存器的宽变合为的少位?(2 分)\n(2)OP1 和OP2 的编码是否可以相同?OP2 和OP3 的编码是否可以相同?(2 分)\n(3)若R(2)=ABCDH，R(9)=F001H 则指令0000 0010 1001 0001 执行后，R2 和R9\n中内容分别是多少?(2 分)\n(4)若变量x,y 均为16 位带符号整数，在存储器中依次从低地址向高地址连续存\n放，x 的地址在R15 中，实现y=16*x-5 的4 条指令I1~I4 如题43 表所示，写出\n①~④处的内容(4 分)\n题43 表\n21:\n①\n0000 0000 0000 0000\n22: 0000\n②\n0010\n23: 0100 0000\n③\n24: 1111\n④","sol":"43. (10分)某16位计算机c按字编址,通用寄存器RO~R15的编号为0-15,存储器地\n\n26 考研408 真题及解析\n19\n地为16位，采用定长指令字，指令格有R,和M型如下所示。\n\n其中OP1为0001.0010分别表示加.左移指令.OP2为0100表示加立即数指令.OP3为1\n110、1111分别表示取数、存数指令，R[r］表示寄存器r中的内容，num表示移位\n位数,M[addr]表示储存器地址addr中的内容，请回答下列问题:\n(1存储单元的位数是多少?寄存器的位数是是多少？(2分)\n(2)op1和op2的编码能不能相同？op2和op3的编码能不能相同？(2分)\n(3)若R(2)=ABCDH,R(9)=F001H,则指令0000 0010 1001 0001执行后,R2和R9中内\n容分别是多少？(2分)\n(4)X变量和y变量在内存中是连续的，从低地址到高地址存放的，现在一条C语言\n代码:y=x*16-5，可以用上边的指令完成，共4条指令，给定了每条指令的部分的\n机器码。变量x,y均为16位带符号整数，在存储器中是连续的，依次从低地址向高\n地址连续存放,x的地址在R15中，实现y=16*x-5的指令共四条11~14,写出1~4处的\n内容(4分)\n\n(1) 存储单元位数＝字长＝16位；寄存器编号0～15，共16个，位数与字长一致，\n为16位。\n(2)op1与op2可相同，因op1在R型指令低4位，op2在I型指令高4位，位置不同，不\n会混淆（但需保证op2≠0000，否则与R型标志冲突）。op2与op3不可相同，因二\n者均在指令高4位，若相同则无法区分I型与M型指令。\n(3) 指令0000 0010 1001 0001为R型加法：R[2]←R[2]+R[9]。R[2]=ABCDH，R\n[9]=F001H，相加得1 9BCEH（进位舍去），故R[2]=9BCEH，R[9]不变，为F00\n1H。\n(4) 变量x、y按字编址，地址差1。指令序列及机器码如下：\n\n26 考研408 真题及解析\n20"},{"y":2026,"q":44,"p":10,"s":"CO","ch":"中央处理器","kp":"CO.5.2","kn":"数据通路的功能和基本结构","st":"(15 分)假定43 题中计算机C 的部分数据通路如题44 所示。\n(1)①②是同一类部件，其名称是什么(1 分)\n(2)I 型指令中imm8 可以是带符号或无符号整数，M 型指令中offset 是带符号整\n数，则EXtOP 至少有几位?为什么?(2 分)\n(3)取指周期中MARSrC、ALUA SrC、ALUB SrC、RegWr 的取值各是什么?(4 分)\n(4)左移指令周期中ALUB SrC、Regwsrc、RegDst、Regwr 的取值各是什么?Extop\n是否可以与M 型指令中的EXtop 相同?为什么?(2 分)\n44. (7 分)系统采用优先权(优先权越大优先级越大)和时间片轮转调度算法，只有\n在发生时间中断的时候才运行抢占CPU，时间中断间隔是10ms，当进程进入就\n绪队列时候，时间片是50ms，当进程是时间片用完重新回到就绪队列时，优先\n权值的大小减1；当进程是被更高优先级抢占回到就绪队列时，优先权值的大小\n不变。优先权相等的时候，先进入就绪队列的被优先调度。4 个进程的到达时刻、\n初始优先权、CPU 运行时间如下表所示:\n\n进程\n到就绪队列的时间\n优先权(初始)\nCPU 运行时间\nP1\n10ms\n3\n95ms\nP2\n10ms\n4\n20ms\nP3\n12ms\n2\n40ms\nP4\n14ms\n5\n60ms\n(1)在10ms 的时候开始进行进程调度，4 个进程调度结束，中断次数和CPU 调度\n次数分别是?P1,P2,P3,P4 在什么时刻进行第一次调度(5 分)\n(2)时间片由50ms 改为100ms，CPU 的调度次数会增大，不变或减少?如果中断\n间隔从10ms 变为1ms，则系统开销会增大、不变还是减少?(2 分)","sol":"44.（15分）假定43题中计算机C的部分数据通路如44所示。\n\n(1) ①②是同一类部件，其名称是什么?(1分)\n(2)I型指令中imm8可以是带符号或无符号整数,M型指令中offset是带符号整数,则\nEX1OP至少有几位?为什么?(2分)\n(3)取值周期中MARSrC、ALUASrC、ALUBSrC、RegWr的取值各是什么?\n(4分)\n(4)左移指令周期中ALUBSrC、Regwsre、RegDst、RegWr的取值各是什么?(4分)\nExtop是否可以与M型指令中的EXtop相同?为什么?(4分)\n\n（1）①部件名称为指令寄存器（或IR的高低位部分）。\n（2）EX1OP的位数：EX1OP是I型指令的扩展控制信号，用于对imm8进行符\n号扩展（有符号数）或零扩展（无符号数）。imm8为8位，扩展结果至少需16位\n（与ALU输入等宽），故EX1OP至少需要2位，分别选择“符号扩展”、“零扩展”\n或“其他扩展方式”（如低位补零高位符号位等）。\n（3）取指周期控制信号\nMARSrc=0或PC（选择PC作为存储器地址）。ALUASrc=PC（将PC送入ALU的\nA端）。ALUBSrc=4（常数字4，用于PC+4）。RegWr=0（不写寄存器，取指\n\n26 考研408 真题及解析\n21\n阶段不修改寄存器）。\n（4）左移指令周期控制信号\nALUBSrc=shamt（指令中的移位量字段）。RegWrSrc=1或ALU（选择ALU结\n果写入寄存器）。RegDst=rd（目标寄存器为rd字段）。RegWr=1（允许写入寄\n存器）。Extop可否与M型指令的EXtop相同。不可以。I型指令的Extop对8位立即\n数imm8进行扩展（扩展至16位）。M型指令的EXtop对offset 进行扩展（通常off\nset位数与imm8不同，如5位或6位）。扩展的位数和含义不同，控制逻辑不同，故\nExtop不能与M型指令的EXtop相同。","im":"qimg/2026_44.png"},{"y":2026,"q":46,"p":7,"s":"OS","ch":"文件管理","kp":"OS.4.1","kn":"文件概念/元数据/inode/文件操作","st":"(8 分)文件系统的目录项包括文件名和索引节点号，磁盘包含索引节点表、位\n图、目录、文件数据等元数据，若盘块大小为4KB，盘号是4B，索引节点表存\n放了系统的所有文件，从0 开始编号，存放在盘块号100 开始连续的4096 个盘\n块中。索引节点号占128B，包含直接地址项5 个，一级间接地址项、二级间接\n地址项、三级间接地址项各1 个。磁盘位示图和索引节点位示图分别记录磁盘和\n索引节点的使用情况，0 表示未使用，1 表示使用。其中目录结构图和文件的索\n引节点表如下所示，file 文件占30KB。\n(1)file 的索引节点所在的盘块号是多少?若file 的索引节点已经读取到内存，要访\n问file 文件中偏移地址21460 的一个字节数据，则最多需要读多少个盘块?如果\n文件系统中有足够的磁盘空间，则最多可以存放多少个文件?(3 分)\n(2)如果要删除目录dir1，则需要对元数据进行哪些操作?(5 分)","sol":"46.\n\n有磁盘块的位图，还有索引节点的位图，然后一个索引节点应该是128B对于每\n个索引结点中，采用索引结构组织文件，每个索引结点中有5个直接地址项，分\n别有一级间接项，二级间接地址项，三级间接地址项各一个。然后一个磁盘块是\n4KB，索引结点在磁盘中连续存放在4096个磁盘块中，起始盘块号是100。\n(1) 文件file它的索引节点存在几号磁盘块？若要该文件file的索引结点已经在内\n存中了，如果想要读取第21460个字节的数据(只读一个字节)，至少需要访存\n几次？如果磁盘空间大小没有上限请问最多可以创建多少个文件？(3分)\n(2) 是如果要把这个dir1目录删除的话，要动哪些数据结构或者是元数据，怎么操\n作？(5分)\n\n(1)①设文件file的索引节点号为N（由目录项给出），索引节点存放在磁盘块\n号：\n（每个磁盘块存放\n个索引节点）。\n②读取第21460字节（偏移量21459）至少需2次 访存。计算：逻辑块号=\n（从0开始），超出5个直接地址范围，需通过一级间接块寻\n址，故先读间接块（1次），再读数据块（1次）。\n③最多创建文件数由索引节点总数决定：\n个。\n(2) 删除目录 dir1的操作步骤：","im":"qimg/2026_46.png"},{"y":2026,"q":47,"p":9,"s":"NET","ch":"传输层","kp":"NET.5.3","kn":"TCP 段格式/连接管理（三次握手四次挥手）","st":"假设C 建立一条TCP 连接，向服务器Si 上传一个总长度为2000B 的计算任\n务描述文件。\n\n已知C 的拥塞窗口初始阈值为8MSS，MSS=500B，Si 对收到每个TCP 段进行确\n认，且确认段不封装数据。接收窗口rwnd 始终为1000B，RTT=5ms，C 建立连\n接时选择的初始序号为1000，Si 选择的初始序号为2000，SYN、ACK、FIN 为\n标志位，seq 为序号，ack_seq 为确认序号。在整个文件传输过程中未出现任何重\n传或报文丢失\n(1)C 与Si 建立TCP 连接过程需要几次握手?C 收到的SYN=1，ACK=1 的TCP\n段的确认序号是多少?\n(2)当C 接收Si 发送的ACK=1，seq=2001，ack_seq=2001，rwnd=1000 确认段后，\nC 的拥塞窗口增加到多少?C 的发送窗口设置为多少?\n(3)C 与Si 释放TCP 连接过程需要几次挥手?C 收到最后一个TCP 报文段的序号\n(seq)，确认序号(ack_seq)，FIN 的值分别是多少?\n(4)忽略报文段传输时延，且时间从C 请求建立TCP 连接时刻算起，则C 确定\nSi 已成功接收到文件的时间是多少?","sol":"47.假设C建立一条TCP连接向服务器Si上传一个总长度为2000B的计算任务描述\n\n26 考研408 真题及解析\n23\n文件,已知C的拥塞窗初始阈值为8MSS.MSS=500B.Si对收到每个TCP段进行确\n认.且确认段不封装数据。接收窗口rwnd始终为1000B,RTT=5ms,C建立连接时选\n择的初始序号为1000,Si选择的初始序号为2000,SYN、ACK、FIN为标志位,seq为\n序号,ack_seq为确认序号。在整个文件传输过程中未出现任何重传或报文丢失。\n(1) C与Si建立TCP连接过程需要几次握手？C收到的SYN=1,ACK=1的TCP段的确\n认序号是多少？\n(2) 当C接收Si发送的ACK=1,seq=2001,ack_seq=2001,wnd=1000确认段后,C的拥塞\n窗口增加到多少？C的发送窗口设置为多少？\n(3) C与Si释放TCP连接过程需要几次挥手？C收到最后一个TCP报文段的序号seq,\n确认序号ack_seq,FIN的值分别是多少？\n(4) 忽略报文段传输时延,且时间从C请求建立TCP连接时刻算起,则C确定Si已成\n功接收到文件的时间是多少？\n\n(1) 需要3次握手。C收到的SYN=1,ACK=1的TCP段的确认序号是1001（对C的SY\nN的确认）。\n(2) 拥塞窗口增加到2MSS（1000B）。发送窗口设置为1000B（受接收窗口rwnd=1\n000B限制）。\n(3) 需要4次挥手。C收到的最后一个TCP报文段（Si的FIN+ACK段）中，seq=200\n1，ack_seq=3002，FIN=1。\n(4) C确定Si已成功接收到文件的时间是15ms（3个RTT）。","im":"qimg/2026_47.png"}],"subj":{"DS":"数据结构","CO":"计算机组成原理","OS":"操作系统","NET":"计算机网络"}}</script>
<script>
(function(){
  const P = JSON.parse(document.getElementById('payload').textContent);
  const Q = P.rows, SUBJ = P.subj;
  const ACC = {DS:'#1f5fa8',CO:'#a83226',OS:'#1c6b3c',NET:'#96650a'};
  const LK='dsh408_bigq_v1';
  const $=s=>document.querySelector(s);
  const app=$('#app');
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---- 段落 / 代码块渲染：保留换行与缩进，自动识别代码 ---- */
  function isCode(lines){
    const ls = lines.filter(function(l){ return l.trim(); });
    if(!ls.length) return false;
    if(ls.length === 1){
      const t = ls[0];
      return /[{};]\s*$/.test(t) && /[=<>()]|\[/.test(t) && t.trim().length > 6;
    }
    const hit = ls.filter(function(l){
      return /[{};]/.test(l) || /^\s{2,}\S/.test(l) ||
             /^\s*(for|while|if|else|return|int|void|char|struct|typedef|float|double|long|unsigned|printf|scanf|malloc|free|sizeof|push|pop)\b/.test(l);
    });
    if(hit.length >= Math.ceil(ls.length * 0.5)) return true;
    const short = ls.filter(function(l){ return l.trim().length <= 20; }).length;
    return ls.length >= 3 && short >= Math.ceil(ls.length * 0.7);
  }
  function joinCJK(lines){
    var out = '';
    lines.forEach(function(l){
      l = l.trim();
      if(!l) return;
      if(!out){ out = l; return; }
      var a = out.slice(-1), c = l.charAt(0);
      var cjkA = /[\u4e00-\u9fff，。；：、）】》？！]/.test(a);
      var cjkB = /[\u4e00-\u9fff（【《]/.test(c);
      out += (cjkA || cjkB) ? l : (' ' + l);
    });
    return out;
  }
  function richText(s){
    if(!s) return '';
    var raw = String(s).replace(/\t/g, '    ');
    var blocks = [], cur = [];
    raw.split('\n').forEach(function(ln){
      if(!ln.trim()){ if(cur.length){ blocks.push(cur); cur = []; } }
      else cur.push(ln);
    });
    if(cur.length) blocks.push(cur);
    return blocks.map(function(b){
      if(isCode(b)) return '<pre class="code">' + esc(b.join('\n')) + '</pre>';
      return '<p class="para">' + esc(joinCJK(b)) + '</p>';
    }).join('');
  }
  const kOf=r=>r.y+'-'+r.q;
  let marks=load(LK,{});          // key -> 1(会) / 0(不会)
  let S={on:false};

  function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

  const bySubj={},byChap={},byKp={},byYear={};
  Q.forEach(r=>{
    bySubj[r.s]=(bySubj[r.s]||0)+1;
    byChap[r.s+'|'+r.ch]=(byChap[r.s+'|'+r.ch]||0)+1;
    if(!byKp[r.kp]) byKp[r.kp]={n:0,name:r.kn,s:r.s,ch:r.ch};
    byKp[r.kp].n++; byYear[r.y]=(byYear[r.y]||0)+1;
  });

  /* ---------- 起手页 ---------- */
  function home(pre){
    S={on:false};
    pre = pre||{};
    const st={bank:pre.kp?'kp':(pre.chap?'chap':(pre.subj?'subj':(pre.year?'year':'all'))),
              kp:pre.kp||null, chap:pre.chap||null, subj:pre.subj||null,
              year:pre.year||null, wrong:false, order:'shuffle'};
    const modes=[['all','全部综合题'],['subj','按科目'],['chap','按章节'],
                 ['kp','按知识点'],['year','按年份'],['wrong','大题错题本']];
    app.innerHTML=`
      <h1>综合题训练（41–47）</h1>
      <p class="lede">共 <b>${Q.length}</b> 道大题，<b>${Q.filter(r=>r.sol).length}</b> 道带参考答案与解析。
        先自己写思路，再按「显示参考答案与思路」对照，然后自评会不会。</p>

      <div class="step"><label><i>1</i>范围</label>
        <div class="seg" id="banks">
          ${modes.map(([m,t])=>`<button data-b="${m}" class="${st.bank===m?'on':''}">${t}</button>`).join('')}
        </div>
        <div id="panel"></div>
      </div>
      <div class="step"><label><i>2</i>顺序</label>
        <div class="seg" id="order">
          <button data-v="shuffle" class="on">乱序</button>
          <button data-v="year">按年份</button>
        </div>
      </div>
      <div class="go">
        <button class="btn" id="start">开始</button>
        <span class="hint">键盘 <b>空格/Enter</b> 显示答案 · <b>1</b> 会了 · <b>2</b> 不会</span>
      </div>
      <p class="poolinfo" id="pool"></p>`;

    function drawPanel(){
      const p=$('#panel');
      if(st.bank==='all'||st.bank==='wrong'){p.innerHTML='';pool();return;}
      const mk=(items,attr)=>`<div class="panel"><div class="rows" id="rl">${items}</div></div>`;
      if(st.bank==='subj'){
        p.innerHTML=mk(Object.keys(SUBJ).filter(k=>bySubj[k]).map(k=>
          `<button data-v="${k}" class="${st.subj===k?'on':''}" style="--ac:${ACC[k]}">
           ${SUBJ[k]}<small>${bySubj[k]}</small></button>`).join(''));
        $('#rl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
          st.subj=b.dataset.v;drawPanel();};
      } else if(st.bank==='chap'){
        const byS={};Object.keys(byChap).forEach(ck=>{const[s,c]=ck.split('|');(byS[s]=byS[s]||[]).push([c,ck]);});
        p.innerHTML=mk(Object.keys(byS).flatMap(s=>byS[s].sort((a,b)=>byChap[b[1]]-byChap[a[1]])
          .map(([c,ck])=>`<button data-v="${esc(ck)}" class="${st.chap===ck?'on':''}"
            style="--ac:${ACC[s]}">${esc(c)}<small>${byChap[ck]}</small></button>`)).join(''));
        $('#rl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
          st.chap=b.dataset.v;drawPanel();};
      } else if(st.bank==='kp'){
        const list=Object.keys(byKp).sort((a,b)=> a===st.kp?-1:(b===st.kp?1:byKp[b].n-byKp[a].n));
        p.innerHTML=mk(list.map(k=>{const v=byKp[k];return `<button data-v="${k}"
          class="${st.kp===k?'on':''}" style="--ac:${ACC[v.s]}">${esc(v.name)}<small>${v.n}</small></button>`}).join(''));
        $('#rl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
          st.kp=b.dataset.v;drawPanel();};
      } else if(st.bank==='year'){
        p.innerHTML=mk(Object.keys(byYear).sort().map(y=>
          `<button data-v="${y}" class="${st.year==y?'on':''}">${y}<small>${byYear[y]}</small></button>`).join(''));
        $('#rl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
          st.year=+b.dataset.v;drawPanel();};
      }
      pool();
    }
    function pool0(){
      let p=Q.slice();
      if(st.bank==='subj'&&st.subj)p=p.filter(r=>r.s===st.subj);
      if(st.bank==='chap'&&st.chap)p=p.filter(r=>r.s+'|'+r.ch===st.chap);
      if(st.bank==='kp'&&st.kp)p=p.filter(r=>r.kp===st.kp);
      if(st.bank==='year'&&st.year)p=p.filter(r=>r.y===st.year);
      if(st.bank==='wrong')p=p.filter(r=>marks[kOf(r)]===0);
      return p;
    }
    function pool(){const n=pool0().length;$('#pool').innerHTML=`当前 <b>${n}</b> 道大题`;}

    $('#banks').onclick=e=>{const b=e.target.closest('button');if(!b)return;
      $('#banks').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      st.bank=b.dataset.b;st.subj=st.chap=st.kp=st.year=null;drawPanel();};
    $('#order').onclick=e=>{const b=e.target.closest('button');if(!b)return;
      $('#order').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      st.order=b.dataset.v;};
    $('#start').onclick=()=>{
      let p=pool0();
      if(!p.length){alert('这个范围没有大题，换一个试试。');return;}
      if(st.order==='shuffle')p=shuffle(p); else p=p.slice().sort((a,b)=>a.y-b.y||a.q-b.q);
      begin(p);
    };
    drawPanel();
    $('#prog').textContent='';
  }

  /* ---------- 刷题 ---------- */
  function begin(list){ S={on:true,list,i:0,revealed:false,judged:0,ok:0,t0:Date.now()}; render(); }

  function render(){
    if(S.i>=S.list.length) return finish();
    const r=S.list[S.i];
    app.innerHTML=`
      <div class="qhead">
        <span class="qtag">${r.y} 第 ${r.q} 题</span>
        <span class="qtag pt">${r.p} 分</span>
        <span class="qtag" style="background:${ACC[r.s]};color:#fff">${SUBJ[r.s]}</span>
        <span class="qtag kp">${esc(r.kn)}</span>
        ${marks[kOf(r)]===1?'<span class="qtag" style="background:#e6f4ea;color:#1c6b3c;border:1px solid #b7dfc4">标记过：会</span>':''}
      </div>
      <div class="stem rt">${richText(r.st)}</div>
      ${r.im?`<div class="qimg"><img loading="lazy" src="${r.im}" alt="本题插图">`+
        (r.imscan?'<span class="imtag">原卷截图</span>':'')+'</div>':''}
      <div id="solbox"></div>`;
    const bx=$('#solbox');
    if(S.revealed) showSol(r);
    else bx.innerHTML=`<div class="go" style="border-top:0;padding-top:0">
        <button class="btn reveal" id="rv">显示参考答案与思路</button>
        <span class="hint">先自己在纸上写完整思路，再对照</span></div>`;
    const rb=$('#rv'); if(rb) rb.onclick=()=>{S.revealed=true;render();};
    prog();
  }

  function showSol(r){
    const bx=$('#solbox');
    const mine=marks[kOf(r)];
    bx.innerHTML=`
      <div class="sol">
        <h4>参考答案与思路</h4>
        ${r.sol?`<div class="solbody rt">${richText(r.sol)}</div>`
               :`<div class="none">这一年的解析 PDF 是扫描件，暂未提取到文字版。
                  可在 <a href="browse.html#q=${r.y}-${r.q}" target="_blank">题库</a>
                  里对照原题手写，或直接翻解析 PDF。</div>`}
      </div>
      <div class="self">
        <span class="q">自评：这题我会了吗？</span>
        <button class="btn yes" id="yes">会了</button>
        <button class="btn ghost" id="no">不会，进错题本</button>
        <span class="hint">${mine===undefined?'':(mine===1?'上次：会':'上次：不会')}</span>
      </div>
      <div class="nav">
        ${S.i>0?'<button class="btn ghost" id="prev">上一题</button>':''}
        <button class="btn" id="next">${S.i+1>=S.list.length?'查看小结':'下一题'}</button>
      </div>`;
    $('#yes').onclick=()=>{mark(r,1);};
    $('#no').onclick=()=>{mark(r,0);};
    const pv=$('#prev'); if(pv) pv.onclick=()=>{if(S.i>0){S.i--;S.revealed=false;render();}};
    $('#next').onclick=()=>{S.i++;S.revealed=false;render();};
    const nx=$('#next'); if(nx) nx.focus();
  }

  function mark(r,val){
    marks[kOf(r)]=val; save(LK,marks);
    S.judged++; if(val===1) S.ok++;
    S.i++; S.revealed=false; render();
  }

  function prog(){
    $('#prog').textContent=`第 ${Math.min(S.i+1,S.list.length)} / ${S.list.length} 题`;
  }

  /* ---------- 小结 ---------- */
  function finish(){
    S.on=false;
    const n=S.list.length;
    const recs=S.list.map(r=>({r, m:marks[kOf(r)]}));
    const ok=recs.filter(x=>x.m===1).length;
    const judged=recs.filter(x=>x.m!==undefined).length;
    const bad=recs.filter(x=>x.m===0);
    const secs=Math.round((Date.now()-S.t0)/1000);
    app.innerHTML=`
      <h1>本轮小结</h1>
      <div class="big">${ok} / ${judged||0}</div>
      <div class="bigsub">自评「会」${ok} 道 · 已判定 ${judged} 道 · 共 ${n} 道 · 用时 ${Math.floor(secs/60)} 分 ${secs%60} 秒</div>
      ${bad.length?`<h3 style="font-family:var(--serif);font-size:17px;margin:18px 0 2px">需要再看一遍（${bad.length}）</h3>
        ${bad.map(x=>`<div class="rev"><div class="top"><span>${x.r.y}-${x.r.q}</span>
          <span>${esc(x.r.kn)}</span>
          <a href="browse.html#q=${x.r.y}-${x.r.q}" target="_blank" style="color:#a83226;text-decoration:none">原题</a>
          </div></div>`).join('')}`:''}
      <div class="go">
        <button class="btn" id="again">再来一轮</button>
        <button class="btn ghost" id="onlyno">只练不会的（${Object.values(marks).filter(v=>v===0).length}）</button>
        <button class="btn ghost" id="home">换一个范围</button>
      </div>`;
    $('#again').onclick=()=>begin(shuffle(S.list));
    $('#onlyno').onclick=()=>{
      const p=Q.filter(r=>marks[kOf(r)]===0);
      if(!p.length){alert('还没有标记"不会"的大题。');return;}
      begin(shuffle(p));
    };
    $('#home').onclick=()=>home({});
    $('#prog').textContent='小结';
  }

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown',e=>{
    if(!S.on) return;
    if(!S.revealed && (e.key===' '||e.key==='Enter')){ e.preventDefault();
      const b=$('#rv'); if(b) b.click(); return; }
    if(S.revealed){
      if(e.key==='1'){e.preventDefault();const b=$('#yes');if(b)b.click();}
      if(e.key==='2'){e.preventDefault();const b=$('#no');if(b)b.click();}
      if(e.key==='Enter'){e.preventDefault();const b=$('#next');if(b)b.click();}
    }
  });
  $('#quit').onclick=()=>{
    if(S.on && S.judged && !confirm('退出本轮？已自评的记录已保存。')) return;
    home({});
  };

  /* ---------- 启动（支持 ?kp= / ?chap= / ?subj= / ?year=） ---------- */
  const qp=new URLSearchParams(location.search);
  home({kp:qp.get('kp')||null, chap:qp.get('chap')||null,
        subj:qp.get('subj')||null, year:qp.get('year')?+qp.get('year'):null});
})();
</script>
</body>
</html>
